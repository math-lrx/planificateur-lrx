1-2 cm. Plus les dés seront petits, plus ils seront rapides à cuire. Effeuillez et ciselez finement le {persil}."},{"titre":"Un tour au four","contenu":"Répartissez la carotte, les pommes de terre, la courgette et l'oignon sur une plaque recouverte de papier sulfurisé. Arrosez-les d'un filet d'{huile_d_olive} et d'{origan_seche} (gardez le reste pour le poulet). Salez et poivrez. Mélangez bien et enfournez 25-30 min, ou jusqu'à ce que les légumes soient tendres et dorés sur le dessus.","astuce_chef":"Utilisez deux plaques de cuisson si vous êtes nombreux à table."},{"titre":"Habillage pour le poulet","contenu":"Posez votre main à plat sur le {filet_de_poulet} et coupez-le dans l'épaisseur afin d'obtenir deux fines tranches par personne. Faites-le avec chaque filet. Dans une assiette creuse, mélangez la {farine} avec du sel. Dans une deuxième assiette, battez l'{oeuf} et dans une troisième, mélangez l'ail avec la {chapelure_panko}, l'origan séché et une bonne pincée de sel et de poivre. Trempez successivement le poulet dans la farine, puis dans l'œuf, et enfin dans la chapelure."},{"titre":"La poêle prend le relais","contenu":"Faites chauffer une grande poêle à feu moyen-vif et ajoutez-y suffisamment d'{huile_de_tournesol} pour en recouvrir le fond. Lorsque l'huile est bien chaude, faites-y cuire le poulet en plusieurs fois, 3-4 min de chaque côté, ou jusqu'à ce qu'il soit doré à l'extérieur et qu'il ne soit plus rose à cœur. Réservez-le sur une assiette recouverte d'essuie-tout. Si vos légumes ne sont pas encore prêts, couvrez-le également de papier d'aluminium pour qu'il reste chaud."},{"titre":"Mélange gourmand","contenu":"Dans un bol, mélangez la {mayonnaise} avec le persil. Une fois les légumes cuits, émiettez le {fromage_a_la_grecque} au-dessus des légumes rôtis. Rectifiez l'assaisonnement selon votre goût."},{"titre":"Ding, c'est prêt !","contenu":"Disposez le poulet crispy (découpez-le en tranches si vous le souhaitez) ainsi que les légumes rôtis dans les assiettes. Servez la mayonnaise au persil à côté."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":1183},{"id":"R053","nom":"Poulet croustillant façon Katsu japonais","sous_titre":"avec du coleslaw & une mayo au soja","source":"HelloFresh","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":25,"cuisson_min":null,"total_min":35},"ustensiles":["Bol","Casserole avec couvercle","Saladier","Passoire","Poêle","3 assiettes creuses"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment œuf, gluten via la farine et la chapelure panko, soja, sésame, moutarde via la mayonnaise). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le poulet pané perd tout son croustillant au réchauffage, le coleslaw est meilleur frais. Recette conçue pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Riz","quantite_par_portion":65,"unite":"g","placeholder":"riz"},{"nom":"Filet de poulet","quantite_par_portion":150,"unite":"g (cru)","placeholder":"filet_de_poulet"},{"nom":"Mélange de carotte, chou rouge et blanc","quantite_par_portion":150,"unite":"g","placeholder":"melange_carotte_chou"},{"nom":"Citron","quantite_par_portion" et mise au four avec pommes de terre","contenu":"À l'intérieur du poulet, placez la {branche_de_romarin}, quelques {olives_vertes} et les {croutons_de_pain_rassis} près de l'ouverture. Épluchez les {pommes_de_terre} et coupez-les en gros quartiers. Déposez le poulet dans un plat à four et entourez-le des olives vertes restantes et des pommes de terre. Glissez le plat au four et faites rôtir le poulet pendant 10 min. Arrosez-le du jus de cuisson, baissez la température du four à 160°C (th. 5-6), et faites-le cuire pendant 1h30 en l'arrosant très souvent au cours de la cuisson."},{"titre":"Haricots verts vapeur (ajout)","contenu":"Équeutez les {haricots_verts}. Faites-les cuire à la vapeur ou à l'eau bouillante salée 8-10 minutes, jusqu'à ce qu'ils soient tendres mais encore légèrement croquants. Égouttez et réservez au chaud."},{"titre":"Service","contenu":"Servez le poulet rôti accompagné des pommes de terre et des haricots verts vapeur."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R055","nom":"Poulet rôti au piment fumé & pommes grenailles","sous_titre":"avec des carottes fondantes & une laitue à partager","source":"Recette (fiche livre de cuisine, p.118)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":120,"total_min":170},"ustensiles":["Cocotte allant au four","Four","Casserole (infusion et cuisson des pommes grenailles)","Casserole ou cuiseur vapeur (carottes)","Saladier"],"conservation_note":"La laitue vinaigrette doit être assaisonnée et servie fraîchement au moment de chaque repas, jamais préparée à l'avance, si le plat est reconsommé sur plusieurs repas.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre et le parmesan, poisson via la sauce anglaise type Worcestershire). Se référer aux étiquettes des produits achetés.","classification_conservation_re on":null,"unite":"pincée (pour l'ensemble)","placeholder":"piment_doux_fume","categorie":"à ajouter soi-même"},{"nom":"Sel & poivre (poulet)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_poulet","categorie":"à ajouter soi-même"},{"nom":"Gros sel","quantite_par_portion":1.67,"unite":"g","placeholder":"gros_sel","categorie":"à ajouter soi-même"},{"nom":"Romarin","quantite_par_portion":0.33,"unite":"brin(s)","placeholder":"romarin"},{"nom":"Ail (pommes grenailles)","quantite_par_portion":0.33,"unite":"gousse(s)","placeholder":"ail_pommes_grenailles"},{"nom":"Feuille de laurier","quantite_par_portion":0.17,"unite":"pièce(s)","placeholder":"feuille_de_laurier"},{"nom":"Parmesan","quantite_par_portion":20.83,"unite":"g","placeholder":"parmesan"},{"nom":"Oignon frit","quantite_par_portion":16.67,"unite":"g","placeholder":"oignon_frit"},{"nom":"Oignon rouge","quantite_par_portion":0.33,"unite":"pièce(s)","placeholder":"oignon_rouge"},{"nom":"Huile d'olive","quantite_par_portion":2.5,"unite":"cl","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Vinaigre de xérès","quantite_par_portion":0.83,"unite":"cl","placeholder":"vinaigre_de_xeres","categorie":"à ajouter soi-même"},{"nom":"Vinaigre balsamique","quantite_par_portion":0.83,"unite":"cl","placeholder":"vinaigre_balsamique","categorie":"à ajouter soi-même"},{"nom":"Sauce anglaise","quantite_par_portion":0.17,"unite":"cs","placeholder":"sauce_anglaise","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Préparation du poulet","contenu":"Sortir le {poulet_jaune} et le beurre du réfrigérateur 1 heure avant de commencer la recette. Préchauffer le four à 160°C. Badigeonner le poulet de {beurre} mou avec les mains de l'intérieur du poulet vers l'extérieur, puis l'assaisonner de {sel_poivre_poulet} et de {piment_doux_fume} à l'intérieur et à l'extérieur."},{"titre":"Garniture intérieure","contenu":"Éplucher et couper en deux 1 {oignon}, 2 {echalote} et 2 {ail_poulet}. Garnir l'intérieur du poulet de l'ensemble et ajouter le {thym}."},{"titre":"Cuisson en cocotte","contenu":"Dans une cocotte allant au four, faire chauffer l'{huile_neutre} avec le reste de beurre. Éplucher et émincer le reste des oignons, échalotes et ail. Les faire revenir avec le thym. Ajouter le poulet, refermer la cocotte et enfourner pendant 1 heure."},{"titre":"Coloration finale et repos","contenu":"En fin de cuisson, retirer le couvercle, augmenter la température du four à 200°C pour faire colorer pendant 10 à 15 minutes. Laisser reposer après cuisson pendant 10 minutes. Réserver la garniture (oignons, ail, échalotes) et le jus de cuisson."},{"titre":"Infusion pour les pommes grenailles","contenu":"Dans une casserole, faire chauffer 2 litres d'eau avec le {gros_sel}, le {romarin}, l'{ail_pommes_grenailles} en chemise et la {feuille_de_laurier}. Laisser infuser pendant 30 minutes."},{"titre":"Cuisson des pommes grenailles","contenu":"Filtrer l'eau et y cuire les {pomme_grenaille} pendant 30 minutes à frémissement. Égoutter les pommes de terre et les ajouter à la cuisson du poulet."},{"titre":"Carottes fondantes (ajout)","contenu":"Épluchez les {carotte}, coupez-les en rondelles ou en bâtonnets. Faites-les cuire à la vapeur ou à l'eau bouillante salée 15-20 minutes, jusqu'à ce qu'elles soient tendres. Égouttez et réservez au chaud."},{"titre":"Préparation de la laitue","contenu":"Laver sous l'eau les {laitue} sans les effeuiller et les retourner pour les égoutter. Éplucher et émincer les {oignon_rouge}."},{"titre":"Vinaigrette et assaisonnement","contenu":"Mélanger l'{huile_d_olive}, le {vinaigre_de_xeres}, le {vinaigre_balsamique} et la {sauce_anglaise} pour la vinaigrette, et assaisonner les feuilles de laitue. Ajouter les oignons rouges et recouvrir de {parmesan} râpé et d'{oignon_frit}."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R056","nom":"Poulet tandoori à la tomate","sous_t ","placeholder":"blanc_de_poulet"},{"nom":"Pâte ou poudre tandoori","quantite_par_portion":1,"unite":"cs","placeholder":"pate_ou_poudre_tandoori","categorie":"à ajouter soi-même"},{"nom":"Jus de citron","quantite_par_portion":1,"unite":"cs","placeholder":"jus_de_citron"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Sel et poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_et_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Marinade du poulet","contenu":"Incisez le {blanc_de_poulet} et frottez-le avec la {pate_ou_poudre_tandoori}."},{"titre":"Repos au réfrigérateur","contenu":"Laissez mariner le poulet toute la nuit au réfrigérateur."},{"titre":"Cuisson du poulet","contenu":"Faites chauffer la poêle puis faites cuire le poulet 8 à 10 minutes de chaque côté."},{"titre":"Riz basmati à l'autocuiseur (ajout)","contenu":"Rincez le {riz_basmati} à l'eau claire jusqu'à ce que l'eau ressorte claire. Placez-le dans l'autocuiseur avec la même quantité d'eau (ratio 1:1) et une pincée de sel. Verrouillez le couvercle et cuisez 4-5 minutes à pleine pression une fois celle-ci atteinte. Laissez la pression redescendre naturellement pendant 10 minutes avant d'ouvrir. Égrenez à la fourchette avant de servir."},{"titre":"Salade tomate-oignon-coriandre-concombre","contenu":"Émincez finement l'{oignon_rouge}. Ciselez la {coriandre_fraiche}. Mélangez l'oignon, la {tomate}, la coriandre et le {concombre} en dés avec le {jus_de_citron}, l'{huile_d_olive}, le {sel_et_poivre} dans un saladier."},{"titre":"Service","contenu":"Servez la salade avec le poulet tandoori et le riz basmati, et ajoutez des quartiers de citron."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R057","nom":"Le fameux poulet tikka masala","sous_titre":"avec du riz & des poivrons","source":"Recette (fiche livre de c rir et laisser mijoter à feu doux pendant 20 minutes en remuant souvent."},{"titre":"Riz à l'autocuiseur (ajout)","contenu":"Rincez le {riz} à l'eau claire jusqu'à ce que l'eau ressorte claire. Placez-le dans l'autocuiseur avec la même quantité d'eau (ratio 1:1) et une pincée de sel. Verrouillez le couvercle et cuisez 4-5 minutes à pleine pression une fois celle-ci atteinte. Laissez la pression redescendre naturellement pendant 10 minutes avant d'ouvrir. Égrenez à la fourchette avant de servir."},{"titre":"Service","contenu":"Rectifier l'assaisonnement et parsemer de {coriandre_ou_persil} hachée. Servir avec le riz."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R058","nom":"Rigatoni gourmands au pesto vert & burrata","sous_titre":"avec des courgettes sautées, du jambon de Parme & des noisettes grillées","source":"HelloFresh (épinards remplacés par des courgettes sautées, ajout de jambon de Parme)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":25,"cuisson_min":null,"total_min":35},"ustensiles":["Râpe","Casserole","Passoire","Poêle"],"conservation_note":"La burrata doit être ajoutée fraîche au moment de chaque service, jamais réchauffée avec le reste : elle perdrait sa texture crémeuse. Seuls les rigatoni, le pesto et les courgettes sont à réchauffer.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la burrata, fruits à coque via les noisettes, gluten via les rigatoni). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajout d'une portion fraîche de burrata et de jambon de Parme à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour les pâtes, le pesto et les courgettes jusqu'à 2-3 jours, sous réserve d'ajouter la burrata et le jambon de Parme frais à chaque fois","justification":"La base pâtes/pesto/courgettes se réchauffe simplement ; la burrata ne doit jamais être réchauffée et le jambon de Parme est servi cru (voir conservation_note)."},"ingredients":[{"nom":"Jambon de Parme","quantite_par_portion":25,"unite":"g (cru, cru-séché)","placeholder":"jambon_de_parme"},{"nom":"Courgette","quantite_par_portion":150,"unite":"g","placeholder":"courgette"},{"nom":"Rigatoni","quantite_par_portion":90,"unite":"g","placeholder":"rigatoni"},{"nom":"Burrata","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"burrata"},{"nom":"Gousse d'ail","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Oignon","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Noisettes grillées","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"noisettes_grillees"},{"nom":"Citron","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron"},{"nom":"Pesto vert alla genovese","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"pesto_vert_alla_genovese"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre_et_sel","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"C'est parti !","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Portez une casserole d'eau salée à ébullition et faites-y cuire les {rigatoni} 11-13 min. Réservez ¼ de louche d'eau de cuisson par personne, puis égouttez les pâtes et réservez-les. Pendant ce temps, ciselez l'{gousse_d_ail} et l'{oignon}. Concassez les {noisettes_grillees}."},{"titre":"Légumes à la poêle (courgettes)","contenu":"Lavez bien le {citron} et prélevez-en le zeste avec une râpe fine. Coupez-le en quartiers. Épluchez et coupez la {courgette} en fines lamelles ou en dés. Faites chauffer un filet d'{huile_d_olive} dans une poêle à feu moyen-vif. Faites-y revenir l'ail et l'oignon 4-5 min. Ajoutez la courgette et laissez-la cuire 6-8 minutes en remuant, jusqu'à ce qu'elle soit tendre et légèrement dorée. Réservez les légumes dans la poêle, hors du feu."},{"titre":"Dernier coup de poêle","contenu":"Ajoutez les pâtes à la poêle ainsi que l'eau de cuisson réservée. Ajoutez le {pesto_vert_alla_genovese} et, par personne : une pincée de zestes et quelques gouttes de jus de citron (selon votre goût). Salez, poivrez et mélangez bien.","astuce_chef":"L'eau de cuisson des pâtes permettra d'apporter du liant à votre sauce grâce à l'amidon qu'elle contient."},{"titre":"Clap de fin","contenu":"Servez les rigatoni au pesto dans des assiettes creuses. Placez la {burrata} par-dessus. Assaisonnez-la de sel et de poivre ainsi que d'un filet d'huile d'olive. Répartissez le {jambon_de_parme} en fines tranches sur les pâtes. Garnissez de noisettes.","astuce_chef":"Mélangez la burrata avec les pâtes au moment de déguster pour obtenir une sauce extra crémeuse !"}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":865},{"id":"R059","nom":"Risotto à la milanaise","sous_titre":"avec de la pancetta & des petits pois","source":"Recette (fiche livre de cuisine)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":30,"total_min":50},"ustensiles":["Grande casserole (bouillon)","Sauteuse"]," redients":[{"nom":"Riz basmati","quantite_par_portion":65,"unite":"g (cru)","placeholder":"riz_basmati"},{"nom":"Pois chiche (poids net égoutté)","quantite_par_portion":130,"unite":"g","placeholder":"pois_chiche"},{"nom":"Tomates cerise","quantite_par_portion":150,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Beurre","quantite_par_portion":10,"unite":"g","placeholder":"beurre"},{"nom":"Cumin","quantite_par_portion":0.25,"unite":"cc","placeholder":"cumin","categorie":"à ajouter soi-même"},{"nom":"Curry de Madras","quantite_par_portion":0.25,"unite":"cc","placeholder":"curry_de_madras","categorie":"à ajouter soi-même"},{"nom":"Sel & poivre (riz)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_riz","categorie":"à ajouter soi-même"},{"nom":"Eau bouillante","quantite_par_portion":75,"unite":"g","placeholder":"eau_bouillante","categorie":"à ajouter soi-même"},{"nom":"Oignon (oignons frits)","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"oignon_frits"},{"nom":"Farine","quantite_par_portion":20,"unite":"g","placeholder":"farine","categorie":"à ajouter soi-même"},{"nom":"Huile neutre","quantite_par_portion":2.5,"unite":"cl","placeholder":"huile_neutre","categorie":"à ajouter soi-même"},{"nom":"Sel (oignons frits)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_oignons_frits","categorie":"à ajouter soi-même"},{"nom":"Raisin noir","quantite_par_portion":25,"unite":"g","placeholder":"raisin_noir"},{"nom":"Oignon (fricassée)","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"oignon_fricassee"},{"nom":"Ail","quantite_par_portion":0.5,"unite":"gousse(s)","placeholder":"ail"},{"nom":"Huile de tournesol","quantite_par_portion":5,"unite":"cl","placeholder":"huile_de_tournesol","categorie":"à ajouter soi-même"},{"nom":"Bouquet d'herbes (cerfeuil, coriandre, persil plat)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"bouquet_d_herbes"}],"instructions":[{"titre":"Étape 1 — Riz","contenu":"Rincer le {riz_basmati} sous l'eau froide et bien l'égoutter. Faire fondre le {beurre} dans une sauteuse, y faire dorer légèrement le riz, puis verser l'{eau_bouillante}, le {sel_poivre_riz}, le {cumin}, le {curry_de_madras} et couvrir avec un couvercle hermétique. Laisser cuire à feu très doux pendant 20 minutes. Arrêter la cuisson et laisser reposer."},{"titre":"Étape 2 — Oignons frits","contenu":"Éplucher et émincer finement l'{oignon_frits}, puis le passer dans la {farine}. Faire chauffer l'{huile_neutre} dans une poêle. Y faire frire les oignons et les saler ({sel_oignons_frits}). Réserver."},{"titre":"Étape 3 — Fricassée de pois chiches","contenu":"Égoutter et rincer le {pois_chiche}. Dans une cocotte ou une poêle à rebords, faire chauffer l'{huile_de_tournesol} et y faire dorer les pois chiches sur feu vif pendant 5 minutes. Ajouter l'{oignon_fricassee} et l'{ail} pelés et émincés. Baisser le feu et ajouter le {raisin_noir} réhydraté au préalable dans de l'eau tiède. Laisser dorer quelques minutes et débarrasser. Laisser refroidir."},{"titre":"Étape 4 — Service avec tomates cerise","contenu":"Mélanger le riz bien froid avec le {bouquet_d_herbes} haché grossièrement. Coupez les {tomates_cerise} en deux. Incorporez-les froides au riz en même temps que les herbes. Ajouter les pois chiches et parsemer d'oignons frits."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R062","nom":"Riz, cranberries & pesto à la pistache","sous_titre":"avec des pois chiches & des tomates cerise","source":"Recette (fiche livre de cuisine ; pesto express à la pistache p.250 reconstruit d'après une méthode établie, page originale non disponible)","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":15,"cuisson_min":20,"total_min":35},"ustensiles":["Grande casserole (riz)","Saladier","Poêle (torréfaction des pistaches)","Mixeur (pesto)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre et le parmesan, fruits à coque via les pistaches). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne jusqu'à 3-4 jours (salade froide conçue pour être préparée à l'avance)","justification":"Salade de riz froide se conservant très bien au réfrigérateur, aucun élément fragile identifié."},"ingredients":[{"nom":"Pois chiches cuits (en boîte, égouttés)","quantite_par_portion":130,"unite":"g","placeholder":"pois_chiches_cuits"},{"nom":"Tomates cerise","quantite_par_portion":150,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Riz basmati","quantite_par_portion":65,"unite":"g (cru)","placeholder":"riz_basmati"},{"nom":"Beurre","quantite_par_portion":12.5,"unite":"g","placeholder":"beurre"},{"nom":"Cranberrie","quantite_par_portion":10,"unite":"g","placeholder":"cranberrie"},{"nom":"Curcuma","quantite_par_portion":0.25,"unite":"cc","placeholder":"curcuma","categorie":"à ajouter soi-même"},{"nom":"Pistache décortiquée (salade)","quantite_par_portion":5,"unite":"g","placeholder":"pistache_salade"},{"nom":"Bouquet d'herbes (cerfeuil, aneth, estragon, persil plat)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"bouquet_d_herbes"},{"nom":"Sel & poivre (salade)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_ } (les glaçons refroidissent le mélange et évitent que les lames n'échauffent le basilic, ce qui le ferait noircir). Mixez de nouveau par à-coups courts en versant l'{huile_d_olive} progressivement, jusqu'à obtenir une texture homogène mais encore légèrement grainée."},{"titre":"Étape 3 — Service","contenu":"Arroser délicatement le riz de pesto à la pistache avant de servir."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R063","nom":"Rougail saucisses","sous_titre":"avec des lentilles, du riz et un condiment tomate-piment frais","source":"Recette (fiche livre de cuisine, cuisine réunionnaise)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":30,"cuisson_min":50,"total_min":80},"ustensiles":["Casserole (lentilles)","Casserole d'eau bouillante (blanchiment des saucisses)","Mortier","Casserole (saucisses et sauce tomate)","Casserole (condiment - eau bouillante et glaçons)","Casserole (riz)"],"conservation_note":"Le condiment (tomates, piment, oignon nouveau, gingembre, combava) doit être préparé frais au moment de chaque service, jamais préparé à l'avance ni réchauffé, si le plat est reconsommé sur plusieurs repas.","allergenes_note":"Aucun allergène majeur signalé par la source d'origine (pas de tableau d'allergènes sur cette fiche).","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Le condiment tomate-piment-gin om":"Huile d'olive (saucisses)","quantite_par_portion":null,"unite":"trait, non quantifié","placeholder":"huile_d_olive_saucisses","categorie":"à ajouter soi-même"},{"nom":"Tomate (condiment)","quantite_par_portion":25,"unite":"g","placeholder":"tomate_condiment"},{"nom":"Piment rouge","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"piment_rouge"},{"nom":"Oignon nouveau","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"oignon_nouveau"},{"nom":"Gingembre frais (condiment)","quantite_par_portion":null,"unite":"morceau, non quantifié","placeholder":"gingembre_condiment"},{"nom":"Citron combava","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_combava"},{"nom":"Huile d'olive (condiment)","quantite_par_portion":null,"unite":"trait, non quantifié","placeholder":"huile_d_olive_condiment","categorie":"à ajouter soi-même"},{"nom":"Sel (riz)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_riz","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Cuisson des lentilles","contenu":"Épluche la {carotte} et l'{oignon_lentilles}, cisèle l'oignon et taille la carotte en petits cubes. Dans une casserole, fais chauffer un trait d'huile d'olive et le {beurre_huile_lentilles}, ajoute l'oignon et la carotte, laisse-les cuire 1 à 2 minutes, verse les {lentilles_vertes_du_puy}, ne sale pas. Verse le {bouillon_cube} et laisse cuire 20 minutes."},{"titre":"Étape 2 — Blanchiment des saucisses","contenu":"Dans une casserole d'eau bouillante, plonge les {saucisse_montbeliard} et laisse-les blanchir 6 minutes, égoutte-les et coupe-les en tranches en biais d'1,5 à 2 cm d'épaisseur."},{"titre":"Étape 3 — Cuisson des saucisses à la sauce tomate","contenu":"Coupe les {tomate_saucisses} en morceaux. Réserve. Dans un mortier, broie le {gingembre_saucisses} épluché avec le {piment_vert} épépiné, la {gousse_d_ail} épluchée et dégermée et la {fleur_de_sel}. Épluche et émince l'oignon. Dans une casserole chaude, avec un trait d'{huile_d_olive_saucisses}, verse l'oignon, ajoute les saucisses, le mélange pimenté, puis les tomates, fais revenir 5 minutes. Couvre aux trois quarts et laisse cuire 15 minutes à feu doux."},{"titre":"Étape 4 — Condiment frais","contenu":"Retire le pédoncule des {tomate_condiment} pour le condiment, forme une croix au couteau sur le haut des tomates et plonge-les dans de l'eau bouillante 2 à 3 secondes, ce que l'on appelle « monder ». Égoutte tout de suite et plonge-les dans de l'eau avec des glaçons, retire la peau et coupe-les en deux, puis en quatre, retire le cœur et taille les pétales en cubes. Épépine le {piment_rouge} et taille-le en tout petits dés. Épluche l'{oignon_nouveau}, cisèle-le, épluche le {gingembre_condiment}, hache-le et intègre le tout aux tomates dans un bol, avec le {citron_combava} râpé. Verse un trait d'{huile_d_olive_condiment} pour finir."},{"titre":"Étape 5 — Riz et service","contenu":"Fais cuire le {riz_blanc} pendant 10 minutes dans une casserole d'eau bouillante salée. Vérifie la cuisson des lentilles et sale-les. Transfère-les dans un plat et sers avec les saucisses et la sauce tomate dans un autre plat de service, avec le riz et le condiment."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R064","nom":"Salade de bœuf mariné","sous_titre":"avec des croûtons de pain","source":"Recette (fiche livre de cuisine, p.25)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":15,"cuisson_min":6,"total_min":39},"ustensiles":["Plat (marinade)","Bol","Poêle ou gril","Planche à découper"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment moutarde, fruits à coque via les noix de cajou). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"La viande grillée durcit au réchauffage et la salade composée (mâche, radis, tomates) ne se conserve pas assemblée. Recette conçue pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Croûtons de pain","quantite_par_portion":30,"unite":"g","placeholder":"croutons_de_pain"},{"nom":"Onglet de bœuf","quantite_par_portion":75,"unite":"g (cru)","placeholder":"onglet_de_boeuf"},{"nom":"Radis de couleur ou roses","quantite_par_portion":50,"unite":"g","placeholder":"radis"},{"nom":"Mâche","quantite_par_portion":30,"unite":"g","placeholder":"mache"},{"nom":"Moutarde","quantite_par_portion":0.5,"unite":"cc","placeholder":"moutarde","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive (marinade)","quantite_par_portion":6.25,"unite":"cl","placeholder":"huile_d_olive_marinade","categorie":"à ajouter soi-même"},{"nom":"Vinaigre balsamique rouge","quantite_par_portion":0.5,"unite":"cs","placeholder":"vinaigre_balsamique_rouge","categorie":"à ajouter soi-même"},{"nom":"Citron jaune","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_jaune"},{"nom":"Coriandre","quantite_par_portion":0.125,"unite":"botte(s)","placeholder":"coriandre"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Piment oiseau","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"piment_oiseau"},{"nom":"Citron vert","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"citron_vert"},{"nom":"Huile d'olive (vinaigrette)","quantite_par_portion":1.5,"unite":"cs","placeholder":"huile_d_olive_vinaigrette","categorie":"à ajouter soi-même"},{"nom":"Tomates cerise","quantite_par_portion":25,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Maïs cuit","quantite_par_portion":71.25,"unite":"g","placeholder":"mais_cuit"},{"nom":"Noix de cajou salées","quantite_par_portion":6.25,"unite":"g","placeholder":"noix_de_cajou_salees"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Marinade","contenu":"Assaisonne l'{onglet_de_boeuf} et coupe-la en deux. Épluche et taille l'{gousse_d_ail} en morceaux. Dans un plat, verse la {moutarde}, l'{huile_d_olive_marinade}, le {vinaigre_balsamique_rouge}, le jus d'un demi-{citron_vert} et la seconde moitié en quartiers, quelques feuilles de {coriandre}, 3 cuillerées à soupe d'eau. Ajoute le {piment_oiseau} et l'ail en morceaux. Dépose la pièce de viande. Laisse mariner à température ambiante 15 à 20 minutes."},{"titre":"Étape 2 — Vinaigrette au citron","contenu":"Dans un bol, mélange le jus du {citron_jaune} avec l'{huile_d_olive_vinaigrette} pour assaisonner la salade."},{"titre":"Étape 3 — Préparation des légumes","contenu":"Coupe les {tomates_cerise} lavées en deux ou quatre, effeuille la coriandre restante. Lave et équeute les {radis} et coupe-les en quartiers. Rince le {mais_cuit}. Lave bien et essore la {mache}."},{"titre":"Étape 4 — Cuisson de la viande","contenu":"Égoutte et grille la pièce de viande en fonction de la cuisson voulue, retire de la cuisson, déglace la poêle avec le jus d'un demi-citron vert restant et 1 cuillerée de vinaigre balsamique, garde le jus de côté. Dépose la viande sur une planche et découpe-la en lanières."},{"titre":"Croûtons de pain (ajout)","contenu":"Coupez le {croutons_de_pain} en dés réguliers. Faites-les dorer à sec dans une poêle ou au four quelques minutes, jusqu'à ce qu'ils soient croustillants."},{"titre":"Étape 5 — Service","contenu":"Assaisonne la salade composée de mâche, maïs, tomates, radis avec la vinaigrette au citron. Dépose dans un joli plat ou dans des assiettes individuelles, ajoute les lanières de viande, verse le jus de cuisson de la poêle et parsème de {noix_de_cajou_salees}. Ajoute les croûtons de pain. Dépose le demi-citron vert en quartier."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R065","nom":"Salade César","sous_titre":"poulet, croûtons maison et sauce César","source":"Recette (fiche livre de cuisine, p.35)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":20,"total_min":40},"ustensiles":["Poêle","Papier aluminium","Bol (sauce)","Fouet","Planche à découper","Saladier"],"conservation_note":null,"allergenes_note":"Contient gluten (pain de mie), œuf (jaune d'œuf cru dans la sauce), lait (parmesan, crème liquide), moutarde. Ne contient plus d'anchois (substitué par de la sauce anglaise, qui en contient elle-même une trace très diluée — à vérifier sur l'étiquette si allergie stricte au poisson). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Croûtons, salade et sauce doivent être assemblés à la dernière minute (les croûtons perdent leur croquant s'ils ne sont pas consommés immédiatement, selon la note de la fiche source). Le poulet peut éventuellement être cuit à l'avance, mais l'ensemble du plat est conçu pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Filet de poulet","quantite_par_portion":100,"unite":"g (cru)","placeholder":"poulet"},{"nom":"Salade romaine","quantite_par_portion":100,"unite":"g","placeholder":"salade_romaine"},{"nom":"Tomates cerise","quantite_par_portion":50,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Huile d'olive (cuisson poulet)","quantite_par_portion":2.5,"unite":"cl","placeholder":"huile_d_olive_poulet","categorie":"à ajouter soi-même"},{"nom":"Estragon","quantite_par_portion":0.75,"unite":"brin(s)","placeholder":"estragon"},{"nom":"Ciboulette","quantite_par_portion":2,"unite":"brin(s)","placeholder":"ciboulette"},{"nom":"Persil","quantite_par_portion":1,"unite":"brin(s)","placeholder":"persil"},{"nom":"Cerfeuil","quantite_par_portion":1,"unite":"brin(s)","placeholder":"cerfeuil"},{"nom":"Parmesan (copeaux, service)","quantite_par_portion":20,"unite":"g","placeholder":"parmesan"},{"nom":"Sel et poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"},{"nom":"Pain de mie","quantite_par_portion":1,"unite":"tranche(s)","placeholder":"pain_de_mie"},{"nom":"Huile d'olive (croûtons)","quantite_par_portion":2.5,"unite":"cl","placeholder":"huile_d_olive_croutons","categorie":"à ajouter soi-même"},{"nom":"Huile de tournesol (sauce)","quantite_par_portion":2.5,"unite":"cl","placeholder":"huile_de_tournesol","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive (sauce)","quantite_par_portion":1,"unite":"cl","placeholder":"huile_d_olive_sauce","categorie":"à ajouter soi-même"},{"nom":"Sauce anglaise (Worcestershire)","quantite_par_portion":1,"unite":"cl","placeholder":"sauce_anglaise"},{"nom":"Jaune d'œuf","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"jaune_d_oeuf"},{"nom":"Moutarde de Dijon","quantite_par_portion":2.5,"unite":"g","placeholder":"moutarde_de_dijon"},{"nom":"Parmesan râpé (sauce)","quantite_par_portion":6.25,"unite":"g","placeholder":"parmesan_rape_sauce"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"ail"},{"nom":"Citron","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron"},{"nom":"Crème liquide","quantite_par_portion":1.25,"unite":"cl","placeholder":"creme_liquide"},{"nom":"Poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Poulet","contenu":"Sale et poivre le {poulet}. Fais-le dorer dans une poêle chaude avec un peu d'{huile_d_olive_poulet} sur feu moyen. Cuis 6 minutes de chaque côté, puis verse un filet d'huile d'olive et laisse cuire encore 5 minutes de chaque côté. Emballe les filets chauds dans du papier d'aluminium."},{"titre":"Étape 2 — Croûtons","contenu":"Coupe le {pain_de_mie} en dés d'1 cm de côté. Fais chauffer l'{huile_d_olive_croutons} dans la poêle, ajoute les croûtons et fais-les sauter pour qu'ils dorent en absorbant l'huile d'olive. Assaisonne d'une pincée de sel.","astuce_chef":"Les croûtons maison se mangent immédiatement, sinon ils perdent leur croquant et leur fraîcheur. On peut aussi les faire au four : laissez-les 10 minutes à 190°C sans huile, ils se conserveront plus longtemps."},{"titre":"Étape 3 — Sauce César (mode opératoire reconstruit)","contenu":"Écrase l'{ail} en purée. Dans un bol, mélange-la avec le {jaune_d_oeuf}, la {moutarde_de_dijon} et la {sauce_anglaise}. Verse les huiles ({huile_de_tournesol} puis {huile_d_olive_sauce}) en filet fin, en fouettant sans arrêt, pour monter la sauce en émulsion façon mayonnaise. Ajoute le jus du {citron}, puis la {creme_liquide} et le {parmesan_rape_sauce}. Assaisonne de {poivre} selon le goût."},{"titre":"Complément légumes — Tomates cerise (ajout)","contenu":"Lave et coupe les {tomates_cerise} en deux."},{"titre":"Étape 4 — Service","contenu":"Lave et émince la {salade_romaine}. Cisèle les herbes ({estragon}, {ciboulette}, {persil}, {cerfeuil}) en gardant quelques feuilles de cerfeuil entières. Dans chaque assiette, dépose un peu de salade, un demi-filet de {poulet} coupé en tranches et les {tomates_cerise}. Décore de feuilles de cerfeuil, de persil, d'estragon et de ciboulette ciselés. Parsème de {croutons_de_pain} et de copeaux de {parmesan}. Arrose de sauce César avant de servir."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R066","nom":"Salade de pennes au pistou","sous_titre":"bacon, avocat, noix de cajou, olives et thon","source":"Recette (fiche livre de cuisine, sans numéro de page visible)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":15,"cuisson_min":15,"total_min":20},"ustensiles":["Casserole","Poêle","Saladier","Mixeur ou pilon (pistou)","Planche à découper"],"conservation_note":"L'avocat s'oxyde et noircit rapidement une fois coupé : le préparer et l'ajouter frais à chaque service plutôt que de le mélanger à l'avance dans toute la préparation destinée à plusieurs repas.","allergenes_note":"Contient gluten (pennes), poisson (thon), fruits à coque (noix de cajou), lait (parmesan). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajouter l'avocat frais coupé en dés à chaque service (il s'oxyde et noircit rapidement s'il est préparé à l'avance).","qualite_conservation_2_a_4_jours":"bonne, à l'exception de l'avocat qui doit être ajouté frais à chaque service","justification":"Salade de pâtes froide dont les composants (pâtes, thon, bacon, olives, noix de cajou, pistou) se conservent bien 2 à 4 jours au frais. Seul l'avocat doit être coupé et ajouté au dernier moment pour éviter l'oxydation. Typage A/E/F cohérent avec une grosse préparation reconsommée sur plusieurs repas."},"ingredients":[{"nom":"Pennes","quantite_par_portion":100,"unite":"g (cru)","placeholder":"pennes"},{"nom":"Gros sel (cuisson des pâtes)","quantite_par_portion":null,"unite":"selon usage","placeholder":"gros_sel_cuisson","categorie":"à ajouter soi-même"},{"nom":"Tranches de bacon","quantite_par_portion":2,"unite":"tranche(s)","placeholder":"bacon"},{"nom":"Thon égoutté","quantite_par_portion":90,"unite":"g","placeholder":"thon"},{"nom":"Avocats","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"avocat"},{"nom":"Tomates cerise","quantite_par_portion":30,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Poivron","quantite_par_portion":20,"unite":"g","placeholder":"poivron"},{"nom":"Olives noires dénoyautées","quantite_par_portion":25,"unite":"g","placeholder":"olives_noires"},{"nom":"Noix de cajou","quantite_par_portion":12.5,"unite":"g","placeholder":"noix_de_cajou"},{"nom":"Basilic frais (pistou)","quantite_par_portion":10,"unite":"g","placeholder":"basilic"},{"nom":"Gousse d'ail (pistou)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"ail_pistou"},{"nom":"Huile d'olive (pistou)","quantite_par_portion":1,"unite":"cl","placeholder":"huile_d_olive_pistou","categorie":"à ajouter soi-même"},{"nom":"Parmesan râpé (pistou)","quantite_par_portion":10,"unite":"g","placeholder":"parmesan_pistou"},{"nom":"Sel et poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Cuisson des pennes","contenu":"Fais cuire les {pennes} à l'eau bouillante salée ({gros_sel_cuisson}), en suivant le temps de cuisson indiqué sur le paquet."},{"titre":"Étape 2 — Bacon et poivron","contenu":"Pendant la cuisson des pâtes, fais dorer le {bacon} et le {poivron} coupé en dés dans une poêle, jusqu'à ce que le bacon soit croustillant et le poivron légèrement fondant."},{"titre":"Étape 3 — Avocats","contenu":"Épluche les {avocat} et taille-les en dés."},{"titre":"Pistou (mode opératoire reconstruit)","contenu":"Dégerme et écrase l'{ail_pistou}. Mixe-le avec le {basilic} et le {parmesan_pistou}. Ajoute l'{huile_d_olive_pistou} progressivement en filet, en continuant de mixer, jusqu'à obtenir une sauce homogène. Assaisonne de {sel_poivre} selon le goût."},{"titre":"Complément légumes — Tomates cerise (ajout)","contenu":"Lave et coupe en deux les {tomates_cerise}."},{"titre":"Étape 4 — Assemblage","contenu":"Égoutte les pâtes cuites. Tant qu'elles sont encore tièdes, verse-les dans un saladier. Ajoute le {bacon} et le {poivron} croustillants (émiette légèrement le bacon), les dés d'{avocat}, les {noix_de_cajou} grillées, les {olives_noires} et le {thon} égoutté, ainsi que les {tomates_cerise}. Assaisonne de pistou et mélange délicatement."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R067","nom":"Salade de poulet grillé","sous_titre":"romaine, tomates cerises, concombre, poivron, feta et vinaigrette moutarde","source":"Recette (fiche numérique, mesures américaines tasses/cuillères)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["ete"],"temps":{"preparation_min":15,"cuisson_min":12,"total_min":27},"ustensiles":["Poêle","Grand bol (salade)","Petit bol (vinaigrette)","Planc e":"avec du pesto rosso, de l'origan & du comté","source":"HelloFresh (fiche recette box, semaine 14/2025, quantités complétées via la fiche en ligne à jour)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":15,"cuisson_min":10,"total_min":25},"ustensiles":["Casserole","Passoire","Poêle","Saladier","Planche à découper"],"conservation_note":"La salade de jeunes pousses (mâche/roquette) flétrit si elle est mélangée trop à l'avance : à ajouter au dernier moment si la préparation n'est pas consommée immédiatement.","allergenes_note":"Contient gluten (penne), lait (comté), et possiblement soja/sulfites (pesto rosso). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"moyenne, à l'exception de la salade de jeunes pousses qui flétrit si mélangée à l'avance","justification":"Salade de pâtes qui se tient bien froide ou tiède (pennes, poulet, pesto, tomates). Seule la salade de jeunes pousses doit idéalement être ajoutée au dernier moment pour rester croquante. Recette rapide (typage B/C/D), l'astuce de la fiche source proposant même de laisser refroidir le poulet avant de l'ajouter si l'on préfère une salade froide."},"ingredients":[{"nom":"Penne","quantite_par_portion":90,"unite":"g (cru)","placeholder":"pennes"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"ail"},{"nom":"Tomates semi-séchées","quantite_par_portion":25,"unite":"g","placeholder":"tomates_semi_sechees"},{"nom":"Blanc de poulet","quantite_par_portion":100,"unite":"g (cru)","placeholder":"poulet"},{"nom":"Origan séché","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"origan_seche"},{"nom":"Pesto rosso","quantite_par_portion":45,"unite":"g","placeholder":"pesto_rosso"},{"nom":"Salade (jeunes pousses type mâche/roquette)","quantite_par_portion":30,"unite":"g","placeholder":"salade_jeunes_pousses"},{"nom":"Tomates cerise","quantite_par_portion":50,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Poivron","quantite_par_portion":45,"unite":"g","placeholder":"poivron"},{"nom":"Comté râpé","quantite_par_portion":25,"unite":"g","placeholder":"comte"},{"nom":"Huile d'olive","quantite_par_portion":1.5,"unite":"cl","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Vinaigre de vin rouge ou de cidre","quantite_par_portion":0.5,"unite":"cc","placeholder":"vinaigre_vin_rouge_cidre","categorie":"à ajouter soi-même"},{"nom":"Sel et poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Préparation","contenu":"Porte une grande casserole d'eau salée à ébullition pour les {pennes}. Cisèle l'{ail}. Coupe grossièrement les {tomates_semi_sechees} en morceaux (dose-les selon ton goût, elles apportent un goût puissant). Recoupe le {poulet} en petits dés. Coupe le {poivron} en dés."},{"titre":"Étape 2 — Pâtes en ébullition","contenu":"Fais cuire les {pennes} 11-13 minutes dans la casserole. Égoutte-les, rince-les à l'eau froide pour éliminer l'excès d'amidon et égoutte-les de nouveau. Laisse-les refroidir dans la passoire."},{"titre":"Étape 3 — Poulet et poivron poêlés","contenu":"Pendant ce temps, fais chauffer un filet d'{huile_d_olive} dans une poêle à feu moyen-vif. Fais dorer le {poulet} et le {poivron} 2 minutes sur tous les côtés avec l'{origan_seche}. Sale et poivre. Ajoute l'{ail} et les {tomates_semi_sechees}, puis fais cuire 4-5 minutes de plus en remuant régulièrement. Le poulet ne doit plus être rosé à cœur."},{"titre":"Étape 4 — Assemblage","contenu":"Mélange le {pesto_rosso} avec un filet d'{huile_d_olive} et de {vinaigre_vin_rouge_cidre} dans un saladier. Rectifie l'assaisonnement en sel et poivre selon ton goût, puis ajoute les {pennes}, le {poulet} et le {poivron}, les {tomates_semi_sechees}, la {salade_jeunes_pousses} et les {tomates_cerise}. Mélange bien."},{"titre":"Étape 5 — Service","contenu":"Sers la salade de pennes dans les assiettes et saupoudre de {comte}."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":829},{"id":"R069","nom":"Salade Fattouche","sous_titre":"sauce yaourt-citron, pois chiches et pain à pitas maison","source":"Recette (fiche livre de cuisine, p.23)","typage_generique":["B","C","D"],"vegetarien":true,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":15,"cuisson_min":null,"total_min":25},"ustensiles":["Grand saladier","Bol (vinaigrette)","Saladier (pâte à pitas)","Poêle","Planche à découper"],"conservation_note":"Le pain à pitas peut être préparé à l'avance (se conserve 2-3 jours à température ambiante). La salade en revanche doit être assemblée et consommée peu après le temps d'infusion recommandé de 10 minutes.","allergenes_note":"Contient gluten (farine, pain à pitas), lait (yaourt grec, lait). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible pour la salade assemblée / bonne pour le pain à pitas préparé séparément","justification":"La salade à sauce yaourt doit être consommée peu après le temps d'infusion recommandé de 10 minutes (les légumes rendent de l'eau et la texture se dégrade au-delà). Le pain à pitas, en revanche, peut être préparé en amont et se conserve 2-3 jours à température ambiante — un temps confortable de préparation peut donc être consacré au pain seul, en marge du reste du repas. Recette globalement de consommation rapprochée (typage B/C/D)."},"ingredients":[{"nom":"Tomate","quantite_par_portion":0.75,"unite":"pièce(s)","placeholder":"tomate"},{"nom":"Concombre","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"concombre"},{"nom":"Radis rond","quantite_par_portion":25,"unite":"g","placeholder":"radis_rond"},{"nom":"Oignon rouge","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon_rouge"},{"nom":"Menthe","quantite_par_portion":0.125,"unite":"botte(s)","placeholder":"menthe"},{"nom":"Persil plat","quantite_par_portion":0.0625,"unite":"botte(s)","placeholder":"persil_plat"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"ail"},{"nom":"Yaourt grec","quantite_par_portion":62.5,"unite":"g","placeholder":"yaourt_grec"},{"nom":"Lait","quantite_par_portion":5,"unite":"cl","placeholder":"lait"},{"nom":"Pois chiches cuits égouttés","quantite_par_portion":130,"unite":"g","placeholder":"pois_chiches"},{"nom":"Citron jaune","quantite_par_portion":0.75,"unite":"pièce(s)","placeholder":"citron_jaune"},{"nom":"Huile d'olive (vinaigrette)","quantite_par_portion":3.75,"unite":"cl","placeholder":"huile_d_olive_vinaigrette","categorie":"à ajouter soi-même"},{"nom":"Sel (vinaigrette)","quantite_par_portion":1,"unite":"g","placeholder":"sel_vinaigrette","categorie":"à ajouter soi-même"},{"nom":"Poivre (vinaigrette)","quantite_par_portion":0.5,"unite":"g","placeholder":"poivre_vinaigrette","categorie":"à ajouter soi-même"},{"nom":"Farine (pain à pitas)","quantite_par_portion":75,"unite":"g","placeholder":"farine"},{"nom":"Eau (pain à pitas)","quantite_par_portion":6.25,"unite":"cl","placeholder":"eau_pate_a_pitas"},{"nom":"Sel (pain à pitas)","quantite_par_portion":1,"unite":"g","placeholder":"sel_pate_a_pitas"},{"nom":"Levure boulangère sèche","quantite_par_portion":1.5,"unite":"g","placeholder":"levure_boulangere"},{"nom":"Huile d'olive (pain à pitas)","quantite_par_portion":2,"unite":"cl","placeholder":"huile_d_olive_pate_a_pitas","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Pain à pitas maison (mode opératoire reconstruit) — à préparer en amont","contenu":"Délaye la {levure_boulangere} dans l'{eau_pate_a_pitas} tiède et laisse reposer 5 à 10 minutes. Mélange la {farine} et le {sel_pate_a_pitas}, puis incorpore le mélange eau-levure et l'{huile_d_olive_pate_a_pitas}. Pétris 8 à 10 minutes jusqu'à obtenir une pâte lisse et élastique. Laisse lever environ 1 heure à température ambiante, jusqu'à ce que la pâte double de volume. Dégaze la pâte, divise-la en pâtons, puis étale chaque pâton en disque. Fais cuire à la poêle bien chaude, 2 à 3 minutes de chaque côté."},{"titre":"Vinaigrette citronnée (mode opératoire reconstruit)","contenu":"Presse les {citron_jaune}. Dans un bol, fouette le jus de citron avec l'{huile_d_olive_vinaigrette}, le {sel_vinaigrette} et le {poivre_vinaigrette} jusqu'à obtenir une émulsion."},{"titre":"Étape 1 — Salade","contenu":"Rince les légumes. Coupe les {tomate} en gros dés (garde la peau et les pépins). Épluche le {concombre}, puis coupe-le en gros dés. Émince les {radis_rond}. Épluche l'{oignon_rouge} et coupe-le en fins quartiers. Hache finement la {menthe} et le {persil_plat}. Hache l'{ail} à part."},{"titre":"Étape 2 — Assaisonnement","contenu":"Dans un grand saladier, verse le {yaourt_grec} et le {lait}. Mélange, puis ajoute la vinaigrette citronnée."},{"titre":"Complément protéines — Pois chiches (ajout)","contenu":"Égoutte les {pois_chiches}."},{"titre":"Étape 3 — Service","contenu":"Ajoute les légumes à la sauce, puis la {menthe}, le {persil_plat}, l'{ail} et les {pois_chiches}. Laisse infuser pendant 10 minutes. C'est prêt ! Accompagne la salade des pains à pitas faits maison préparés à l'étape 1.","astuce_chef":"Attention, la sauce peut paraître liquide, c'est normal !"}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R070","nom":"Saucisse de Toulouse, ail confit, purée de pommes de terre","sous_titre":"avec des haricots verts","source":"Recette (fiche livre de cuisine, section Plats)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":20,"cuisson_min":40,"total_min":60},"ustensiles":["Casserole","Torchon","Moulin à légumes","Fouet","Poêle allant au four","Four","Casserole (haricots verts)"],"conservation_note":null,"allergenes_note":"Contient lait (beurre, lait entier). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"La purée et les haricots verts se réchauffent bien (four ou micro-ondes, avec un peu de lait pour détendre la purée si besoin). La saucisse se réchauffe également bien, éventuellement avec un filet d'huile ou de jus de cuisson pour éviter qu'elle ne dessèche.","qualite_conservation_2_a_4_jours":"bonne","justification":"Plat de type bistrot classique (saucisse rôtie, purée, légume vert) qui se prête bien à une grosse préparation reconsommée sur plusieurs repas de la semaine (typage A/E/F), avec un réchauffage simple pour chaque composant."},"ingredients":[{"nom":"Saucisse de Toulouse","quantite_par_portion":166.67,"unite":"g (cru)","placeholder":"saucisse_toulouse"},{"nom":"Têtes d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"ail_confit"},{"nom":"Thym","quantite_par_portion":0.5,"unite":"brin(s)","placeholder":"thym"},{"nom":"Romarin","quantite_par_portion":0.333,"unite":"brin(s)","placeholder":"romarin"},{"nom":"Huile d'olive (saucisse)","quantite_par_portion":1.667,"unite":"cl","placeholder":"huile_d_olive_saucisse","categorie":"à ajouter soi-même"},{"nom":"Beurre (saucisse)","quantite_par_portion":16.67,"unite":"g","placeholder":"beurre_saucisse"},{"nom":"Sel (saucisse)","quantite_par_portion":0.667,"unite":"g","placeholder":"sel_saucisse","categorie":"à ajouter soi-même"},{"nom":"Poivre (saucisse)","quantite_par_portion":0.333,"unite":"g","placeholder":"poivre_saucisse","categorie":"à ajouter soi-même"},{"nom":"Pomme de terre charlotte","quantite_par_portion":200,"unite":"g (cru)","placeholder":"pomme_de_terre"},{"nom":"Beurre (purée)","quantite_par_portion":41.67,"unite":"g","placeholder":"beurre_puree"},{"nom":"Lait entier","quantite_par_portion":5,"unite":"cl","placeholder":"lait_entier"},{"nom":"Fleur de sel","quantite_par_portion":0.5,"unite":"g","placeholder":"fleur_de_sel","categorie":"à ajouter soi-même"},{"nom":"Haricots verts","quantite_par_portion":150,"unite":"g","placeholder":"haricots_verts"},{"nom":"Beurre (haricots verts, ajout)","quantite_par_portion":5,"unite":"g","placeholder":"beurre_haricots_verts","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Purée","contenu":"Lave les {pomme_de_terre}. Dépose-les dans une casserole et recouvre-les d'eau froide. Porte à ébullition et laisse cuire à feu moyen pendant 25 minutes. À l'aide d'un torchon, épluche les pommes de terre encore brûlantes puis passe-les au moulin à légumes. Ajoute le {beurre_puree} bien froid coupé en morceaux. Fais chauffer le {lait_entier} avec la {fleur_de_sel}. Verse la pulpe de pomme de terre dans une casserole et incorpore le lait chaud à l'aide d'un fouet."},{"titre":"Haricots verts (ajout)","contenu":"Cuis les {haricots_verts} à l'eau bouillante salée pendant 8 à 10 minutes, jusqu'à ce qu'ils soient tendres tout en restant croquants. Égoutte-les, puis fais-les sauter rapidement avec le {beurre_haricots_verts}."},{"titre":"Étape 2 — Saucisses","contenu":"Préchauffe le four à 180°C. Dans une poêle allant au four, fais colorer la {saucisse_toulouse} sur les deux faces avec l'{huile_d_olive_saucisse} chaude pendant 10 minutes. Enfourne la saucisse avec le {beurre_saucisse}, les {ail_confit} coupées en deux et les aromates ({thym}, {romarin}) pendant 20 minutes. Retire la saucisse de la poêle et remets l'ail à confire pendant 15 minutes."},{"titre":"Étape 3 — Ail confit","contenu":"Écrase délicatement les demi-têtes d'{ail_confit} pour en extraire la pulpe. Réduis-la en purée à l'aide d'une fourchette et sers-t'en comme condiment."},{"titre":"Étape 4 — Service","contenu":"Coupe la {saucisse_toulouse} en grands tronçons. Dispose-les à côté de la purée et des {haricots_verts}, creuse un puits et verse un peu de jus de cuisson. Agrémente de confit d'ail."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R071","nom":"Saumon au bouillon thaï","sous_titre":"riz aux petits pois et carottes en julienne","source":"Recette (fiche livre de cuisine)","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":30,"cuisson_min":40,"total_min":70},"ustensiles":["Casserole (bouillon)","Casserole (riz)","Poêle","Four","Sauteuse","Passette fine","Ramequin"],"conservation_note":"Le saumon doit être cuit au dernier moment, juste avant le service. Le bouillon et le riz peuvent en revanche être préparés à l'avance et réchauffés séparément.","allergenes_note":"Contient poisson (saumon), et éventuellement crustacés/poisson via la sauce nuoc-mâm. Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Le bouillon, le riz et les petits pois se réchauffent bien séparément. Le saumon doit en revanche être cuit à la commande (poêlé puis passage rapide au four) pour conserver sa texture nacrée — à ne pas préparer à l'avance.","qualite_conservation_2_a_4_jours":"bonne pour le bouillon et le riz, faible pour le poisson une fois cuit","justification":"Le bouillon thaï demande un temps confortable de préparation (revenus, mijotage) et se conserve bien au frais. Le saumon, en revanche, doit être cuit juste avant le service pour garder sa texture nacrée — d'où un typage B/C avec une attention particulière portée à la cuisson du poisson au moment du repas."},"ingredients":[{"nom":"Morceaux de saumon","quantite_par_portion":130,"unite":"g (cru)","placeholder":"saumon"},{"nom":"Riz basmati cru","quantite_par_portion":50,"unite":"g (cru)","placeholder":"riz_basmati"},{"nom":"Petits pois cuits","quantite_par_portion":12.5,"unite":"g","placeholder":"petits_pois_cuits"},{"nom":"Carottes","quantite_par_portion":100,"unite":"g","placeholder":"carottes"},{"nom":"Champignons de Paris","quantite_par_portion":1.5,"unite":"pièce(s)","placeholder":"champignons_de_paris"},{"nom":"Échalote","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"echalote"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"ail"},{"nom":"Gingembre frais","quantite_par_portion":2.5,"unite":"g","placeholder":"gingembre"},{"nom":"Citronnelle fraîche","quantite_par_portion":0.25,"unite":"tige(s)","placeholder":"citronnelle"},{"nom":"Pâte de curry vert","quantite_par_portion":0.25,"unite":"cc","placeholder":"pate_curry_vert"},{"nom":"Bouillon de volaille","quantite_par_portion":6.25,"unite":"cl","placeholder":"bouillon_de_volaille"},{"nom":"Lait de coco","quantite_par_portion":6.25,"unite":"cl","placeholder":"lait_de_coco"},{"nom":"Citron vert bio (zeste et jus)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_vert"},{"nom":"Sauce nuoc-mâm","quantite_par_portion":0.25,"unite":"cc","placeholder":"sauce_nuoc_mam"},{"nom":"Sucre","quantite_par_portion":0.25,"unite":"cc","placeholder":"sucre"},{"nom":"Citron jaune bio (zeste)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_jaune"},{"nom":"Feuilles de coriandre (ou autre herbe au choix)","quantite_par_portion":null,"unite":"quelques feuilles","placeholder":"coriandre","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"un trait","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Préparation","contenu":"Équeute, lave et taille les {champignons_de_paris} en escalopes. Épluche et émince l'{echalote} et l'{ail}. Épluche le {gingembre} et coupe-le en rondelles. Coupe finement en biseau la {citronnelle}. Épluche les {carottes} et taille-les en julienne. Réserve le tout séparément. Préchauffe le four à 170°C."},{"titre":"Cuisson du riz (mode opératoire ajouté)","contenu":"Rince le {riz_basmati} à l'eau claire. Porte une casserole d'eau salée à ébullition, verse le riz et laisse cuire 10 à 12 minutes selon les indications du paquet. Égoutte."},{"titre":"Étape 2 — Bouillon thaï","contenu":"Dans une casserole, verse un trait d'{huile_d_olive}, fais revenir 1 minute l'{echalote}, la {citronnelle}, le {gingembre}, la {pate_curry_vert} et mélange. Intègre les {champignons_de_paris}, les {carottes} et l'{ail}, laisse cuire 3 à 5 minutes sans coloration. Verse le {bouillon_de_volaille}, porte à ébullition et ajoute le {lait_de_coco} et le zeste du {citron_vert}. Laisse cuire 15 minutes."},{"titre":"Étape 3 — Poisson","contenu":"Préchauffe le four à 170°C. Sale les {saumon}, fais-les colorer dans une poêle des deux côtés. Verse le bouillon sur les poissons, puis enfourne, 3 minutes pour une cuisson nacrée et 6 minutes pour un poisson un peu plus cuit."},{"titre":"Étape 4 — Réchauffage du riz et des petits pois","contenu":"Mélange le {riz_basmati} fraîchement cuit avec les {petits_pois_cuits} dans une sauteuse avec un peu d'huile d'olive, pour bien les réchauffer ensemble."},{"titre":"Étape 5 — Sauce d'assaisonnement","contenu":"Dans un ramequin, mélange le jus du {citron_vert} avec la {sauce_nuoc_mam} et le {sucre}."},{"titre":"Étape 6 — Finition du bouillon","contenu":"Passe le bouillon à la passette fine dans une casserole et mélange sur feu doux avec un peu de sauce. Vérifie l'assaisonnement."},{"titre":"Étape 7 — Service","contenu":"Dans les assiettes creuses, dépose le {riz_basmati} et les {petits_pois_cuits}, les {carottes}, le {saumon} dessus et coule du bouillon. Décore de feuilles de {coriandre} et de zestes de {citron_jaune}."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R072","nom":"Saumon cuit au four","sous_titre":"avec poivron, courgette et riz basmati à l'autocuiseur","source":"Recette (fiche numérique)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["ete","toute_saison"],"temps":{"preparation_min":15,"cuisson_min":15,"total_min":30},"ustensiles":["Four","Plaque à pâtisserie","Bol moyen","Autocuiseur (riz)","Planche à découper"],"conservation_note":null,"allergenes_note":"Contient poisson (saumon). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le saumon cuit au four se dessèche facilement au réchauffage et les légumes rôtis perdent leur texture. Recette conçue pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Filets de saumon","quantite_par_portion":150,"unite":"g (cru)","placeholder":"saumon"},{"nom":"Riz basmati cru","quantite_par_portion":65,"unite":"g (cru)","placeholder":"riz_basmati"},{"nom":"Poivron rouge en dés","quantite_par_portion":75,"unite":"g","placeholder":"poivron_rouge"},{"nom":"Courgette en dés","quantite_par_portion":75,"unite":"g","placeholder":"courgette"},{"nom":"Oignon rouge en dés","quantite_par_portion":50,"unite":"g","placeholder":"oignon_rouge"},{"nom":"Gousse d'ail hachée","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"ail"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Jus de citron frais", e opératoire repris de R069)","contenu":"Délaye la {levure_boulangere} dans l'{eau_pate_a_pitas} tiède et laisse reposer 5 à 10 minutes. Mélange la {farine_pitas} et le {sel_pate_a_pitas}, puis incorpore le mélange eau-levure et l'{huile_d_olive_pate_a_pitas}. Pétris 8 à 10 minutes jusqu'à obtenir une pâte lisse et élastique. Laisse lever environ 1 heure à température ambiante, jusqu'à ce que la pâte double de volume. Dégaze la pâte, divise-la en pâtons, puis étale chaque pâton en disque. Fais cuire à la poêle bien chaude, 2 à 3 minutes de chaque côté."},{"titre":"Étape 1 — Soupe","contenu":"Épluche les {oignon_soupe} et les {courgette}. Dans une cocotte, fais torréfier le {gingembre_poudre}, le {cumin}, le {curcuma}, le {curry_madras}, le {garam_masala} et l'{ail_soupe} dans l'{huile_neutre} pendant 3 minutes à feu vif. Ajoute les oignons émincés et les courgettes coupées grossièrement. Fais suer le tout pendant 5 minutes, puis verse le {bouillon_volaille} et laisse cuire 20 minutes à feu moyen. Mixe avec la {coriandre_soupe} et le {yaourt_nature}, rectifie l'assaisonnement et laisse refroidir au frais."},{"titre":"Étape 2 — Boulettes","contenu":"Épluche et cisèle l'{oignon_rouge_boulettes}. Hache l'{ail_boulettes}. Fais-les suer à la poêle avec un peu d'huile et laisse refroidir. Pendant ce temps, hache finement la {menthe_boulettes}, la {coriandre_boulettes} et le {persil_boulettes}. Dans un bol, mélange le {boeuf_hache} avec les oignons cuits, la {chapelure}, le {concentre_tomates}, les herbes fraîches, le {piment_fort} et assaisonne de {sel_poivre_boulettes}. Forme des boulettes de 50g environ. Dans une poêle bien chaude, fais colorer les boulettes sur toutes les faces. Réserve."},{"titre":"Étape 3 — Service","contenu":"Verse la soupe dans des bols, émiette la {feta}, dispose des boulettes et décore de {menthe_finition}, de {coriandre_finition} et d'{huile_d_olive_finition}. Accompagne des pains à pitas maison.","astuce_chef":"Les boulettes se servent chaudes ou froides selon l'envie !"}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R076","nom":"Spaghettis aux saucisses et à la sauce tomate","sous_titre":"sauce tomate au poivron mixé, basilic et parmesan","source":"Recette (fiche livre de cuisine, p.54)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":15,"cuisson_min":20,"total_min":35},"ustensiles":["Poêle","Casserole (sauce)","Casserole (spaghettis)","Mixeur plongeant","Plat de service"],"conservation_note":null,"allergenes_note":"Contient gluten (spaghettis), lait (beurre, parmesan). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Se réchauffe bien avec un peu d'eau ou d'huile d'olive pour redétendre la sauce et éviter que les pâtes ne collent.","qualite_conservation_2_a_4_jours":"bonne","justification":"Plat de pâtes à la sauce tomate, qui se réchauffe bien contrairement aux salades fraîches du corpus. Recette rapide à préparer (typage B/C/D), adaptée aussi bien à une consommation immédiate qu'à un léger reliquat réchauffé."},"ingredients":[{"nom":"Spaghettis","quantite_par_portion":60,"unite":"g (cru)","placeholder":"spaghettis"},{"nom":"Chipolatas","quantite_par_portion":1.5,"unite":"pièce(s)","placeholder":"chipolatas"},{"nom":"Oignon","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"oignon"},{"no )","quantite_par_portion":0.25,"unite":"cc","placeholder":"paprika_sauce"},{"nom":"Gingembre moulu (sauce)","quantite_par_portion":0.25,"unite":"cc","placeholder":"gingembre_sauce"},{"nom":"Tomates pelées (boîte)","quantite_par_portion":100,"unite":"g","placeholder":"tomates_pelees"},{"nom":"Poivron","quantite_par_portion":25,"unite":"g","placeholder":"poivron"},{"nom":"Courgette","quantite_par_portion":25,"unite":"g","placeholder":"courgette"},{"nom":"Huile d'olive (sauce)","quantite_par_portion":null,"unite":"selon usage","placeholder":"huile_d_olive_sauce","categorie":"à ajouter soi-même"},{"nom":"Sel fin gris et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"},{"nom":"Semoule de couscous","quantite_par_portion":65,"unite":"g (cru)","placeholder":"semoule_couscous"},{"nom":"Eau ou bouillon (pour la semoule)","quantite_par_portion":6.5,"unite":"cl","placeholder":"eau_semoule"},{"nom":"Huile d'olive (semoule)","quantite_par_portion":null,"unite":"un filet","placeholder":"huile_d_olive_semoule","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Keftas","contenu":"Épluche et hache l'{oignon_rouge} et l'{ail_keftas}. Lave, sèche et cisèle la {coriandre_keftas}. Verse-les dans un saladier avec le {cumin_keftas} et le {paprika_keftas}. Ajoute le {boeuf_hache}, malaxe et forme 12 boulettes."},{"titre":"Étape 2 — Rissolage des boulettes","contenu":"Dans un plat à tajine ou une cocotte, sur feu moyen, verse de l'{huile_d_olive_keftas} et fais rissoler les boulettes quelques minutes. Réserve."},{"titre":"Étape 3 — Sauce tomate et légumes","contenu":"Épluche, dégerme et râpe les {ail_sauce}. Lave, sèche et cisèle la {coriandre_sauce} et le {persil_sauce}. Dans une sauteuse ou une grande casserole, verse le {cumin_sauce}, le {paprika_sauce}, le {gingembre_sauce} et l'ail râpé dans un fond d'{huile_d_olive_sauce} chaude et mélange. Ajoute les {tomates_pelees}, le {poivron} et la {courgette} coupés en petits morceaux, sale, poivre et ajoute enfin les trois quarts des herbes. Couvre et laisse cuire 20 minutes à feu doux."},{"titre":"Étape 4 — Cuisson des boulettes en sauce","contenu":"Dépose les boulettes dans la sauce et poursuis la cuisson 10 minutes à couvert."},{"titre":"Semoule de couscous (ajout)","contenu":"Rince la {semoule_couscous} et laisse-la gonfler quelques minutes dans un saladier. Porte l'{eau_semoule} à ébullition, verse-la sur la semoule avec un filet d'{huile_d_olive_semoule}. Laisse gonfler 5 minutes, mélange à la fourchette pour l'égrainer."},{"titre":"Étape 5 — Service","contenu":"Saupoudre du reste des herbes avant de servir. Accompagne de la {semoule_couscous}."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R081","nom":"Tarte à la tomate, moutarde à l'ancienne","sous_titre":"pâte brisée maison enrichie, lardons et comté gratiné","source":"Recette (fiche livre de cuisine)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["ete","automne"],"temps":{"preparation_min":15,"cuisson_min":50,"total_min":95},"ustensiles":["Saladier (ou bol de Thermomix TM5)","Moule à tarte","Film alimentaire","Poêle (lardons)","Four"],"conservation_note":null,"allergenes_note":"Contient gluten (farine), lait (beurre, comté), œuf (jaune d'œuf), moutarde. Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapi
