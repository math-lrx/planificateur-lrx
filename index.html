ensemble)","placeholder":"vinaigre_blanc","categorie":"à ajouter soi-même"},{"nom":"Eau","quantite_par_portion":12.5,"unite":"cl","placeholder":"eau","categorie":"à ajouter soi-même"},{"nom":"Coulis de tomates","quantite_par_portion":5,"unite":"cl","placeholder":"coulis_de_tomates"},{"nom":"Curry en poudre","quantite_par_portion":0.125,"unite":"cc","placeholder":"curry_en_poudre","categorie":"à ajouter soi-même"},{"nom":"Curcuma","quantite_par_portion":0.125,"unite":"cc","placeholder":"curcuma","categorie":"à ajouter soi-même"},{"nom":"Cannelle en poudre","quantite_par_portion":0.125,"unite":"cc","placeholder":"cannelle_en_poudre","categorie":"à ajouter soi-même"},{"nom":"Sel de céleri","quantite_par_portion":0.125,"unite":"cc","placeholder":"sel_de_celeri","categorie":"à ajouter soi-même"},{"nom":"Anis étoilé","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"anis_etoile","categorie":"à ajouter soi-même"},{"nom":"Beurre","quantite_par_portion":5,"unite":"g","placeholder":"beurre"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"trait, non quantifié","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Cuisson des oignons","contenu":"Épluche les {oignons_roses_roscoff}. Dans une casserole d'eau frémissante salée, plonge les oignons entiers et laisse-les cuire 20 minutes. Laisse-les refroidir."},{"titre":"Étape 2 — Préparation des légumes et aromates","contenu":"Lave les {tomates}. Épluche l'{gousse_d_ail}, dégerme-le et hache-le, ainsi que le {persil} sans les queues. Coupe le {brocoli}, bien lavé avec un trait de {vinaigre_blanc}, en petits morceaux."},{"titre":"Étape 3 — Préparation des céréales","contenu":"Dans une casserole, verse l'{eau} et le {coulis_de_tomates} avec le {curry_en_poudre}, le {curcuma}, la {cannelle_en_poudre}, le {sel_de_celeri} et l'{anis_etoile}. Porte à ébullition. Dans le plat de cuisson, verse la moitié du bouillon sur le {quinoa}, le {boulgour} et le {couscous_fin}, sale et réserve."},{"titre":"Étape 4 — Préparation des légumes à farcir","contenu":"Préchauffe le four à 190°C. Coupe le dessous des oignons pour qu'ils tiennent droit et mets les chapeaux de côté. Vide les oignons à l'aide d'un petit couteau, en ne gardant que deux épaisseurs. Dépose-les sur les céréales. Coupe les tomates aux trois quarts et vide le bas à la cuillère, dépose-les sur les céréales. Taille la chair des oignons et des tomates en petits morceaux, place-les dans des ramequins séparés."},{"titre":"Étape 5 — Farce","contenu":"Dans une cocotte, verse un trait d'huile d'olive et mets les oignons coupés, laisse suer avec une légère coloration, puis ajoute l'ail, la {viande_de_veau_hachee}, sale et poivre, laisse le jus de cuisson s'évaporer sur feu vif. Verse le reste de bouillon à la tomate, laisse cuire sur feu moyen 6 à 7 minutes. Intègre la chair des tomates, laisse cuire quelques minutes sur feu moyen, ajoute le brocoli et le persil haché. Laisse mijoter 20 minutes aux trois quarts couvert tout en surveillant."},{"titre":"Étape 6 — Montage et cuisson finale","contenu":"À la cuillère, dépose la farce dans les oignons et les tomates et referme avec les chapeaux. Verse dessus du {beurre} fondu, assaisonne et enfourne pour 20 minutes."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R028","nom":"Linguine bolognaise de légumes","sous_titre":"avec des lentilles vertes & de la burrata","source":"Recette (fiche livre de cuisine, p.50)","typage_generique":["B","C"],"vegetarien":true,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":20,"cuisson_min":20,"total_min":40},"ustensiles":["Casserole (lentilles vertes)","Casserole (bouillon tomaté)","Grande casserole d'eau bouillante salée (linguine)","Sauteuse"],"conservation_note":"La burrata doit être ajoutée fraîche au moment de chaque service, jamais réchauffée, si le plat est reconsommé sur plusieurs repas.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la burrata, gluten via les linguine). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajout d'une portion fraîche de burrata à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour les pâtes et la bolognaise de légumes/lentilles jusqu'à 2-3 jours, sous réserve d'ajouter la burrata fraîche à chaque fois","justification":"La burrata ne doit jamais être réchauffée (voir conservation_note) ; le reste du plat (pâtes, bolognaise de légumes et lentilles) se réchauffe simplement."},"ingredients":[{"nom":"Lentilles vertes","quantite_par_portion":65,"unite":"g (crues)","placeholder":"lentilles_vertes"},{"nom":"Linguine","quantite_par_portion":65,"unite":"g (crues)","placeholder":"linguine"},{"nom":"Burrata","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"burrata"},{"nom":"Oignon","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Carotte","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"carotte"},{"nom":"Céleri (branche)","quantite_par_portion":0.25,"unite":"branche(s)","placeholder":"celeri"},{"nom":"Potimarron","quantite_par_portion":0.0625,"unite":"pièce(s) (1/4 de potimarron pour 4 pers.)","placeholder":"potimarron"},{"nom":"Tomates","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"tomates"},{"nom":"Bouillon cube","quantite_par_portion":12.5,"unite":"cl","placeholder":"bouillon","categorie":"à ajouter soi-même"},{"nom":"Sauce tomate","quantite_par_portion":5,"unite":"cl","placeholder":"sauce_tomate"},{"nom":"Basilic (branche)","quantite_par_portion":0.25,"unite":"branche(s)","placeholder":"basilic"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"trait, non quantifié","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Gros sel","quantite_par_portion":null,"unite":"non quantifié","placeholder":"gros_sel","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Cuisson des lentilles vertes (ajout)","contenu":"Rincez les {lentilles_vertes}. Faites-les cuire dans un grand volume d'eau non salée (le sel durcirait leur peau) pendant 20-25 minutes, jusqu'à ce qu'elles soient tendres mais encore fermes (elles doivent garder leur forme, contrairement à des lentilles corail). Égouttez et réservez."},{"titre":"Étape 1 — Préparation des légumes","contenu":"Épluche l'{oignon}, l'{gousse_d_ail} et tous les légumes. Cisèle l'oignon et hache l'ail. Coupe la {carotte} et le {celeri} en brunoise. Taille le {potimarron} en cubes de 4 mm d'épaisseur. Retire les pédoncules des {tomates}, forme une croix sur le haut, plonge-les dans une casserole d'eau bouillante pendant 3 secondes, puis égoutte-les et plonge-les dans un bain d'eau glacée. Épluche-les, coupe-les en quatre, retire le cœur au couteau et taille-les en cubes."},{"titre":"Étape 2 — Bouillon tomaté","contenu":"Mélange le {bouillon} et la {sauce_tomate} dans une casserole avec le {basilic} et porte à ébullition quelques minutes, puis baisse le feu."},{"titre":"Étape 3 — Cuisson des linguine","contenu":"Dans une grande casserole d'eau bouillante salée, plonge les {linguine} et laisse-les cuire 6 minutes."},{"titre":"Étape 4 — Bolognaise de légumes et lentilles","contenu":"Dans une sauteuse, fais chauffer un trait d'huile d'olive et fais revenir l'oignon avec l'ail sans coloration, ajoute le céleri et la carotte, continue la cuisson 3 minutes à feu moyen. Intègre le potimarron, sale, laisse cuire quelques minutes, puis verse du bouillon à hauteur, laisse cuire 5 minutes à feu frémissant. Ajoutez les lentilles vertes cuites et égouttées, mélangez et laissez mijoter 2-3 minutes supplémentaires pour qu'elles s'imprègnent des saveurs."},{"titre":"Étape 5 — Service","contenu":"Quand les pâtes sont cuites, égoutte-les à la pince en gardant l'eau de cuisson, dépose-les dans une sauteuse avec du bouillon tomaté, puis continue la cuisson 5 à 6 minutes. Sers les pâtes dans un plat à l'aide d'une pince et d'une louche, dépose dessus la bolognaise de légumes et lentilles. Au dernier moment, ajoute dessus les cubes de tomate, la {burrata} coupée en deux et poivre."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R029","nom":"Macaronis au ragoût à la tomate, mozzarella","sous_titre":"avec un soffritto de carotte et céleri","source":"Recette (fiche livre de cuisine, p.29), enrichie d'un soffritto carotte-céleri","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":45,"total_min":65},"ustensiles":["Sauteuse","Mixeur plongeant","Grande casserole d'eau bouillante (macaronis)"],"conservation_note":"La mozzarella en cubes doit être ajoutée fraîche au moment de chaque service, jamais réchauffée avec le reste : elle deviendrait caoutchouteuse. Seuls les macaronis et le ragoût sont à réchauffer.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la mozzarella et le parmesan, gluten via les macaronis). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajout d'une portion fraîche de mozzarella en cubes à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour les macaronis et le ragoût (voire meilleur après 1 jour de repos), jusqu'à 3-4 jours, sous réserve d'ajouter la mozzarella fraîche à chaque fois","justification":"Le ragù à la chair à saucisse et le soffritto mixé se réchauffent très bien ; seule la mozzarella ne doit jamais être réchauffée (voir conservation_note)."},"ingredients":[{"nom":"Carotte (soffritto)","quantite_par_portion":40,"unite":"g","placeholder":"carotte_soffritto"},{"nom":"Céleri (soffritto)","quantite_par_portion":40,"unite":"g","placeholder":"celeri_soffritto"},{"nom":"Macaronis secs","quantite_par_portion":80,"unite":"g","placeholder":"macaronis_secs"},{"nom":"Chair à saucisse","quantite_par_portion":175,"unite":"g","placeholder":"chair_a_saucisse"},{"nom":"Oignon","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Tomates pelées avec coulis","quantite_par_portion":112.5,"unite":"g","placeholder":"tomates_pelees"},{"nom":"Mozzarella","quantite_par_portion":62.5,"unite":"g","placeholder":"mozzarella"},{"nom":"Parmesan","quantite_par_portion":12.5,"unite":"g","placeholder":"parmesan"},{"nom":"Herbes (basilic, origan, thym, laurier)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"herbes","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"trait, non quantifié","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Gros sel","quantite_par_portion":null,"unite":"non quantifié","placeholder":"gros_sel","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Soffritto et viande","contenu":"Épluche et émince l'{oignon}. Épluche et coupe en petits dés la {carotte_soffritto} et le {celeri_soffritto}. Dans une sauteuse, verse un trait d'{huile_d_olive}, laisse chauffer, puis fais suer l'oignon, la carotte et le céleri ensemble avec une légère coloration. Ajoute la {chair_a_saucisse}, écrase bien pour que la viande se défasse. Laisse cuire 8 à 10 minutes, pour évaporer l'eau naturelle."},{"titre":"Étape 2 — Mijotage","contenu":"Assaisonne avec le {sel_poivre}. Ajoute les {herbes} de ton choix (basilic, thym, laurier, origan), puis les {tomates_pelees}, mélange et laisse cuire à petite ébullition pendant 20 à 30 minutes. Veille que cela n'attache pas au fond."},{"titre":"Mixage partiel du ragoût (ajout)","contenu":"Une fois le ragoût cuit, mixez-en environ un tiers au mixeur plongeant directement dans la sauteuse, jusqu'à ce que les morceaux de carotte et de céleri ne soient plus visibles. Mélangez avec le reste du ragoût non mixé."},{"titre":"Étape 3 — Cuisson des macaronis","contenu":"Fais bouillir une casserole d'eau avec un peu de {gros_sel} et plonges-y les {macaronis_secs}. Laisse cuire 8 minutes."},{"titre":"Étape 4 — Préparation de la mozzarella","contenu":"Pendant que les macaronis cuisent, taille la {mozzarella} en cubes. Garde de côté."},{"titre":"Étape 5 — Service","contenu":"Égoutte les macaronis, mélange-les bien avec le ragoût et ajoute la mozzarella. Répartis dans les assiettes. Râpe du {parmesan} au-dessus et décore de quelques feuilles de basilic ou d'une autre herbe."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R030","nom":"Mijoté de pois chiches et pain naan","sous_titre":null,"source":"Service diététique, Clinique Saint-Luc Bouge","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":40,"total_min":60},"ustensiles":["Casserole","Grand bol","Rouleau à pâtisserie","Poêle ou crêpière"],"conservation_note":"Le pain naan regagne en souplesse s'il est recuit quelques instants à la poêle ou à la crêpière à chaque service, plutôt que simplement réchauffé au micro-ondes.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment gluten via la farine, lait via le yaourt). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Le naan est recuit quelques instants à la poêle ou à la crêpière à chaque service pour regagner en souplesse.","qualite_conservation_2_a_4_jours":"bonne pour le mijoté de pois chiches jusqu'à 3-4 jours ; naan à recuire brièvement à chaque service","justification":"Le mijoté se réchauffe très bien ; le naan, simplement réchauffé au micro-ondes, deviendrait caoutchouteux, d'où l'intérêt de le repasser à la poêle."},"ingredients":[{"nom":"Pois chiches cuits égouttés","quantite_par_portion":130,"unite":"g (cuits)","placeholder":"pois_chiches_cuits"},{"nom":"Coulis de tomates","quantite_par_portion":150,"unite":"ml","placeholder":"coulis_de_tomates"},{"nom":"Pousses d'épinards","quantite_par_portion":100,"unite":"g","placeholder":"pousses_d_epinards"},{"nom":"Oignon","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Ras-el-hanout","quantite_par_portion":0.25,"unite":"cs","placeholder":"ras_el_hanout","categorie":"à ajouter soi-même"},{"nom":"Cumin","quantite_par_portion":0.125,"unite":"cc","placeholder":"cumin","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":0.25,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Miel","quantite_par_portion":0.25,"unite":"cc","placeholder":"miel","categorie":"à ajouter soi-même"},{"nom":"Sel, poivre (mijoté)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_mijote","categorie":"à ajouter soi-même"},{"nom":"Coriandre ou persil frais ciselé","quantite_par_portion":0.25,"unite":"botte(s)","placeholder":"coriandre_ou_persil"},{"nom":"Farine","quantite_par_portion":75,"unite":"g","placeholder":"farine"},{"nom":"Eau tiède","quantite_par_portion":25,"unite":"ml","placeholder":"eau_tiede","categorie":"à ajouter soi-même"},{"nom":"Yaourt nature maigre","quantite_par_portion":31.25,"unite":"g","placeholder":"yaourt_nature_maigre"},{"nom":"Levure chimique","quantite_par_portion":0.25,"unite":"cc","placeholder":"levure_chimique","categorie":"à ajouter soi-même"},{"nom":"Sel (naan)","quantite_par_portion":0.125,"unite":"cc","placeholder":"sel_naan","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Préparation de l'ail et de l'oignon","contenu":"Éplucher et émincer l'{gousse_d_ail} et l'{oignon}."},{"titre":"Suée","contenu":"Les faire revenir dans une casserole avec l'{huile_d_olive} jusqu'à ce qu'ils soient translucides."},{"titre":"Mijotage","contenu":"Ajouter le {ras_el_hanout}, le {cumin}, le {coulis_de_tomates}, le {sel_poivre_mijote} et le {miel} puis laisser mijoter 30 minutes à feu doux."},{"titre":"Préparation des épinards et pois chiches","contenu":"Laver les {pousses_d_epinards} et rincer les {pois_chiches_cuits}."},{"titre":"Ajout final","contenu":"Ajouter les épinards et les pois chiches dans la casserole et prolonger la cuisson pendant 10 minutes."},{"titre":"Finition du mijoté","contenu":"Ajouter la {coriandre_ou_persil} juste avant de servir."},{"titre":"Pâte à naan","contenu":"Mélanger le {yaourt_nature_maigre}, l'{eau_tiede} et la {levure_chimique} dans un grand bol."},{"titre":"Incorporation de la farine","contenu":"Y ajouter la {farine} petit à petit, puis le {sel_naan}."},{"titre":"Pétrissage","contenu":"Pétrir jusqu'à l'obtention d'une pâte homogène et la diviser en parts égales (une par personne)."},{"titre":"Façonnage","contenu":"Étaler chaque part de pâte à l'aide d'un rouleau à pâtisserie sur le plan de travail fariné."},{"titre":"Cuisson des naans","contenu":"Faire cuire chaque pain dans une poêle ou une crêpière bien chaude sur chacune des faces jusqu'à ce qu'il soit coloré."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R031","nom":"Nuggets de poulet maison","sous_titre":"avec pommes de terre sautées, carottes râpées & sauce minute","source":"Recette (fiche livre de cuisine, \"Troquez le fast food pour du fast good\")","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":10,"cuisson_min":9,"total_min":19},"ustensiles":["Robot mixeur","Poêle","Poêle (pommes de terre)","Râpe (carottes)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le fromage frais et le yaourt de la sauce, œuf, gluten via la farine et la chapelure). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Les nuggets panés perdent tout leur croustillant au réchauffage ; les pommes de terre sautées sèchent également. Les carottes râpées se conservent bien seules, mais l'ensemble du plat est conçu pour une consommation immédiate (typage B/C)."},"ingredients":[{"nom":"Pommes de terre","quantite_par_portion":65,"unite":"g","placeholder":"pommes_de_terre"},{"nom":"Carotte","quantite_par_portion":150,"unite":"g","placeholder":"carotte"},{"nom":"Blancs de poulet fermier ou Label Rouge","quantite_par_portion":100,"unite":"g","placeholder":"blancs_de_poulet"},{"nom":"Oignon doux","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"oignon_doux"},{"nom":"Ciboulette ou coriandre","quantite_par_portion":1,"unite":"brin(s)","placeholder":"ciboulette_ou_coriandre"},{"nom":"Fromage frais à tartiner","quantite_par_portion":25,"unite":"g","placeholder":"fromage_frais_a_tartiner"},{"nom":"Paprika","quantite_par_portion":null,"unite":"non quantifié","placeholder":"paprika","categorie":"à ajouter soi-même"},{"nom":"Farine (panure)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"farine_panure","categorie":"à ajouter soi-même"},{"nom":"Œuf","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oeuf"},{"nom":"Chapelure","quantite_par_portion":null,"unite":"non quantifié","placeholder":"chapelure","categorie":"à ajouter soi-même"},{"nom":"Huile de tournesol ou de pépins de raisin","quantite_par_portion":null,"unite":"filet, non quantifié","placeholder":"huile_tournesol_pepins_raisin","categorie":"à ajouter soi-même"},{"nom":"Sel et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"},{"nom":"Sauce minute (yaourt, citron, herbes fraîches)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"sauce_minute","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Préparation du poulet et des aromates","contenu":"Coupez le {blancs_de_poulet} en gros morceaux. Épluchez l'{oignon_doux} et coupez-le en cubes. Lavez et séchez la {ciboulette_ou_coriandre}."},{"titre":"Mixage de la farce","contenu":"Dans le bol d'un robot, mixez le poulet et l'oignon, les herbes fraîches, le {fromage_frais_a_tartiner} et du {paprika}. Salez et poivrez."},{"titre":"Façonnage et panure","contenu":"Avec cette préparation, confectionnez des boulettes de la taille d'une noix et aplatissez-les entre vos mains. Passez-les dans la {farine_panure}, puis dans l'{oeuf} battu et enfin dans la {chapelure}."},{"titre":"Cuisson des nuggets","contenu":"Faites chauffer un filet d'{huile_tournesol_pepins_raisin} dans une poêle et posez les nuggets de poulet. Laissez cuire à feu moyen 4 minutes sur chaque face, jusqu'à ce qu'ils aient une belle couleur dorée."},{"titre":"Pommes de terre sautées (ajout)","contenu":"Épluchez et coupez les {pommes_de_terre} en petits dés ou en rondelles fines. Faites chauffer un filet d'huile dans une poêle à feu moyen-vif. Faites-y sauter les pommes de terre 12-15 minutes, en remuant régulièrement, jusqu'à ce qu'elles soient dorées et tendres à cœur. Salez, poivrez."},{"titre":"Carottes râpées (ajout)","contenu":"Épluchez et râpez les {carotte}. Réservez au frais jusqu'au service, nature ou légèrement assaisonnées d'un filet de citron."},{"titre":"Service","contenu":"Servez aussitôt les nuggets accompagnés des pommes de terre sautées et des carottes râpées, avec la {sauce_minute} à base de yaourt, de citron et d'herbes fraîches."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R032","nom":"One pot : linguine, ricotta & chorizo","sous_titre":"avec de la tomate, du basilic & des poivrons","source":"HelloFresh","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":12,"cuisson_min":null,"total_min":30},"ustensiles":["Marmite avec couvercle","Pince de cuisine"],"conservation_note":"La ricotta et le basilic frais doivent être ajoutés au moment de chaque service, jamais réchauffés avec le reste : la ricotta perdrait sa texture fraîche et le basilic noircirait. Seuls les linguine, la sauce et le chorizo sont à réchauffer.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la ricotta, gluten via les linguine). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajout d'une portion fraîche de ricotta et de basilic ciselé à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour les linguine, la sauce et le chorizo jusqu'à 2-3 jours, sous réserve d'ajouter la ricotta et le basilic frais à chaque fois","justification":"La base pâtes/sauce/chorizo se réchauffe simplement ; seuls la ricotta et le basilic doivent être ajoutés frais à chaque service (voir conservation_note)."},"ingredients":[{"nom":"Linguine","quantite_par_portion":65,"unite":"g","placeholder":"linguine"},{"nom":"Dés de chorizo doux","quantite_par_portion":50,"unite":"g (cru)","placeholder":"chorizo_doux"},{"nom":"Poivron","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"poivron"},{"nom":"Tomates cerises en conserve","quantite_par_portion":100,"unite":"g","placeholder":"tomates_cerises"},{"nom":"Ricotta","quantite_par_portion":0.25,"unite":"pot(s)","placeholder":"ricotta"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Oignon","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Basilic","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"basilic"},{"nom":"Cube de bouillon de volaille","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"cube_de_bouillon","categorie":"à ajouter soi-même"},{"nom":"Eau chaude (bouillon)","quantite_par_portion":200,"unite":"ml","placeholder":"eau_chaude_bouillon","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":0.5,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Sucre","quantite_par_portion":0.5,"unite":"cc","placeholder":"sucre","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre_et_sel","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"L'art de la découpe","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Mélangez le {cube_de_bouillon} avec l'{eau_chaude_bouillon}. Ciselez finement l'{gousse_d_ail} et l'{oignon}. Épépinez le {poivron}, puis coupez-le en dés de 1 cm.","astuce_chef":"Utilisez une bouilloire si vous en avez une."},{"titre":"Chauffer les marmites !","contenu":"Faites chauffer un généreux filet d'{huile_d_olive} avec le {chorizo_doux} dans une marmite à feu moyen-vif. Faites-le dorer 1 min. Ajoutez-y l'ail, l'oignon et le poivron. Faites revenir le tout 3-4 min."},{"titre":"Un bon coup de cuillère","contenu":"Ajoutez le bouillon, les {tomates_cerises}, le {sucre} et les {linguine}. Salez légèrement et poivrez. Faites mijoter 8-10 min à feu moyen en remuant souvent, ou jusqu'à ce que les pâtes soient cuites et que la sauce soit épaisse (versez un peu d'eau chaude et prolongez la cuisson si nécessaire). Aidez-vous d'une pince pour immerger les pâtes dans la sauce afin qu'elles cuisent uniformément.","astuce_chef":"Baissez le feu si la sauce accroche au fond de la marmite."},{"titre":"Clap de fin","contenu":"Pendant ce temps, effeuillez le {basilic} et ciselez-le. Servez les pâtes en sauce dans les assiettes. Répartissez la {ricotta} et le basilic par-dessus. Salez et poivrez (selon votre goût)."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":719},{"id":"R033","nom":"Pâtes, petits pois & pesto de noix grillées","sous_titre":"avec des pois chiches, de la feta & du basilic","source":"Recette (fiche livre de cuisine, p.32 ; pesto p.251 reconstruit d'après une méthode établie, page originale non disponible)","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":10,"cuisson_min":20,"total_min":30},"ustensiles":["Grande casserole d'eau bouillante (pâtes)","Casserole d'eau bouillante (petits pois)","Saladier","Bol","Mixeur (pesto)","Poêle (torréfaction des noix)"],"conservation_note":"Les noix grillées et le basilic frais de finition gagnent à être ajoutés à chaque service plutôt que mélangés à l'avance, pour rester croquants et d'un vert vif.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le yaourt, la feta et le parmesan, fruits à coque via les noix). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Ajout de noix grillées et de basilic frais à chaque service pour rester croquant et d'un vert vif (facultatif mais recommandé).","qualite_conservation_2_a_4_jours":"bonne jusqu'à 3-4 jours (salade froide conçue pour être préparée à l'avance)","justification":"Salade de pâtes froide, se conservant très bien au réfrigérateur. Seule la finition (noix grillées, basilic frais) gagne à être refaite à chaque service pour un rendu optimal, mais le plat reste très bon même sans ce geste."},"ingredients":[{"nom":"Pois chiches cuits (en boîte, égouttés)","quantite_par_portion":65,"unite":"g","placeholder":"pois_chiches_cuits"},{"nom":"Pâtes (conchiglione, linguine, fusilli ou penne)","quantite_par_portion":100,"unite":"g","placeholder":"pates"},{"nom":"Huile d'olive (pâtes)","quantite_par_portion":2,"unite":"cl","placeholder":"huile_d_olive_pates","categorie":"à ajouter soi-même"},{"nom":"Sel (pâtes)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"sel_pates","categorie":"à ajouter soi-même"},{"nom":"Petit pois frais ou surgelé","quantite_par_portion":125,"unite":"g","placeholder":"petits_pois"},{"nom":"Yaourt grec ou skyr","quantite_par_portion":125,"unite":"g","placeholder":"yaourt_grec_ou_skyr"},{"nom":"Huile d'olive (salade de petits pois)","quantite_par_portion":3.75,"unite":"cl","placeholder":"huile_d_olive_salade","categorie":"à ajouter soi-même"},{"nom":"Ail (salade de petits pois)","quantite_par_portion":1,"unite":"gousse(s)","placeholder":"ail_salade"},{"nom":"Menthe","quantite_par_portion":0.5,"unite":"brin(s)","placeholder":"menthe"},{"nom":"Aneth","quantite_par_portion":0.5,"unite":"brin(s)","placeholder":"aneth"},{"nom":"Échalote","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"echalote"},{"nom":"Sel & poivre (salade de petits pois)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_salade","categorie":"à ajouter soi-même"},{"nom":"Parmesan en poudre ou râpé","quantite_par_portion":5,"unite":"g","placeholder":"parmesan"},{"nom":"Basilic frais (pesto)","quantite_par_portion":0.25,"unite":"botte(s)","placeholder":"basilic_pesto"},{"nom":"Ail (pesto)","quantite_par_portion":0.25,"unite":"gousse(s)","placeholder":"ail_pesto"},{"nom":"Huile d'olive (pesto)","quantite_par_portion":5,"unite":"cl","placeholder":"huile_d_olive_pesto","categorie":"à ajouter soi-même"},{"nom":"Sel (pesto)","quantite_par_portion":0.75,"unite":"g","placeholder":"sel_pesto","categorie":"à ajouter soi-même"},{"nom":"Cerneau de noix (pesto)","quantite_par_portion":15,"unite":"g","placeholder":"cerneau_de_noix_pesto"},{"nom":"Glaçon","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"glacon"},{"nom":"Feta","quantite_par_portion":60,"unite":"g","placeholder":"feta"},{"nom":"Feuille de basilic (finition)","quantite_par_portion":2.5,"unite":"pièce(s)","placeholder":"feuille_de_basilic_finition"},{"nom":"Noix grillée (finition)","quantite_par_portion":15,"unite":"g","placeholder":"noix_grillee_finition"}],"instructions":[{"titre":"Étape 1 — Pâtes","contenu":"Faire cuire les {pates} al dente dans une grande casserole d'eau bouillante salée en suivant les indications du paquet. Les refroidir aussitôt à l'eau froide. Dans un saladier, assaisonner les pâtes avec l'{huile_d_olive_pates} et le {sel_pates}."},{"titre":"Étape 2 — Salade de petits pois et pois chiches","contenu":"Faire cuire les {petits_pois} pendant 5 minutes dans une casserole d'eau bouillante bien salée. Les refroidir aussitôt dans une eau bien froide pour arrêter la cuisson. Dans un bol, verser le {yaourt_grec_ou_skyr}, mélanger avec l'{huile_d_olive_salade}, la {menthe} et l'{aneth} ciselées et l'{echalote} pelée et émincée. Ajouter l'{ail_salade} haché, le {sel_poivre_salade} et mélanger avant de verser sur les petits pois. Ajoutez les {pois_chiches_cuits} froids, directement dans le bol, sans cuisson supplémentaire."},{"titre":"Étape 3 — Pesto aux noix","contenu":"Faites légèrement torréfier le {cerneau_de_noix_pesto} à sec dans une poêle 2-3 minutes, en remuant, jusqu'à ce qu'il soit doré et parfumé. Laissez refroidir. Dans un mixeur, déposez les noix torréfiées, l'{ail_pesto} et le {parmesan}. Mixez par à-coups courts jusqu'à obtenir une texture grossière. Ajoutez le {basilic_pesto} effeuillé, le {sel_pesto} et les {glacon} (les glaçons refroidissent le mélange et évitent que les lames n'échauffent le basilic, ce qui le ferait noircir). Mixez de nouveau par à-coups courts en versant l'{huile_d_olive_pesto} progressivement, jusqu'à obtenir une texture homogène mais encore légèrement grainée."},{"titre":"Étape 4 — Service","contenu":"Mélanger les pâtes avec la salade de petits pois et pois chiches, et parsemer de {feta} émiettée. Ajouter des {feuille_de_basilic_finition} et des {noix_grillee_finition}. Assaisonner avec le pesto aux noix."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R034","nom":"Pavé de bœuf sauce Bercy","sous_titre":"avec des linguine, du comté & des haricots verts","source":"HelloFresh (fromage râpé à l'italienne remplacé par du comté)","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":35,"cuisson_min":null,"total_min":50},"ustensiles":["Sauteuse avec couvercle","Casserole avec couvercle","Éplucheur","Passoire","Poêle","Poêle (haricots verts)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le comté et le beurre, gluten via les linguine). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le pavé de bœuf est cuit rapidement pour rester saignant à point ; un réchauffage le cuirait entièrement et le durcirait, dénaturant l'intérêt du plat. Recette conçue pour une consommation immédiate (typage B/C)."},"ingredients":[{"nom":"Pavé de bœuf mariné","quantite_par_portion":180,"unite":"g (cru)","placeholder":"pave_de_boeuf"},{"nom":"Haricots verts","quantite_par_portion":150,"unite":"g","placeholder":"haricots_verts"},{"nom":"Comté râpé","quantite_par_portion":20,"unite":"g","placeholder":"comte_rape"},{"nom":"Linguine","quantite_par_portion":70,"unite":"g","placeholder":"linguine"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Oignon","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Persil","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"persil"},{"nom":"Échalote","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"echalote"},{"nom":"Carotte","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"carotte"},{"nom":"Feuille de laurier","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"feuille_de_laurier"},{"nom":"Bouillon de bœuf","quantite_par_portion":80,"unite":"ml","placeholder":"bouillon_de_boeuf","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":0.5,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Vinaigre balsamique blanc ou de riz","quantite_par_portion":1.5,"unite":"cs","placeholder":"vinaigre_balsamique_blanc_ou_de_riz","categorie":"à ajouter soi-même"},{"nom":"Beurre","quantite_par_portion":5,"unite":"g","placeholder":"beurre"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre_et_sel","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Légumes à la chaîne !","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Sortez la viande du réfrigérateur. Préparez le {bouillon_de_boeuf} avec de l'eau chaude. Portez une casserole d'eau salée à ébullition pour les pâtes. Ciselez finement l'{gousse_d_ail}, l'{oignon}, le {persil} et l'{echalote} séparément. Épluchez et coupez la {carotte} en dés de 5 mm (plus ils seront petits, plus ils cuiront vite)."},{"titre":"Quelle cuisson pour la viande ?","contenu":"Épongez le {pave_de_boeuf} avec de l'essuie-tout. Salez et poivrez-le des deux côtés. Faites chauffer une poêle à sec et à feu vif. Faites-y cuire la viande 1-2 min d'un côté, puis 1-2 min de l'autre. Réservez-la dans une assiette recouverte d'aluminium pour la garder au chaud.","astuce_chef":"Prolongez la cuisson de la viande de 1-2 min si vous l'aimez bien cuite."},{"titre":"Haricots verts (ajout)","contenu":"Équeutez les {haricots_verts}. Faites-les cuire à l'eau bouillante salée 8-10 minutes, jusqu'à ce qu'ils soient tendres mais encore légèrement croquants. Égouttez. Faites chauffer un filet d'huile d'olive dans une poêle et faites-y sauter les haricots verts 2-3 minutes pour les réchauffer et les colorer légèrement. Salez, poivrez."},{"titre":"Sauteuse en action","contenu":"Faites chauffer un petit filet d'huile d'olive à feu moyen-vif dans une sauteuse. Faites-y revenir l'oignon, la carotte et l'ail 3-5 min. Déglacez avec le {bouillon_de_boeuf} (voir l'astuce). Poivrez. Couvrez et faites mijoter à feu moyen 6-9 min, ou jusqu'à ce que la carotte soit légèrement fondante. Remuez régulièrement.","astuce_chef":"Attention, vous n'utilisez pas tout le bouillon pour la carotte. Veillez à en conserver pour l'étape suivante (sauce Bercy)."},{"titre":"La sauce Bercy","contenu":"Remettez la poêle de la viande à feu moyen avec le jus de cuisson. Faites-y revenir l'échalote 3-5 min, ou jusqu'à ce qu'elle soit fondante. Déglacez avec le {vinaigre_balsamique_blanc_ou_de_riz} et le bouillon restant. Portez à ébullition, puis faites réduire la sauce au moins de moitié, environ 2-4 min. Hors du feu, ajoutez le {beurre} en petits dés. Mélangez vigoureusement (au fouet si possible). Salez, poivrez et ajoutez les ⅔ du persil."},{"titre":"Les pâtes en ébullition","contenu":"Faites cuire les {linguine} avec la {feuille_de_laurier} 8-10 min dans la casserole d'eau bouillante. Égouttez-les et retirez la feuille de laurier. Ajoutez-les à la sauteuse des légumes, remuez 1 min et réservez à couvert."},{"titre":"Dressage en vue","contenu":"Coupez la viande en tranches dans le sens inverse des fibres afin de conserver sa tendreté. Servez les linguine et ses légumes dans les assiettes et saupoudrez de {comte_rape}. Disposez les tranches de viande à côté. Répartissez également les haricots verts sautés dans les assiettes. Nappez de sauce Bercy et saupoudrez du reste de persil."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":598},{"id":"R035","nom":"Penne forestières « minute » au poulet","sous_titre":"avec du comté râpé & des noisettes grillées","source":"HelloFresh (fromage râpé à l'italienne remplacé par du comté)","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["automne"],"temps":{"preparation_min":15,"cuisson_min":null,"total_min":20},"ustensiles":["Sauteuse","Casserole","Spatule","Passoire"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le comté, gluten via les penne, fruits à coque via les noisettes). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"La salade servie chaude/tiède sous les pâtes ne se conserve pas ; les noisettes grillées perdraient leur croquant. Recette conçue pour une consommation immédiate (typage B/C)."},"ingredients":[{"nom":"Blanc de poulet","quantite_par_portion":100,"unite":"g (cru)","placeholder":"blanc_de_poulet"},{"nom":"Comté râpé","quantite_par_portion":20,"unite":"g","placeholder":"comte_rape"},{"nom":"Penne","quantite_par_portion":90,"unite":"g","placeholder":"penne"},{"nom":"Portobello","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"portobello"},{"nom":"Salade","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"salade"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Noisettes grillées","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"noisettes_grillees"},{"nom":"Pesto de champignons","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"pesto_de_champignons"},{"nom":"Thym séché","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"thym_seche","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cc","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Vinaigre balsamique blanc ou de riz","quantite_par_portion":1,"unite":"cs","placeholder":"vinaigre_balsamique_blanc_ou_de_riz","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre_et_sel","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Top chrono !","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Portez une grande casserole d'eau salée à ébullition. Faites-y cuire les {penne} 10-12 min. Réservez 1 cs d'eau de cuisson par personne. Égouttez-les et réservez-les sans couvercle. En attendant, nettoyez les {portobello} avec un essuie-tout humide, puis coupez-les en fines tranches. Recoupez le {blanc_de_poulet} en plus petits dés de 1½ cm. Ciselez l'{gousse_d_ail}."},{"titre":"Et que ça saute !","contenu":"Pendant ce temps, faites chauffer un filet d'{huile_d_olive} dans une grande sauteuse à feu vif. Faites-y dorer les portobellos 3-4 min. Ajoutez le poulet et l'ail, puis faites cuire le tout 3-5 min à feu moyen-vif, ou jusqu'à ce que le poulet ne soit plus rosé à cœur. Salez et poivrez. Concassez les {noisettes_grillees}."},{"titre":"La sauce qui fait la diff'","contenu":"Baissez le feu sur moyen-doux, ajoutez le {vinaigre_balsamique_blanc_ou_de_riz} et le {pesto_de_champignons}. Grattez bien les sucs de cuisson avec une spatule. Ajoutez le {thym_seche}, l'eau de cuisson réservée et faites réchauffer le tout 1-2 min. Salez et poivrez."},{"titre":"Service express","contenu":"Juste avant de servir, ajoutez les penne ainsi que la moitié du {comte_rape} à la sauteuse. Mélangez bien. Servez la {salade} dans des assiettes, puis placez les pâtes forestières par-dessus. Saupoudrez de noisettes grillées et du reste du comté râpé.","astuce_chef":"Si vous n'aimez pas la salade chaude, servez-la dans des bols à côté."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":680},{"id":"R036","nom":"Penne au pesto d'amande et basilic","sous_titre":"avec du jambon de Parme & des tomates cerises","source":"Recette (fiche livre de cuisine, p.30)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":12,"cuisson_min":10,"total_min":22},"ustensiles":["Blender ou hachoir","Casserole","Écumoire","Sauteuse"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment fruits à coque via la poudre d'amandes, lait via le parmesan, gluten via les penne). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Les tomates cerises fraîches et le jambon de Parme cru sont ajoutés au dernier moment et perdraient leur intérêt réchauffés ; le pesto lui-même peut être conservé plusieurs jours au réfrigérateur ou congelé (astuce de la recette d'origine), mais le plat assemblé est conçu pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Jambon de Parme","quantite_par_portion":20,"unite":"g (cru, cru-séché)","placeholder":"jambon_de_parme"},{"nom":"Tomates cerises","quantite_par_portion":75,"unite":"g","placeholder":"tomates_cerises"},{"nom":"Penne","quantite_par_portion":87.5,"unite":"g","placeholder":"penne"},{"nom":"Poudre d'amandes","quantite_par_portion":13.75,"unite":"g","placeholder":"poudre_d_amandes"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Feuilles de basilic frais","quantite_par_portion":10,"unite":"g","placeholder":"feuilles_de_basilic"},{"nom":"Parmesan râpé","quantite_par_portion":12.5,"unite":"g","placeholder":"parmesan_rape"},{"nom":"Huile d'olive","quantite_par_portion":2,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Citron jaune bio (zeste et jus)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_jaune_bio"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Préparation","contenu":"Épluche l'{gousse_d_ail}. Lave et sèche bien le {feuilles_de_basilic}."},{"titre":"Étape 2 — Pesto d'amande","contenu":"Verse dans le bol du blender ou dans un hachoir la {poudre_d_amandes}, la gousse d'ail, le {parmesan_rape}, les feuilles de basilic, verse l'{huile_d_olive} en filet tout en mixant, ajoute le jus du {citron_jaune_bio} et mixe encore. Assaisonne avec le {sel_poivre}. Réserve ce pesto."},{"titre":"Étape 3 — Cuisson des pâtes et tomates cerises","contenu":"Dans une casserole d'eau bouillante salée, plonge les {penne} 7 minutes. Au terme de la cuisson, récupère à l'écumoire les pâtes (ainsi, tu gardes l'eau de cuisson) et fais-les revenir 1 minute à feu vif dans une sauteuse avec 1 à 2 cuillerées à soupe de pesto et 1 cuillerée à soupe d'eau de cuisson des pâtes. Mélange bien. Coupez les {tomates_cerises} en deux et incorporez-les aux penne, hors du feu, pour qu'elles restent fraîches et juteuses."},{"titre":"Étape 4 — Service","contenu":"Répartis les penne dans les assiettes, dépose sur chacune le {jambon_de_parme} en fines tranches directement sur les pâtes chaudes, parsème de parmesan, ajoute le zeste de citron finement râpé et des feuilles de basilic."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R038","nom":"Pois chiches tikka masala","sous_titre":"avec des poivrons & du riz","source":"Recette de collectivité (fiche \"100 repas\")","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":null,"cuisson_min":15,"total_min":null},"ustensiles":["Sauteuse","Casserole (pour le riz)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le yaourt et le lait de coco). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne, voire meilleure après 1-2 jours de repos, jusqu'à 3-4 jours","justification":"Curry mijoté classique qui se bonifie en reposant, aucun élément fragile identifié. Riz à réchauffer simplement avec un peu d'eau si besoin."},"ingredients":[{"nom":"Poivrons","quantite_par_portion":150,"unite":"g","placeholder":"poivrons"},{"nom":"Pois chiches cuits et égouttés","quantite_par_portion":130,"unite":"g","placeholder":"pois_chiches_cuits"},{"nom":"Riz","quantite_par_portion":65,"unite":"g (cru)","placeholder":"riz"},{"nom":"Oignons jaunes","quantite_par_portion":10,"unite":"g","placeholder":"oignons_jaunes"},{"nom":"Lait de coco","quantite_par_portion":60,"unite":"ml","placeholder":"lait_de_coco"},{"nom":"Yaourt (base sauce tikka masala)","quantite_par_portion":5,"unite":"g","placeholder":"yaourt_sauce_tikka"},{"nom":"Épices tikka masala (garam masala, cumin, curcuma, cardamome)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"epices_tikka_masala","categorie":"à ajouter soi-même"},{"nom":"Huile","quantite_par_portion":7.5,"unite":"ml","placeholder":"huile","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Chauffe de l'huile","contenu":"Faire chauffer l'{huile} dans une sauteuse."},{"titre":"Oignons, poivrons et sauce","contenu":"Faire revenir les {oignons_jaunes} et les {poivrons} avec la sauce ({yaourt_sauce_tikka} et {epices_tikka_masala}) à feu très doux."},{"titre":"Pois chiches","contenu":"Ajouter les {pois_chiches_cuits} et égouttés."},{"titre":"Premier mijotage","contenu":"Laisser mijoter 10 min."},{"titre":"Lait de coco","contenu":"Ajouter le {lait_de_coco} et laisser mijoter 5 min."},{"titre":"Riz","contenu":"Faire cuire le {riz}."},{"titre":"Service","contenu":"Servir le riz et les pois chiches aux poivrons."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R039","nom":"Poisson au four à l'huile d'olive, vierge de légumes","sous_titre":"avec des pommes de terre grenaille","source":"Recette (fiche livre de cuisine)","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":20,"cuisson_min":30,"total_min":50},"ustensiles":["Casserole (petits pois)","Plat pouvant aller sur le feu et au four","Plaque de cuisson (pommes de terre)","Four"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment poisson). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le poisson cuit se dessèche et perd sa texture au réchauffage ; la vierge de légumes crus est pensée pour être fraîche. Recette conçue pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Pommes de terre grenaille","quantite_par_portion":65,"unite":"g","placeholder":"pommes_de_terre_grenaille"},{"nom":"Pavé de poisson","quantite_par_portion":115,"unite":"g","placeholder":"pave_de_poisson"},{"nom":"Petits pois frais","quantite_par_portion":25,"unite":"g","placeholder":"petits_pois_frais"},{"nom":"Thym frais","quantite_par_portion":1,"unite":"brin(s)","placeholder":"thym_frais"},{"nom":"Bouillon de légumes","quantite_par_portion":6.25,"unite":"cl","placeholder":"bouillon_de_legumes","categorie":"à ajouter soi-même"},{"nom":"Tomates cerise ou tomates concassées","quantite_par_portion":25,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Petit brocoli","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"petit_brocoli"},{"nom":"Olives vertes dénoyautées","quantite_par_portion":2.5,"unite":"pièce(s)","placeholder":"olives_vertes"},{"nom":"Citron jaune (jus)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_jaune"},{"nom":"Huile d'olive","quantite_par_portion":3.75,"unite":"cl","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Piment d'Espelette ou piment en poudre","quantite_par_portion":null,"unite":"non quantifié","placeholder":"piment","categorie":"à ajouter soi-même"},{"nom":"Fleur de sel et sel fin","quantite_par_portion":null,"unite":"selon goût","placeholder":"fleur_de_sel_et_sel_fin","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Cuisson des petits pois","contenu":"Fais cuire les {petits_pois_frais} dans une casserole d'eau bouillante salée, 5 minutes. Égoutte-les sous l'eau froide et réserve."},{"titre":"Préchauffage","contenu":"Préchauffe le four à 180°C."},{"titre":"Pommes de terre grenaille (ajout)","contenu":"Lave les {pommes_de_terre_grenaille} sans les éplucher. Coupe-les en deux si elles sont grosses. Dispose-les sur une plaque, arrose d'un filet d'huile d'olive, sale, poivre, et enfourne 25-30 min à 180°C (en même temps que le poisson, sur une autre plaque), en retournant à mi-cuisson, jusqu'à ce qu'elles soient dorées et tendres."},{"titre":"Cuisson du poisson","contenu":"Dans un plat pouvant aller sur le feu, verse un trait d'{huile_d_olive}, laisse chauffer, puis dépose les {pave_de_poisson} salés, fais-les colorer d'un côté quelques minutes à feu moyen. Ajoute le {thym_frais} effeuillé et le {bouillon_de_legumes}. Enfourne le plat pour 8 à 10 minutes."},{"titre":"Vierge de légumes","contenu":"Pendant ce temps, coupe les {tomates_cerise} en quartiers, mélange-les avec les petits pois cuits, les petites sommités du {petit_brocoli} cru et les {olives_vertes} coupées en quatre. Ajoute le jus du {citron_jaune}, verse l'huile d'olive à mi-hauteur, assaisonne avec la {fleur_de_sel_et_sel_fin} et le {piment}."},{"titre":"Service","contenu":"Quand les poissons sont cuits, sors le plat du four, dépose les poissons dans un plat ou dans les assiettes, puis répartis la vierge de légumes dessus. Servez accompagné des pommes de terre grenaille et sers aussitôt."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R040","nom":"Poisson grillé","sous_titre":"avec riz brun & légumes sautés","source":"Recette (fiche \"Jolimoi / Ace Family\")","typage_generique":["B","C","D"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":15,"cuisson_min":25,"total_min":40},"ustensiles":["Casserole (riz)","Poêle (légumes)","Four avec grille"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment poisson). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le poisson grillé se dessèche et durcit au réchauffage. Recette conçue pour une consommation immédiate (typage B/C/D)."},"ingredients":[{"nom":"Filet de poisson","quantite_par_portion":150,"unite":"g","placeholder":"filet_de_poisson"},{"nom":"Riz brun","quantite_par_portion":90,"unite":"g (cru)","placeholder":"riz_brun"},{"nom":"Eau (cuisson du riz)","quantite_par_portion":240,"unite":"ml","placeholder":"eau_cuisson_riz","categorie":"à ajouter soi-même"},{"nom":"Carotte","quantite_par_portion":1,"unite":"pièce(s) (moyenne)","placeholder":"carotte"},{"nom":"Courgette","quantite_par_portion":0.5,"unite":"pièce(s) (moyenne)","placeholder":"courgette"},{"nom":"Oignon rouge","quantite_par_portion":0.5,"unite":"pièce(s) (moyen)","placeholder":"oignon_rouge"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Citron (jus)","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"citron"},{"nom":"Sel et poivre noir moulu","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_et_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Cuisson du riz brun","contenu":"Commencez par rincer le {riz_brun} sous l'eau courante. Placez-le dans une casserole avec l'{eau_cuisson_riz} et une pincée de sel. Faites-le cuire à feu moyen jusqu'à ce qu'il soit tendre et que toute l'eau soit absorbée (environ 15-20 minutes)."},{"titre":"Préparation du poisson","contenu":"Pendant que le riz cuit, préchauffez votre four à 250°C. Assaisonnez les {filet_de_poisson} avec le {sel_et_poivre}. Arrosez du jus de {citron} et laissez reposer pendant 5 minutes."},{"titre":"Légumes sautés","contenu":"Pendant ce temps, préparez la {carotte}, la {courgette} et l'{oignon_rouge} en les coupant en petits dés. Dans une poêle, faites chauffer l'{huile_d_olive} à feu moyen. Ajoutez les carottes, la courgette, l'oignon et l'{gousse_d_ail} haché. Faites sauter pendant environ 5-7 minutes, jusqu'à ce que les légumes soient tendres."},{"titre":"Cuisson du poisson au gril","contenu":"Placez les filets de poisson sur la grille et faites-les griller pendant environ 5-7 minutes de chaque côté, jusqu'à ce qu'ils soient bien cuits."},{"titre":"Service","contenu":"Servez le poisson grillé avec le riz brun et les légumes sautés."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R041","nom":"Poivron farci au pesto, fromage & orzo","sous_titre":"avec du poulet, du poireau & une salade de concombre","source":"HelloFresh","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["printemps","ete"],"temps":{"preparation_min":25,"cuisson_min":30,"total_min":55},"ustensiles":["Plaque de cuisson recouverte de papier sulfurisé","Sauteuse avec couvercle","Saladier"],"conservation_note":"La salade et le concombre doivent être assaisonnés et ajoutés fraîchement au moment de chaque service (comme déjà indiqué dans la recette d'origine : \"juste avant de servir\"), jamais préparés à l'avance ni réchauffés.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le fromage à la grecque). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"La salade et le concombre doivent être assaisonnés et ajoutés fraîchement à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour les poivrons farcis (voire réchauffés au four pour retrouver du croustillant), jusqu'à 3 jours, sous réserve de refaire la salade de concombre fraîche à chaque fois","justification":"Les poivrons farcis au poulet, orzo et fromage se réchauffent bien au four ; seule la salade de concombre doit être refaite fraîche à chaque service (voir conservation_note)."},"ingredients":[{"nom":"Blanc de poulet","quantite_par_portion":100,"unite":"g (cru)","placeholder":"blanc_de_poulet"},{"nom":"Fromage à la grecque","quantite_par_portion":50,"unite":"g","placeholder":"fromage_a_la_grecque"},{"nom":"Orzo","quantite_par_portion":67.5,"unite":"g","placeholder":"orzo"},{"nom":"Poivron","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"poivron"},{"nom":"Poireau","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"poireau"},{"nom":"Concombre","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"concombre"},{"nom":"Salade","quantite_par_portion":0.5,"unite":"sachet(s)","placeholder":"salade"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"gousse_d_ail"},{"nom":"Échalote","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"echalote"},{"nom":"Origan séché","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"origan_seche","categorie":"à ajouter soi-même"},{"nom":"Pesto vert alla genovese","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"pesto_vert_alla_genovese"},{"nom":"Bouillon de légumes","quantite_par_portion":175,"unite":"ml","placeholder":"bouillon_de_legumes","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Vinaigre balsamique blanc ou de riz","quantite_par_portion":0.5,"unite":"cs","placeholder":"vinaigre_balsamique_blanc_ou_de_riz","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","placeholder":"poivre_et_sel","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Opération découpe !","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Préchauffez le four à 210°C (190°C chaleur tournante). Préparez le {bouillon_de_legumes} avec de l'eau chaude. Ciselez finement l'{gousse_d_ail} et l'{echalote}. Coupez le {poireau} en quatre dans l'épaisseur, lavez-le bien et ciselez-le finement."},{"titre":"Les poivrons au chaud","contenu":"Coupez les {poivron} en deux et évidez-les. Placez-les sur une plaque recouverte de papier sulfurisé côté bombé vers le haut. Badigeonnez-les d'huile d'olive. Enfournez-les immédiatement 10-15 min."},{"titre":"L'orzo en action (avec le poulet)","contenu":"Faites chauffer un filet d'{huile_d_olive} dans une sauteuse à feu moyen. Coupez le {blanc_de_poulet} en petits dés. Faites-y revenir l'échalote, l'ail, le poireau et le poulet 4-5 min, jusqu'à ce que le poulet soit doré et plus rosé à cœur. Ajoutez l'{orzo}, l'{origan_seche} et faites revenir le tout 1 min. Versez le bouillon dans la sauteuse. Portez à ébullition puis baissez le feu, couvrez et faites cuire 10-12 min à feu moyen-doux, ou jusqu'à ce que le liquide soit absorbé et l'orzo al dente. Remuez régulièrement. Ajoutez éventuellement un peu d'eau si l'orzo accroche."},{"titre":"La touche vinaigrée","contenu":"Pendant ce temps, coupez le {concombre} en dés. Émiettez le {fromage_a_la_grecque}. Faites une vinaigrette en mélangeant l'{huile_d_olive} restante, le {vinaigre_balsamique_blanc_ou_de_riz}, le {poivre_et_sel} dans un saladier. Ajoutez le concombre. Juste avant de servir, ajoutez la {salade} et mélangez bien."},{"titre":"La cuisson, la suite","contenu":"Mélangez la moitié du fromage et le {pesto_vert_alla_genovese} avec l'orzo au poulet dans la sauteuse. Salez et poivrez. Garnissez les poivrons de la farce à l'orzo et saupoudrez du reste de fromage. Enfournez-les 8 min de plus, ou jusqu'à ce que le fromage fonde et dore un peu."},{"titre":"À table !","contenu":"Répartissez les poivrons farcis dans les assiettes. Servez la salade de concombre à côté."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":644},{"id":"R042","nom":"Poivrons farcis au quinoa et filet de poulet","sous_titre":null,"source":"Service diététique, Clinique Saint-Luc Bouge","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["ete"],"temps":{"preparation_min":20,"cuisson_min":30,"total_min":50},"ustensiles":["Cuiseur vapeur (ou casserole avec panier vapeur)","Casserole","Plat allant au four","Four","Poêle (sauce et poulet)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le fromage râpé et la crème). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne jusqu'à 3 jours (réchauffage au four recommandé pour les poivrons farcis, à la poêle ou au micro-ondes pour le poulet et la sauce)","justification":"Poivrons farcis, sauce et poulet se réchauffent simplement, aucun élément fragile identifié."},"ingredients":[{"nom":"Millet ou quinoa","quantite_par_portion":65,"unite":"g (cru)","placeholder":"millet_ou_quinoa"},{"nom":"Filet de poulet","quantite_par_portion":150,"unite":"g (cru)","placeholder":"filet_de_poulet"},{"nom":"Poivron","quantite_par_portion":1,"unite":"pièce(s)","placeholder":"poivron"},{"nom":"Tomate","quantite_par_portion":1.5,"unite":"pièce(s)","placeholder":"tomate"},{"nom":"Oignon","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon"},{"nom":"Fromage râpé","quantite_par_portion":25,"unite":"g","placeholder":"fromage_rape"},{"nom":"Huile d'olive","quantite_par_portion":0.5,"unite":"cs","placeholder":"huile_d_olive","categorie":"à ajouter soi-même"},{"nom":"Bouillon cube","quantite_par_portion":0.125,"unite":"pièce(s)","placeholder":"bouillon_cube","categorie":"à ajouter soi-même"},{"nom":"Herbes aromatiques (thym, laurier, origan, herbes de Provence...)","quantite_par_portion":null,"unite":"non quantifié","placeholder":"herbes_aromatiques","categorie":"à ajouter soi-même"},{"nom":"Sel et poivre","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_et_poivre","categorie":"à ajouter soi-même"},{"nom":"Crème","quantite_par_portion":25,"unite":"ml","placeholder":"creme"}],"instructions":[{"titre":"Préparation des poivrons","contenu":"Laver les {poivron}, les épépiner et les couper dans le sens de la longueur."},{"titre":"Cuisson vapeur des poivrons","contenu":"Les faire cuire de préférence à la vapeur pendant 20 minutes."},{"titre":"Préparation des tomates","contenu":"Couper les {tomate} en dés et réserver l'intérieur dans un récipient."},{"titre":"Suée de l'oignon (farce)","contenu":"Pour le {millet_ou_quinoa}, faire suer la moitié de l'{oignon} haché avec l'{huile_d_olive}."},{"titre":"Cuisson du féculent","contenu":"Ajouter le féculent avec deux fois son volume d'eau ainsi que le {bouillon_cube}."},{"titre":"Assaisonnement de la farce","contenu":"Mélanger les dés de tomates, le féculent, le {sel_et_poivre} et les {herbes_aromatiques}."},{"titre":"Farce et gratin","contenu":"Farcir les poivrons avec le mélange et répartir le {fromage_rape} dessus. Gratiner quelques minutes au four."},{"titre":"Préparation de la sauce","contenu":"Pour la sauce, faire revenir l'autre moitié de l'oignon avec l'huile d'olive. Ajouter l'intérieur des tomates réservé et faire cuire à feu doux."},{"titre":"Finition de la sauce et cuisson du poulet","contenu":"Assaisonner la sauce avec la {creme} et des herbes aromatiques au choix. Saler et poivrer. Cuire le {filet_de_poulet} dans une poêle à feu vif."},{"titre":"Service","contenu":"Servir les poivrons farcis avec le filet de poulet et la sauce."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R043","nom":"Poularde aux morilles et vin jaune","sous_titre":"avec des tagliatelles fraîches & des carottes fondantes","source":"Recette (fiche livre de cuisine, p.129, cuisine franc-comtoise)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":45,"cuisson_min":100,"total_min":null},"ustensiles":["Cocotte en fonte","Grande casserole d'eau bouillante (tagliatelles)","Casserole ou cuiseur vapeur (carottes)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre et la crème fleurette, gluten via la farine et les tagliatelles). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne, voire meilleure après 1-2 jours de repos, jusqu'à 3-4 jours","justification":"Plat mijoté classique de gastronomie régionale qui se bonifie en reposant. Les tagliatelles fraîches et les carottes se réchauffent simplement avec la sauce."},"ingredients":[{"nom":"Tagliatelles fraîches","quantite_par_portion":65,"unite":"g","placeholder":"tagliatelles_fraiches"},{"nom":"Carotte","quantite_par_portion":150,"unite":"g","placeholder":"carotte"},{"nom":"Morilles déshydratées","quantite_par_portion":25,"unite":"g","placeholder":"morilles_dehydratees"},{"nom":"Poularde (morceaux sur os)","quantite_par_portion":366.67,"unite":"g","placeholder":"poularde"},{"nom":"Échalote","quantite_par_portion":0.33,"unite":"pièce(s)","placeholder":"echalote"},{"nom":"Beurre","quantite_par_portion":6.67,"unite":"g","placeholder":"beurre"},{"nom":"Farine","quantite_par_portion":5,"unite":"g","placeholder":"farine"},{"nom":"Bouillon de volaille","quantite_par_portion":8.33,"unite":"cl","placeholder":"bouillon_de_volaille","categorie":"à ajouter soi-même"},{"nom":"Vin jaune","quantite_par_portion":5.17,"unite":"cl","placeholder":"vin_jaune"},{"nom":"Crème fleurette","quantite_par_portion":3.33,"unite":"cl","placeholder":"creme_fleurette"},{"nom":"Huile de tournesol","quantite_par_portion":null,"unite":"non quantifié","placeholder":"huile_de_tournesol","categorie":"à ajouter soi-même"},{"nom":"Sel gris moulu et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Réhydratation des morilles (3h à l'avance)","contenu":"Réhydratez les {morilles_dehydratees} dans de l'eau tiède 3 heures auparavant. Égouttez-les et taillez-les dans la longueur, en deux ou quatre pour les plus grosses. Renouvelez le lavage 3 fois et égouttez."},{"titre":"Rissolage de la volaille","contenu":"Dans une cocotte en fonte, faites chauffer de l'{huile_de_tournesol} et faites rissoler les morceaux de {poularde} sur toutes les faces. Salez et poivrez."},{"titre":"Préparation des échalotes","contenu":"Épluchez et ciselez l'{echalote} pendant ce temps. Débarrassez la volaille, dégraissez la cocotte, ajoutez le {beurre} et faites revenir les échalotes."},{"titre":"Cuisson des morilles et de la volaille","contenu":"Ajoutez les morilles, remuez et laissez étuver à couvert pendant 3 à 4 minutes. Déposez les morceaux de volaille sur les morilles, saupoudrez de {farine} et laissez cuire pendant 5 minutes. Versez le {bouillon_de_volaille}, puis la moitié du {vin_jaune}. Remuez, couvrez et laissez cuire à frémissement pendant 1 heure."},{"titre":"Carottes fondantes (ajout)","contenu":"Épluchez les {carotte}, coupez-les en rondelles ou en bâtonnets. Faites-les cuire à la vapeur ou à l'eau bo r"},{"nom":"Poivre noir en grains","quantite_par_portion":0.25,"unite":"cc","placeholder":"poivre_noir_en_grains","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Découpe et préparation des aromates","contenu":"Coupez les {cuisse_de_poulet} en deux. Épluchez et émincez l'{oignon}. Épluchez et écrasez les {gousse_d_ail}."},{"titre":"Préparation de la sauce et ajout des pommes de terre","contenu":"Dans une cocotte, versez l'oignon, l'ail, la {sauce_soja}, l'{eau_cuisson_poulet}, le {sucre_rapadura}, l'{huile_de_pepins_de_raisin} et le {vinaigre_d_alcool_blanc}. Ajoutez la {feuille_de_laurier} et le {poivre_noir_en_grains} concassé. Épluchez les {pommes_de_terre}, coupez-les en gros cubes et ajoutez-les à la cocotte."},{"titre":"Première cuisson","contenu":"Déposez les morceaux de poulet dans la cocotte. Mettez la cocotte sur le feu et portez à ébullition. Couvrez, réduisez le feu et comptez 30 minutes de cuisson."},{"titre":"Riz blanc à l'autocuiseur (ajout)","contenu":"Rincez le {riz_blanc} à l'eau claire jusqu'à ce que l'eau ressorte claire. Placez-le dans l'autocuiseur avec la même quantité d'eau (ratio 1:1) et une pincée de sel. Verrouillez le couvercle et cuisez 4-5 minutes à pleine pression une fois celle-ci atteinte. Laissez la pression redescendre naturellement pendant 10 minutes avant d'ouvrir. Égrenez à la fourchette avant de servir."},{"titre":"Haricots verts vapeur (ajout)","contenu":"Équeutez les {haricots_verts}. Faites-les cuire à la vapeur 8-10 minutes, jusqu'à ce qu'ils soient tendres mais encore légèrement croquants. Réservez."},{"titre":"Fin de cuisson","contenu":"Retournez les morceaux de poulet et poursuivez la cuisson pendant 15 minutes, toujours à couvert. Terminez par 15 minutes de cuisson à découvert."},{"titre":"Service","contenu":"Servez le poulet et les pommes de terre mijotées dans leur sauce, accompagnés du riz blanc et des haricots verts vapeur. Servez bien chaud."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bo
