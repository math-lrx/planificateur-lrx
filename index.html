<title>Planificateur hebdomadaire des repas de la famille LRX</title>
<style>
  :root{
    --ardoise: #1A272B; --moutarde: #FDA401; --moutarde-clear: #FFC24D;
    --sauge: #4F6B0C; --fond: #F7F5F0; --papier: #FFFFFF; --encre: #2B2620; --alerte: #A32A11; --radius: 4px;
    --orange-vif: #FE9601; --rouge-vif: #FD2D1E; --grad-marque: linear-gradient(135deg, var(--orange-vif), var(--rouge-vif));
    --dot-olive:#82A71C; --dot-ambre:#FDA401; --dot-corail:#FC3E1F; --dot-sarcelle:#249FAF; --dot-taupe:#BFB0A3; --dot-prune:#702388;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
  body{margin:0;background:var(--fond);color:var(--encre);font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;min-height:100vh;}
  .shell{max-width:680px;margin:0 auto;padding:0 0 64px;}
  header.top{background:var(--papier);color:var(--encre);padding:22px 20px 20px;position:relative;border-bottom:1px solid #ECE6D6;}
  header.top::after{content:'';display:block;position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--grad-marque);}
  header.top .brand-row{display:flex;align-items:center;gap:12px;}
  header.top .brand-row img{display:block;height:52px;width:auto;flex:none;}
  header.top .brand-word{font-family:ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;font-weight:800;font-size:32px;color:var(--ardoise);letter-spacing:-.01em;line-height:1;}
  header.top .brand-word .accent{color:#C6530A;}
  header.top .brand-row.small img{height:32px;}
  header.top .brand-row.small .brand-word{font-size:19px;}
  header.top h1{margin:0;line-height:0;}
  header.top p.brand-subtitle{margin:12px 0 0;color:#6b6456;font-size:14px;max-width:48ch;line-height:1.5;}
  header.top .eyebrow{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sauge);margin-bottom:8px;}
  header.top h1.simple{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-weight:700;font-size:22px;margin:0 0 6px;color:var(--ardoise);line-height:1.15;}
  header.top p.simple{margin:0;color:#6b6456;font-size:14px;}
  .stepper{display:flex;gap:6px;padding:14px 20px 0;background:var(--papier);}
  .stepper .dot{flex:1;height:4px;border-radius:2px;background:#E9E3D4;}
  .stepper .dot.active{background:var(--moutarde);}
  .stepper .dot.done{background:var(--dot-taupe);}
  .stepper .dot.done[data-step-n="1"]{background:var(--dot-olive);}
  .stepper .dot.done[data-step-n="2"]{background:var(--dot-ambre);}
  .stepper .dot.done[data-step-n="3"]{background:var(--dot-corail);}
  .stepper .dot.done[data-step-n="4"]{background:var(--dot-sarcelle);}
  .stepper .dot.done[data-step-n="5"]{background:var(--dot-prune);}
  section{padding:26px 20px 6px;}
  section h2{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-size:20px;color:var(--ardoise);margin:0 0 4px;}
  section .sub{color:#6b6456;font-size:13px;margin:0 0 16px;}
  .scenario-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:560px){.scenario-grid{grid-template-columns:1fr;}}
  .scenario-grid.two{grid-template-columns:1fr 1fr;}
  @media (max-width:480px){.scenario-grid.two{grid-template-columns:1fr;}}
  .scenario-card{background:var(--papier);border:1.5px solid #E7E1D2;border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 1px 3px rgba(43,38,32,.05);}
  .scenario-card:hover{border-color:var(--moutarde-clear);}
  .scenario-card:focus-visible{outline:3px solid var(--moutarde-clear);outline-offset:2px;}
  .scenario-card.selected{border-color:var(--moutarde);background:#FBF7EC;}
  .scenario-card .tag{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--sauge);font-weight:600;}
  .scenario-card h3{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-size:15.5px;margin:6px 0 4px;}
  .scenario-card p{font-size:11.8px;margin:0;color:#5b544a;}
  .recap{background:var(--papier);border:1px solid #E7E1D2;border-radius:var(--radius);padding:14px 16px;margin-top:16px;box-shadow:0 1px 3px rgba(43,38,32,.05);}
  .recap-title{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sauge);margin-bottom:10px;}
  .recap-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  @media (max-width:480px){.recap-grid{grid-template-columns:repeat(3,1fr);}}
  .recap-item{text-align:center;}
  .recap-item .letter{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-weight:700;font-size:17px;color:var(--ardoise);}
  .recap-item .val{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:12px;color:#5b544a;}
  .grid-day{background:var(--papier);border:1px solid #E7E1D2;border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(43,38,32,.05);}
  .grid-day .jour-label{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-weight:600;font-size:15px;color:var(--ardoise);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .grid-day .jour-label .retire-btn{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;}
  .repas-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #ddd2b8;}
  .repas-row:first-of-type{border-top:none;}
  .repas-row .moment{font-size:12.5px;font-weight:600;color:#5b544a;width:52px;flex:none;}
  .repas-row .letter-chip{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:10.5px;background:var(--ardoise);color:var(--papier);padding:2px 6px;border-radius:9px;flex:none;}
  .qty-inputs{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .qty-field{display:flex;flex-direction:column;align-items:center;}
  .qty-field label{font-size:9.5px;color:#7a7266;font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;text-align:center;line-height:1.2;margin-bottom:2px;}
  .qty-field input{width:42px;text-align:center;padding:5px 2px;border:1.5px solid #d8cfb8;border-radius:var(--radius);font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:13px;}
  .qty-field input:focus-visible{outline:3px solid var(--moutarde-clear);outline-offset:1px;}
  .retire-btn{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:11px;padding:5px 9px;border-radius:12px;border:1.5px solid #d8cfb8;background:#fff;color:#7a7266;cursor:pointer;flex:none;}
  .retire-btn.active{background:var(--alerte);border-color:var(--alerte);color:#fff;}
  .repas-row.retired .qty-inputs, .repas-row.retired .dispo-row{opacity:.35;pointer-events:none;}
  .dispo-row{width:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center;}
  .dispo-btn{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;padding:5px 9px;border-radius:12px;border:1.5px solid #d8cfb8;background:#fff;color:#5b544a;cursor:pointer;text-align:center;}
  .dispo-btn small{display:block;font-size:9.5px;opacity:.75;font-weight:400;}
  .dispo-btn.active{background:var(--ardoise);border-color:var(--ardoise);color:#fff;}
  .lot-recap-item{padding:8px 0;border-top:1px dashed #ddd2b8;font-size:13px;}
  .lot-recap-item:first-of-type{border-top:none;}
  .profil-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .profil-note{font-size:12.5px;color:#5b544a;background:var(--papier);border-radius:var(--radius);padding:8px 12px;margin:10px 0;}
  .dispo-reconso-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:#5b544a;margin-top:4px;}
  .criteria-card{background:var(--papier);border:1px solid #E7E1D2;border-radius:var(--radius);padding:16px;margin-top:16px;box-shadow:0 1px 3px rgba(43,38,32,.05);}
  .criteria-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed #ddd2b8;}
  .criteria-row:first-of-type{border-top:none;}
  .criteria-row.col{flex-direction:column;align-items:flex-start;}
  .criteria-row .lbl{font-size:13.5px;color:var(--encre);}
  .criteria-row .lbl small{display:block;font-size:11px;color:#7a7266;}
  .criteria-row input[type=number]{width:52px;text-align:center;padding:6px 4px;border:1.5px solid #d8cfb8;border-radius:var(--radius);font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:14px;}
  .criteria-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--sauge);}
  .saison-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .saison-options label{display:flex;align-items:center;gap:5px;font-size:12px;background:#fff;border:1px solid #e2d9c1;border-radius:12px;padding:5px 10px;}
  .slot-card{background:var(--papier);border:1px solid #E7E1D2;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(43,38,32,.05);}
  .slot-card.orpheline{border:2px solid var(--alerte);}
  .slot-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .slot-head .letter{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-weight:700;font-size:17px;color:var(--ardoise);}
  .slot-head .portions{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:12px;background:var(--ardoise);color:var(--papier);padding:3px 8px;border-radius:12px;white-space:nowrap;}
  .slot-card select{width:100%;padding:10px 12px;font-size:14px;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;border:1.5px solid #d8cfb8;border-radius:var(--radius);background:#fff;color:var(--encre);margin-top:8px;}
  .slot-card select:focus-visible{outline:3px solid var(--moutarde-clear);outline-offset:1px;}
  .warn{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--alerte);font-weight:600;}
  .info-douce{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:#8a8172;}
  .season-badge{display:inline-block;margin-top:8px;margin-right:6px;font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;font-size:10.5px;color:var(--sauge);background:#eef1ea;padding:2px 7px;border-radius:10px;}
  .calendrier{margin-top:10px;background:#fff;border-radius:var(--radius);padding:10px 12px;border:1px solid #e8dfc8;}
  .calendrier-row{font-size:12.5px;padding:3px 0;color:#4a453c;}
  .calendrier-row.prep{font-weight:700;color:var(--ardoise);}
  .cta{display:block;width:100%;padding:14px;margin-top:20px;background:var(--grad-marque);color:var(--ardoise);border:none;border-radius:var(--radius);font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(253,45,30,.28);}
  .cta:hover{filter:brightness(1.06);}
  .cta:focus-visible{outline:3px solid var(--papier);outline-offset:2px;}
  .cta.secondary{background:transparent;border:1.5px solid rgba(26,39,43,.28);color:var(--ardoise);font-weight:600;box-shadow:none;}
  .cta.secondary:hover{border-color:var(--moutarde);background:rgba(253,164,1,.1);filter:none;}
  
  .cta:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .ticket-wrap{background:var(--fond);padding:0 20px 40px;}
  .ticket{background:#fffdf8;color:var(--encre);border-radius:2px;padding:22px 20px 26px;box-shadow:0 12px 28px rgba(0,0,0,.35);position:relative;}
  .ticket::before{content:"";display:block;height:10px;margin:-22px -20px 16px;background-image: radial-gradient(circle, var(--fond) 4px, transparent 4.5px);background-size:16px 10px; background-position:0 -5px; background-repeat:repeat-x;}
  .ticket h3{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;font-size:19px;margin:0 0 2px;text-align:center;}

z pas le bœuf trop longtemps et faites-le revenir 1 min de plus seulement si vous l'aimez cuit."},{"titre":"Direction le Vietnam","contenu":"Versez les nouilles dans des bols ou des assiettes creuses. Arrosez-les avec le ⅓ de sauce restante. Placez par-dessus le concombre, la carotte et le bœuf. Saupoudrez de cacahuètes et d'herbes ciselées.","astuce_chef":"Ce plat repose sur l'équilibre des saveurs : ainsi, pensez à prendre un peu de chaque ingrédient à chaque bouchée."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":586},{"id":"R003","nom":"Bœuf bourguignon, tagliatelles au Brillat-Savarin","sous_titre":null,"source":"Recette (fiche papier, non HelloFresh)","typage_generique":["E","F"],"vegetarien":false,"saisonnalite":["automne","hiver","printemps"],"temps":{"preparation_min":35,"cuisson_min":160,"total_min":195},"ustensiles":["Cocotte (allant au four)","Four","Casserole","Grande casserole d'eau bouillante"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le Brillat-Savarin, la crème liquide et le beurre, gluten via les tagliatelles). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne, voire meilleure après 1-2 jours de repos, jusqu'à 3-4 jours","justification":"Plat mijoté classique dont la saveur se bonifie en reposant. Aucun élément fragile, se réchauffe simplement (tagliatelles à réchauffer avec un peu de crème si besoin)."},"ingredients":[{"nom":"Bœuf (macreuse ou collier)","quantite_par_portion":333.33,"unite":"g"},{"nom":"Carotte","quantite_par_portion":0.67,"unite":"pièce(s)"},{"nom":"Champignon de Paris","quantite_par_portion":33.33,"unite":"g"},{"nom":"Céleri","quantite_par_portion":0.5,"unite":"branche(s)"},{"nom":"Oignon rouge","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Oignon grelot","quantite_par_portion":33.33,"unite":"g"},{"nom":"Ail","quantite_par_portion":0.67,"unite":"gousse(s)"},{"nom":"Lard fumé","quantite_par_portion":25,"unite":"g"},{"nom":"Concentré de tomates","quantite_par_portion":4.17,"unite":"g"},{"nom":"Feuilles de laurier","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Vin rouge de Bourgogne","quantite_par_portion":12.5,"unite":"cl"},{"nom":"Huile neutre","quantite_par_portion":2.5,"unite":"cl"},{"nom":"Muscade râpée","quantite_par_portion":0.17,"unite":"g"},{"nom":"Beurre","quantite_par_portion":16.67,"unite":"g"},{"nom":"Sel & poivre","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"},{"nom":"Tagliatelles fraîches","quantite_par_portion":66.67,"unite":"g"},{"nom":"Brillat-Savarin","quantite_par_portion":20.83,"unite":"g"},{"nom":"Crème liquide","quantite_par_portion":2.08,"unite":"cl"},{"nom":"Persil plat","quantite_par_portion":0.083,"unite":"botte(s)"}],"instructions":[{"titre":"Pour le bœuf bourguignon","contenu":"Rincer la viande sous l'eau froide, l'égoutter sur un papier absorbant et couper des morceaux réguliers. Préchauffer le four à 170°C. Éplucher les carottes et les couper en tronçons, laver les champignons et ôter les queues, éplucher les oignons et les couper en gros dés, éplucher l'ail, émincer le céleri, éplucher les oignons grelots. Dans une cocotte, faire bien chauffer l'huile et colorer les morceaux de viande sur chaque côté. Réserver. Verser les carottes, les oignons rouges, le céleri et le lard fumé coupé en gros lardons dans la graisse de cuisson, faire suer légèrement, ajouter le concentré de tomates et faire cuire pendant 3 minutes pour retirer l'acidité. Verser le vin rouge et cuire de nouveau 5 minutes pour enlever l'alcool. Ajouter l'ail, le laurier, les champignons, les oignons grelots et la viande, compléter avec de l'eau, remuer et enfourner pendant 2 h 30."},{"titre":"Pour les tagliatelles","contenu":"Dans une casserole, faire chauffer la crème liquide, ajouter le fromage coupé en morceaux et mixer. Plonger les tagliatelles fraîches dans une grande casserole d'eau bouillante pendant 4 minutes, les égoutter, les remettre dans la casserole et napper de crème de Brillat-Savarin."},{"titre":"Pour le service","contenu":"Parsemer les pâtes de persil ciselé et les servir pour accompagner le bourguignon."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R004","nom":"Boulettes de bœuf caramélisées","sous_titre":null,"source":"Service diététique, Clinique Saint-Luc Bouge — inspiré du livre \"Je batch cook toute l'année\" (Larousse)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["ete","automne"],"temps":{"preparation_min":null,"cuisson_min":25,"total_min":null},"ustensiles":["Bols","Plat allant au four","Four","Casserole (pour la cuisson du petit épeautre)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment gluten via la chapelure, œuf). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_t usse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Thym frais","quantite_par_portion":0.25,"unite":"brin(s)"},{"nom":"Basilic","quantite_par_portion":0.125,"unite":"botte(s)"},{"nom":"Parmesan (ou autre fromage râpé)","quantite_par_portion":7.5,"unite":"g"},{"nom":"Œufs","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Ricotta (ou autre fromage frais)","quantite_par_portion":25,"unite":"g"},{"nom":"Persil haché","quantite_par_portion":0.5,"unite":"cs"},{"nom":"Pain sans croûte trempé dans du lait","quantite_par_portion":25,"unite":"g"},{"nom":"Burrata","quantite_par_portion":62.5,"unite":"g","placeholder":"burrata"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"trait, non quantifié","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"},{"nom":"Gros sel","quantite_par_portion":null,"unite":"pour l'eau de cuisson, non quantifié","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — La sauce tomate","contenu":"Épluche et émince l'oignon et hache l'ail. Dans une casserole, fais chauffer un trait d'huile d'olive, fais suer l'oignon. Verse les tomates, le thym, l'ail et le basilic, laisse cuire à feu frémissant jusqu'à ce que l'eau des tomates soit évaporée."},{"titre":"Étape 2 — Les boulettes","contenu":"Dans un saladier, dépose les deux viandes hachées, mélange avec le parmesan râpé, les œufs, la ricotta, le persil haché et le pain trempé dans du lait et pressé. Malaxe et assaisonne avec du sel fin et du poivre du moulin. Forme des boulettes à la main et dépose-les dans une assiette (tu dois obtenir environ 30 boulettes)."},{"titre":"Étape 3 — Cuisson des boulettes","contenu":"Préchauffe le four à 170°C. Dans une poêle chaude, verse un trait d'huile d'olive, dépose les boulettes, fais-les bien dorer quelques minutes à feu vif, puis transfère-les dans un plat à four et verse un peu de sauce tomate dessus, enfourne pour 7 minutes."},{"titre":"Étape 4 — Cuisson des penne","contenu":"Dans une casserole d'eau bouillante salée, plonge {penne}, laisse-les cuire 7 minutes."},{"titre":"Étape 5 — Liaison des penne","contenu":"Dans la poêle chaude de cuisson des boulettes, dépose 2 à 3 cuillerées à soupe de sauce tomate, égoutte les penne à l'écumoire (et non dans une passoire, car l'eau de cuisson apporte l'amidon qui lie les sauces) et mets-les dans la sauce. Réchauffe 2 minutes, juste pour lier."},{"titre":"Poivrons sautés (ajout)","contenu":"Lavez et épépinez {poivrons}, coupez-les en lanières. Faites chauffer un filet d'huile d'olive dans une poêle à feu vif et faites-y sauter les poivrons 8-10 min, jusqu'à ce qu'ils soient tendres et légèrement colorés. Salez, poivrez."},{"titre":"Étape 6 — Service","contenu":"Dans les assiettes creuses, répartis les penne à la sauce tomate, dépose les boulettes et ajoute {burrata}, un trait d'huile d'olive, quelques feuilles de basilic. Répartissez également les poivrons sautés dans les assiettes, aux côtés des penne et des boulettes."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R006","nom":"Burrito bowl porc & cheddar à la mexicaine","sous_titre":"avec de l'avocat & une salsa à la tomate","source":"HelloFresh","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":25,"cuisson_min":null,"total_min":40},"ustensiles":["2x bol","Casserole","Poêle"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le cheddar et le yaourt). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffag tructions":[{"titre":"En rang d'oignon","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Préparez le bouillon avec de l'eau chaude. Coupez l'oignon en très fines demi-lunes. Placez-en la moitié dans un bol (réservez le reste pour l'étape suivante). Dans le bol, ajoutez une pincée de sel et de sucre ainsi que {vinaigre_de_vin_rouge_ou_de_cidre} et 1cs d'eau. Mélangez et laissez reposer. Remuez de temps à autre pour que l'oignon soit bien imbibé."},{"titre":"Casserole en action","contenu":"Dans une casserole, faites chauffer un filet d'huile d'olive à feu moyen-vif. Faites-y revenir le reste d'oignon 2-3 min, ou jusqu'à ce qu'il commence à dorer. Ajoutez le riz ainsi que {epices_mexicaines} (ça pique ! Dosez-les selon votre goût) et mélangez. Une fois le riz devenu translucide (après environ 1 min), versez le bouillon, portez à ébullition et laissez cuire à feu moyen 12-15 min, ou jusqu'à absorption complète du liquide. Insérez un peu d'eau si le riz n'est pas tout à fait cuit."},{"titre":"Chop, chop","contenu":"Pendant ce temps, coupez l'avocat en deux, retirez le noyau, ôtez la chair avec une cuillère et coupez-la en fines tranches. Effeuillez et ciselez le persil. Ciselez l'ail. Coupez les tomates en petits dés.","astuce_chef":"Si votre couteau n'est pas très aiguisé, vous pouvez utiliser un couteau à pain ou à dents pour couper la tomate."},{"titre":"On mélange","contenu":"Recoupez les {porc_marine} en plus petites lanières. Dans un bol, mélangez la viande avec l'ail et un filet d'huile d'olive. Salez et poivrez."},{"titre":"Allumer le feu","contenu":"Faites chauffer une poêle à feu vif et faites-y dorer le porc et sa marinade 2-3 min, ou jusqu'à ce que la viande soit bien dorée et ne soit plus rosée à cœur. Coupez le feu, déglacez avec 1 cs de jus de pickles d'oignon et ajoutez la moitié du {cheddar_rape}. Mélangez et laissez fondre le fromage."},{"titre":"Chacun son bowl !","contenu":"Servez le riz dans des bols ou des assiettes creuses. Disposez dans des récipients différents les émincés de porc à la mexicaine, les tranches d'avocat, les pickles d'oignon, la tomate, le {yaourt_a_la_grecque}, le reste du {cheddar_rape} et le persil. Servez les récipients à table et composez vos burrito bowls."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":1088},{"id":"R007","nom":"Chili con carne","sous_titre":null,"source":"Recette (fiche livre de cuisine)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":30,"cuisson_min":45,"total_min":75},"ustensiles":["Cocotte","Mortier et pilon","Casserole (pour la cuisson du riz)","Plat de service"],"conservation_note":null,"allergenes_note":"Aucun allergène majeur signalé par la source d'origine (pas de tableau d'allergènes sur cette fiche). Vigilance recommandée sur la bière (gluten) et la crème fraîche (lait).","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne, voire meilleure après 1-2 jours de repos, jusqu'à 3-4 jours","justification":"Plat mijoté classique (chili) qui se bonifie en reposant. Riz complet à réchauffer simplement avec un peu d'eau si besoin."},"ingredients":[{"nom":"Riz complet","quantite_par_portion":65,"unite":"g (cru)","placeholder":"riz_complet"},{"nom":"Viande de bœuf hachée","quantite_par_portion":150,"unite":"g"},{"nom":"Haricots rouges cuits","quantite_par_portion":50,"unite":"g","placeholder":"haricots_rouges_cuits"},{"nom":"Maïs (boîte égouttée)","quantite_par_portion":71.25,"unite":"g"},{"nom":"Tomates concassées","quantite_par_portion":100,"unite":"g"},{"nom":"Oignon","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Piment jalapeño vert","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Bière blonde","quantite_par_portion":3.75,"unite":"cl"},{"nom":"Vinaigre de cidre","quantite_par_portion":0.25,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Cumin en poudre","quantite_par_portion":0.25,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Paprika","quantite_par_portion":0.5,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Concentré de tomate","quantite_par_portion":0.5,"unite":"cs"},{"nom":"Origan","quantite_par_portion":null,"unite":"quelques brins, non quantifié"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"non quantifié","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"},{"nom":"Avocat","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Citron vert","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Coriandre fraîche","quantite_par_portion":null,"unite":"quelques feuilles, non quantifié"},{"nom":"Crème fraîche","quantite_par_portion":1,"unite":"cs"},{"nom":"Chips tortillas","quantite_par_portion":null,"unite":"non quantifié"}],"instructions":[{"titre":"Étape 1 — Préparation des aromates","contenu":"Épluche l'oignon et l'ail. Cisèle l'oignon. Hache l'ail. Coupe le piment en deux, épépine-le, puis taille-le en tout petits dés."},{"titre":"Étape 2 — Base du chili","contenu":"Dans une cocotte, verse de l'huile d'olive, ajoute l'oignon et l'ail, laisse suer sans coloration, déglace à la bière. Intègre la viande, laisse cuire jusqu'à ce que l'eau naturelle s'évapore, puis verse le vinaigre, les épices, les tomates concassées et le concentré. Sale, poivre, mélange le tout et laisse cuire 10 minutes, à couvert sur feu doux."},{"titre":"Étape 3 — Mijotage","contenu":"Intègre dans la cocotte les {haricots_rouges_cuits}, la moitié du piment haché, le maïs et les brins d'origan, en gardant quelques feuilles pour la déco du plat. Mélange et laisse cuire à couvert 20 minutes sur feu moyen. Fais attention à ce que le mijoté soit toujours assez mouillé, ajoute un peu d'eau s'il sèche et mélange régulièrement."},{"titre":"Étape 4 — Guacamole et accompagnements","contenu":"Épluche les avocats et taille la chair en morceaux, dépose-la dans un mortier et écrase-la au pilon avec des feuilles de coriandre, du jus de citron vert, un peu de sel, 1 cuillerée à soupe de crème fraîche et le reste du piment jalapeño. Transfère ce mélange dans un bol et mets-le sur la table. Sers également des tortillas, des quartiers de citron vert et un bol de crème fraîche."},{"titre":"Cuisson du riz complet (ajout)","contenu":"Pendant le mijotage du chili (étapes 2 et 3), rincez {riz_complet}. Faites-le cuire dans un grand volume d'eau salée, selon les indications de l'emballage (généralement 25-35 min), jusqu'à ce qu'il soit tendre. Égouttez."},{"titre":"Étape 5 — Service","contenu":"Vérifie l'assaisonnement du chili et verse-le dans un plat de service, décore de feuilles de coriandre et d'origan frais. Dépose le plat au milieu de la table et déguste bien chaud avec les accompagnements, ainsi que le riz complet."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R008","nom":"Chorba tunisienne, langues d'oiseau et figues","sous_titre":null,"source":"Recette (fiche livre de cuisine, p.148)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["fin_ete","debut_automne"],"temps":{"preparation_min":20,"cuisson_min":50,"total_min":70},"ustensiles":["Sauteuse","Casserole d'eau bouillante (pour les langues d'oiseau)"],"conservation_note":"Les figues fraîches ne doivent jamais être préparées à l'avance ni réchauffées : elles perdraient leur texture et leur fraîcheur. Si le plat est reconsommé sur plusieurs repas (typage A/E/F), ne couper et disposer les quartiers de figue fraîche qu'au moment de chaque service.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre, gluten via les pâtes). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Découpe de quartiers de figue fraîche à ajouter à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour la soupe et les pâtes, sous réserve d'ajouter les figues fraîches à chaque service","justification":"Les figues fraîches ne doivent jamais être préparées à l'avance ni réchauffées (voir conservation_note) ; le reste du plat se réchauffe simplement."},"ingredients":[{"nom":"Carotte","quantite_par_portion":25,"unite":"g","placeholder":"carotte"},{"nom":"Pâtes langue d'oiseau ou risoni","quantite_par_portion":65,"unite":"g (crues)","placeholder":"pates_langue_oiseau"},{"nom":"Bœuf haché","quantite_par_portion":83.33,"unite":"g"},{"nom":"Pois chiche en boîte","quantite_par_portion":83.33,"unite":"g (net)"},{"nom":"Oignon","quantite_par_portion":0.33,"unite":"pièce(s)"},{"nom":"Tomate","quantite_par_portion":0.33,"unite":"pièce(s)"},{"nom":"Céleri","quantite_par_portion":0.33,"unite":"branche(s)"},{"nom":"Ail","quantite_par_portion":1,"unite":"gousse(s)"},{"nom":"Coriandre","quantite_par_portion":0.17,"unite":"botte(s)","placeholder":"coriandre"},{"nom":"Concentré de tomates","quantite_par_portion":6.67,"unite":"g"},{"nom":"Harissa","quantite_par_portion":0.67,"unite":"g"},{"nom":"Carvi ou cumin","quantite_par_portion":0.17,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Curcuma (chorba)","quantite_par_portion":0.17,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Bouillon de volaille","quantite_par_portion":0.33,"unite":"L","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":1.33,"unite":"cl","categorie":"à ajouter soi-même"},{"nom":"Sel & poivre","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"},{"nom":"Curcuma (langues d'oiseau)","quantite_par_portion":0.17,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Curry de Madras","quantite_par_portion":0.17,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Beurre","quantite_par_portion":16.67,"unite":"g","placeholder":"beurre"},{"nom":"Persil plat","quantite_par_portion":0.083,"unite":"botte(s)"},{"nom":"Figue","quantite_par_portion":1,"unite":"pièce(s)"},{"nom":"Citron (jus)","quantite_par_portion":0.17,"unite":"pièce(s)"}],"instructions":[{"titre":"Étape 1 — Pour la chorba","contenu":"Former des boulettes de viande hachée. Dans une sauteuse, faire colorer les boulettes de bœuf pendant 5 minutes dans l'huile chaude. Ajouter les oignons pelés et émincés et continuer la cuisson pendant 5 minutes. Ajouter la {carotte} coupée en petits dés et poursuivre la cuisson 3-4 minutes avec les oignons. Ajouter les tomates et le céleri en morceaux, l'ail haché et une partie de la {coriandre} ciselée. Verser le concentré de tomates et la harissa et continuer la cuisson pendant 3 minutes pour enlever l'acidité. Ajouter toutes les épices et bien mélanger. Verser 2 litres de bouillon de volaille, fermer la sauteuse et laisser cuire à feu moyen pendant 30 minutes. Ajouter les pois chiches et laisser cuire 15 minutes."},{"titre":"Étape 2 — Pour les langues d'oiseau","contenu":"Dans une casserole d'eau bouillante, faire cuire les {pates_langue_oiseau} selon les indications du paquet. Les égoutter. Dans une sauteuse, faire fondre la moitié du {beurre}, ajouter les épices puis verser les pâtes en remuant sans cesse. Ajouter le reste du beurre, le sel et le persil plat ciselé."},{"titre":"Étape 3 — Pour le service","contenu":"Au moment de servir, ajouter un bon filet de jus de citron et le reste de coriandre ciselée sur la chorba. Disposer les figues fraîches coupées en quartiers sur les pâtes."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R009","nom":"Conchigliones gratinés, tomate & parmesan","sous_titre":null,"source":"Recette (fiche livre de cuisine, Norbert Tarayre, p.100 ; sauces annexes p.252 et p.245 reconstruites d'après des méthodes établies, pages originales non disponibles)","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":25,"cuisson_min":40,"total_min":65},"ustensiles":["Casserole (sauce tomate)","Casserole d'eau bouillante salée (conchigliones)","Casserole (sauce parmesan)","Plat à gratin","Four"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le parmesan et la crème liquide, gluten via les conchigliones). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne jusqu'à 3 jours","justification":"Gratin de pâtes farcies, se réchauffe bien au four ou au micro-ondes. Les courgettes rôties en accompagnement se réchauffent également sans souci particulier."},"ingredients":[{"nom":"Lentilles corail","quantite_par_portion":65,"unite":"g (crues)","placeholder":"lentilles_corail"},{"nom":"Conchigliones ou pâtes à farcir","quantite_par_portion":50,"unite":"g (crues)"},{"nom":"Concassée de tomates (boîte)","quantite_par_portion":400,"unite":"g"},{"nom":"Oignon","quantite_par_portion":1,"unite":"pièce(s)"},{"nom":"Échalote","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Ail (sauce tomate)","quantite_par_portion":0.5,"unite":"gousse(s)"},{"nom":"Huile d'olive","quantite_par_portion":5,"unite":"cl","categorie":"à ajouter soi-même"},{"nom":"Thym ou origan sec","quantite_par_portion":2,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Sucre","quantite_par_portion":2.5,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Sel (sauce tomate)","quantite_par_portion":4,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Poivre (sauce tomate)","quantite_par_portion":2,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Parmesan râpé (sauce)","quantite_par_portion":50,"unite":"g"},{"nom":"Crème liquide","quantite_par_portion":20,"unite":"cl"},{"nom":"Ail (sauce parmesan)","quantite_par_portion":0.5,"unite":"gousse(s)"},{"nom":"Poivre (sauce parmesan)","quantite_par_portion":2.5,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Courgette","quantite_par_portion":150,"unite":"g","placeholder":"courgette"},{"nom":"Parmesan râpé (finition)","quantite_par_portion":25,"unite":"g"}],"instructions":[{"titre":"Étape 1 — Pour la sauce tomate (et lentilles corail)","contenu":"Émincer finement l'oignon et l'échalote, hacher l'ail. Dans une casserole, faire chauffer l'huile d'olive et faire suer l'oignon et l'échalote 5-7 minutes à feu doux, jusqu'à ce qu'ils soient fondants et translucides, sans coloration. Ajouter l'ail et poursuivre 1 minute. Verser la concassée de tomates, le thym ou l'origan, le sucre, le sel et le poivre. Rincez soigneusement les {lentilles_corail} sous l'eau froide jusqu'à ce que l'eau reste claire, puis ajoutez-les dans la sauce. Laisser mijoter à couvert à feu doux pendant 12-15 minutes en remuant régulièrement : les lentilles corail cuisent très rapidement et n'ont pas besoin de trempage, mais elles peuvent attacher au fond si le feu est trop vif ou si le mélange manque de liquide — surveillez la texture et ajoutez un peu d'eau chaude si la sauce épaissit trop vite avant que les lentilles ne soient tendres. Elles sont prêtes lorsqu'elles se défont facilement à la fourchette et se fondent dans la sauce. Ne prolongez pas la cuisson au-delà de 15-18 minutes au total : au-delà, elles partent complètement en purée et la sauce devient trop épaisse et pâteuse."},{"titre":"Étape 2 — Pour les conchigliones","contenu":"Porter à ébullition une casserole d'eau salée et faire cuire les pâtes en suivant les indications du paquet. Enlever 2 minutes plus tôt pour que la cuisson soit al dente. Égoutter et passer sous l'eau froide pour arrêter la cuisson. Remplir les pâtes de sauce tomate (aux lentilles corail) et les ranger dans un plat à gratin."},{"titre":"Étape 3 — Pour la sauce parmesan","contenu":"Dans une casserole, faire chauffer la crème liquide à feu doux avec la gousse d'ail écrasée. Laisser infuser quelques minutes sans bouillir. Retirer l'ail, ajouter le parmesan râpé progressivement en fouettant jusqu'à ce qu'il soit complètement fondu et la sauce lisse. Poivrer."},{"titre":"Courgettes rôties à l'ail et au parmesan (ajout)","contenu":"Coupez la {courgette} en rondelles ou demi-rondelles d'environ 1cm d'épaisseur. Disposez-les sur une grille ou une plaque recouverte de papier cuisson, salez légèrement et laissez reposer 15 minutes, puis épongez l'eau rendue avec du papier absorbant. Préchauffez le four à 220°C (chaleur tournante). Disposez les courgettes en une seule couche, arrosez-les d'un filet d'huile d'olive, parsemez d'ail émincé et d'une pincée d'origan. Enfournez 20-25 minutes, en retournant à mi-cuisson, jusqu'à ce qu'elles soient dorées et légèrement caramélisées sur les bords. En fin de cuisson, parsemez de quelques copeaux ou d'un peu de parmesan râpé."},{"titre":"Étape 4 — Pour le service","contenu":"Verser la sauce parmesan sur les pâtes. Parsemer de parmesan râpé, et gratiner au four quelques minutes. Servir accompagné des courgettes rôties."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R010","nom":"Coquillettes ultra-généreuses au jambon","sous_titre":null,"source":"Recette (fiche livre de cuisine, Norbert Tarayre, p.99 ; sauces annexes p.247 et p.249 reconstruites d'après des méthodes établies, pages originales non disponibles)","typage_generique":["A","B","C","E","F"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":10,"cuisson_min":20,"total_min":35},"ustensiles":["Grande casserole (coquillettes)","Casserole (beurre monté)","Casserole (béchamel)","Casserole (petits pois)","Plat filmable","Assiettes creuses ou plat à gratin","Four (mode gril ou 200°C)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre, le lait et le comté, gluten via la farine et les coquillettes). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne jusqu'à 2-3 jours (les pâtes peuvent légèrement sécher au réchauffage, à arroser d'un peu de lait si besoin)","justification":"Recette rapide en tout état de cause (10 min prép + 20 min cuisson), compatible aussi bien avec un créneau confortable qu'un créneau rapide selon le typage large (A/B/C/E/F). Gratin de pâtes/béchamel/jambon se réchauffe simplement."},"ingredients":[{"nom":"Petits pois surgelés","quantite_par_portion":150,"unite":"g (poids surgelé, avant cuisson)","placeholder":"petits_pois_surgeles"},{"nom":"Jambon blanc coupé en gros cubes","quantite_par_portion":40,"unite":"g"},{"nom":"Comté (béchamel)","quantite_par_portion":20,"unite":"g"},{"nom":"Comté (finition)","quantite_par_portion":30,"unite":"g"},{"nom":"Coquillettes","quantite_par_portion":80,"unite":"g"},{"nom":"Beurre (beurre monté)","quantite_par_portion":31.25,"unite":"g"},{"nom":"Sel (beurre monté)","quantite_par_portion":1,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Lait","quantite_par_portion":15,"unite":"cl"},{"nom":"Beurre (béchamel)","quantite_par_portion":15,"unite":"g"},{"nom":"Farine","quantite_par_portion":15,"unite":"g"},{"nom":"Muscade râpée","quantite_par_portion":0.75,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Poivre du moulin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Pour les coquillettes","contenu":"Faire cuire les coquillettes dans 2 litres d'eau bouillante salée et bien remuer. Arrêter la cuisson 1 minute avant le temps de cuisson indiqué sur le paquet. Égoutter, rincer à l'eau froide puis réserver."},{"titre":"Étape 2 — Pour la sauce (beurre monté)","contenu":"Faites chauffer une petite quantité d'eau à frémissement. Hors du feu, incorporez le beurre froid coupé en petits morceaux, en fouettant énergiquement jusqu'à obtenir une émulsion lisse et brillante. Salez."},{"titre":"Étape 3 — Pour la béchamel","contenu":"Faites fondre le beurre dans une casserole. Ajoutez la farine d'un coup et mélangez pour former un roux, laissez cuire 1-2 minutes sans coloration. Versez le lait progressivement en fouettant pour éviter les grumeaux. Laissez épaissir à feu doux 5-8 minutes en remuant régulièrement. Assaisonnez avec la muscade. Versez le comté et mélangez de nouveau. Débarrassez dans un plat et filmez au contact."},{"titre":"Cuisson des petits pois (ajout)","contenu":"Faites cuire les {petits_pois_surgeles} à l'eau bouillante salée pendant 2-3 minutes (ou 5 minutes à la vapeur), jusqu'à ce qu'ils soient tendres. Égouttez immédiatement pour éviter qu'ils ne rendent trop d'eau."},{"titre":"Étape 4 — Pour le service","contenu":"Réchauffer les coquillettes dans le beurre monté. Ajoutez les petits pois cuits aux coquillettes en même temps que la béchamel, et bien mélanger. Servir les coquillettes dans des assiettes creuses, recouvrir de béchamel, parsemer de comté et de cubes de jambon, poivrer et faire gratiner au four (en mode gril ou à 200°C) pendant 5 minutes."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R011","nom":"Croque-monsieur croustillant à la poêle","sous_titre":null,"source":"Recette (fiche livre de cuisine)","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":10,"cuisson_min":6,"total_min":16},"ustensiles":["Robot ou bol mixeur","Pinceau de cuisine","Poêle","Planche à découper"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre, la crème et le comté, gluten via le pain de mie, œuf). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Le croustillant du pain se perd rapidement et ne se retrouve pas bien au réchauffage ; la salade verte ne se conserve pas. Recette conçue pour une consommation immédiate (typage B/C)."},"ingredients":[{"nom":"Salade verte","quantite_par_portion":50,"unite":"g","placeholder":"salade_verte"},{"nom":"Vinaigrette (huile d'olive, vinaigre, sel, poivre)","quantite_par_portion":null,"unite":"selon goût, non quantifié","categorie":"à ajouter soi-même"},{"nom":"Tranches de pain de mie complet","quantite_par_portion":4,"unite":"pièce(s)"},{"nom":"Comté râpé","quantite_par_portion":50,"unite":"g"},{"nom":"Jambon blanc","quantite_par_portion":1,"unite":"tranche(s)"},{"nom":"Ciboulette","quantite_par_portion":0.25,"unite":"botte(s)"},{"nom":"Beurre","quantite_par_portion":25,"unite":"g"},{"nom":"Œuf","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Crème liquide entière","quantite_par_portion":2.5,"unite":"cl"},{"nom":"Muscade ou cumin en poudre","quantite_par_portion":null,"unite":"non quantifié","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Préparation","contenu":"Coupe des tranches de pain de mie complet si ce n'est pas taillé. Cisèle la ciboulette. Garde-la de côté. Fais fondre le beurre."},{"titre":"Étape 2 — Pâte au fromage","contenu":"Dans un robot ou le bol d'un mixeur, mixe le comté râpé, l'œuf et la crème, assaisonne avec du sel, du poivre et parfume de muscade ou de cumin. Il faut que la pâte soit un peu lisse."},{"titre":"Étape 3 — Montage","contenu":"Nappe les tranches de pain de mie avec ce mélange, dépose le jambon blanc sur 8 tranches, referme avec les 8 autres tranches. Coupe les bords. Badigeonne de beurre fondu à l'aide d'un pinceau les deux côtés des tranches de pain."},{"titre":"Préparation de la salade (ajout)","contenu":"Lavez et essorez la {salade_verte}. Assaisonnez d'une vinaigrette simple (huile d'olive, vinaigre, sel, poivre) juste avant de servir."},{"titre":"Étape 4 — Cuisson et service","contenu":"Dans une poêle, verse un peu de beurre fondu qui reste, mets les croques et fais-les dorer sur les deux faces. Place-les sur une planche, taille-les en deux au couteau, dépose-les sur les assiettes à cheval et parsème de ciboulette ciselée. Servez les croques accompagnés de la salade verte assaisonnée."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R012","nom":"Croque-nono gratiné au cheddar","sous_titre":null,"source":"Recette (fiche livre de cuisine, p.44 ; sauce Béchamel p.249 reconstruite d'après une méthode établie, page originale non disponible)","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["toute_saison"],"temps":{"preparation_min":20,"cuisson_min":10,"total_min":30},"ustensiles":["Casserole (béchamel)","Plat filmable","Poêle (oignons)","Four","Grill (optionnel, pour finition)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via le beurre, le lait et le cheddar, gluten via le pain de mie et la farine). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"faible / non recommandée au-delà du jour de préparation","justification":"Même profil que R011 : croustillant du pain non restituable au réchauffage, salade verte à consommer fraîche. Recette conçue pour une consommation immédiate (typage B/C)."},"ingredients":[{"nom":"Salade verte","quantite_par_portion":50,"unite":"g","placeholder":"salade_verte"},{"nom":"Vinaigrette (huile d'olive, vinaigre, sel, poivre)","quantite_par_portion":null,"unite":"selon goût, non quantifié","categorie":"à ajouter soi-même"},{"nom":"Pain de mie complet","quantite_par_portion":2,"unite":"tranche(s)"},{"nom":"Jambon blanc","quantite_par_portion":2,"unite":"tranche(s)"},{"nom":"Beurre (croque-monsieur)","quantite_par_portion":31.25,"unite":"g"},{"nom":"Oignon rouge","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Cheddar râpé (croque-monsieur)","quantite_par_portion":25,"unite":"g"},{"nom":"Piment d'Espelette","quantite_par_portion":1,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Lait (béchamel)","quantite_par_portion":12.5,"unite":"cl"},{"nom":"Beurre (béchamel)","quantite_par_portion":15,"unite":"g"},{"nom":"Farine","quantite_par_portion":15,"unite":"g"},{"nom":"Cheddar orange râpé (béchamel)","quantite_par_portion":31.25,"unite":"g"},{"nom":"Sel (béchamel)","quantite_par_portion":0.75,"unite":"g","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Pour la béchamel","contenu":"Faites fondre le beurre dans une casserole. Ajoutez la farine d'un coup et mélangez pour former un roux, laissez cuire 1-2 minutes sans coloration. Versez le lait progressivement en fouettant pour éviter les grumeaux. Laissez épaissir à feu doux jusqu'à ébullition, en remuant régulièrement. Lorsque la sauce bout, arrêtez le feu, ajoutez le cheddar râpé, salez et mélangez. Versez dans un plat, filmez au contact et placez au frais."},{"titre":"Étape 2 — Pour les croque-monsieur","contenu":"Préchauffez le four à 200°C. Pelez et émincez les oignons, faites-les revenir quelques minutes dans une poêle à feu moyen. Étalez le beurre sur chaque tranche de pain de mie complet, puis saupoudrez de piment d'Espelette. Répartissez le jambon, ajoutez 1 cuillerée à soupe de béchamel au cheddar et refermez avec 1 tranche de pain de mie complet. Nappez de béchamel au cheddar, ajoutez les oignons puis saupoudrez de cheddar râpé. Enfournez 5 à 10 minutes."},{"titre":"Préparation de la salade (ajout)","contenu":"Lavez et essorez la {salade_verte}. Assaisonnez d'une vinaigrette simple (huile d'olive, vinaigre, sel, poivre) juste avant de servir."},{"titre":"Service","contenu":"Servez les croque-monsieur bien chauds, accompagnés de la salade verte assaisonnée.","astuce_chef":"C'est encore mieux de faire chauffer le croque dans un four puis de finir sous le gril ! La béchamel est fondante et le croque bien gratiné !"}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R013","nom":"Cuciniello foggiano : mijoté de légumes","sous_titre":"avec de la ricotta, des pois chiches & de la crème de basilic","source":"HelloFresh (recette originale \"Veggie\", œufs remplacés par des pois chiches)","typage_generique":["B","C"],"vegetarien":true,"saisonnalite":["ete"],"temps":{"preparation_min":25,"cuisson_min":null,"total_min":40},"ustensiles":["Wok ou sauteuse avec couvercle","Grille (pour le pain)","Four ou grille-pain"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la ricotta et la crème de basilic, gluten via le pain). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Le pain de campagne (ou complet) doit être regrillé frais et refrotté à l'ail à chaque service (quelques minutes au grille-pain).","qualite_conservation_2_a_4_jours":"moyenne : le mijoté de légumes et pois chiches se garde bien 2-3 jours, mais le pain doit être regrillé frais à chaque fois","justification":"Le mijoté lui-même se réchauffe simplement, mais la tartine grillée perd tout son intérêt si elle n'est pas refaite fraîche."},"ingredients":[{"nom":"Pois chiches cuits (en boîte, égouttés)","quantite_par_portion":65,"unite":"g","placeholder":"pois_chiches_cuits"},{"nom":"Pain de campagne tranché (ou pain complet)","quantite_par_portion":2,"unite":"tranche(s)"},{"nom":"Aubergine","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Poivron","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Chair de tomates","quantite_par_portion":0.5,"unite":"paquet(s)"},{"nom":"Ricotta","quantite_par_portion":0.375,"unite":"pot(s)"},{"nom":"Gousse d'ail","quantite_par_portion":0.5,"unite":"pièce(s)"},{"nom":"Épices italiennes","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"epices_italiennes"},{"nom":"Crème de basilic","quantite_par_portion":0.5,"unite":"pot(s)"},{"nom":"Huile d'olive","quantite_par_portion":0.5,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Eau (cuisson finale)","quantite_par_portion":30,"unite":"ml","placeholder":"eau_cuisson_finale","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Légumes à la chaîne","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Ciselez la moitié de l'ail (garder le reste pour l'étape des tartines). Coupez l'aubergine en dés de 5 mm. Épépinez et coupez les poivrons en dés de 5 mm."},{"titre":"Ça chauffe !","contenu":"Faites chauffer un filet d'huile d'olive dans un wok ou une sauteuse et faites-y revenir l'ail ciselé et les poivrons 5-6 min à feu moyen-vif. Ajoutez-y l'aubergine, salez et poivrez, et {epices_italiennes} (ça pique ! Dosez-les selon votre goût). Remuez et prolongez la cuisson de 10-12 min à couvert, ou jusqu'à ce que les aubergines deviennent fondantes. Versez un filet d'eau si nécessaire. Une fois les légumes confits, ajoutez la chair de tomate."},{"titre":"Patience... ça cuit","contenu":"Si vous n'avez pas de grille-pain, préchauffez le four à 210°C (190°C chaleur tournante). Versez {eau_cuisson_finale} et portez à ébullition tout en remuant, puis laissez mijoter 2-3 min à couvert à feu moyen-vif. Salez et poivrez."},{"titre":"Pois chiches et ricotta","contenu":"Incorporez les {pois_chiches_cuits} directement dans le mijoté de légumes. Laissez mijoter à couvert 5-8 minutes supplémentaires, le temps qu'ils s'imprègnent des saveurs de la sauce tomate et des épices italiennes. Répartissez la ricotta sur le dessus juste avant de servir."},{"titre":"On en perd pas une miette","contenu":"Pendant ce temps, placez les tranches de pain de campagne (ou pain complet) sur une grille. Frottez l'ail restant sur le pain. Enfournez-les environ 5 min, ou jusqu'à ce qu'elles soient dorées.","astuce_chef":"Pour gagner du temps, toastez le pain au grille-pain et frottez la gousse d'ail une fois le pain grillé."},{"titre":"Régal assuré","contenu":"Garnissez avec la crème de basilic sur le dessus, et servez le cuciniello foggiano dans des assiettes creuses. Présentez les tartines à l'ail en accompagnement."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":629},{"id":"R014","nom":"Curry coco de volaille, pomme verte","sous_titre":null,"source":"Recette (fiche livre de cuisine)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":40,"cuisson_min":60,"total_min":100},"ustensiles":["Large sauteuse","Passette fine","Saladier (eau froide pour les pommes de terre)","Poêle","Saladier (eau glacée pour le brocoli)"],"conservation_note":"Les bâtonnets de pomme verte doivent être taillés et disposés fraîchement au moment de chaque service, jamais préparés à l'avance ni réchauffés : ils s'oxyderaient et perdraient leur croquant. Si le plat est reconsommé sur plusieurs repas (typage A/E/F), ne préparer les bâtonnets qu'au moment de servir.","allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la crème liquide). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Bâtonnets de pomme verte à tailler fraîchement à chaque service (pas de cuisson nécessaire).","qualite_conservation_2_a_4_jours":"bonne pour le curry et les pommes de terre, sous réserve de tailler la pomme verte fraîchement à chaque service","justification":"La pomme verte s'oxyderait et perdrait son croquant si préparée à l'avance (voir conservation_note) ; le curry lui-même se réchauffe simplement."},"ingredients":[{"nom":"Brocoli","quantite_par_portion":150,"unite":"g","placeholder":"brocoli"},{"nom":"Blancs de volaille sans peau","quantite_par_portion":1,"unite":"pièce(s)"},{"nom":"Pommes de terre","quantite_par_portion":0.5,"unite":"pièce(s) (grosses)"},{"nom":"Oignon blanc","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Citronnelle","quantite_par_portion":0.25,"unite":"tige(s)"},{"nom":"Gingembre frais","quantite_par_portion":6.25,"unite":"g"},{"nom":"Gousse d'ail","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Curry Madras en poudre","quantite_par_portion":5,"unite":"g","categorie":"à ajouter soi-même"},{"nom":"Lait de coco","quantite_par_portion":7.5,"unite":"cl"},{"nom":"Crème liquide entière","quantite_par_portion":12.5,"unite":"cl"},{"nom":"Pomme verte","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Piment d'Espelette","quantite_par_portion":null,"unite":"non quantifié","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":null,"unite":"trait, non quantifié","categorie":"à ajouter soi-même"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Base de la sauce curry","contenu":"Épluche l'oignon blanc, la citronnelle, le gingembre et la gousse d'ail, émince le tout finement et réserve séparément. Fais chauffer une large sauteuse avec un trait d'huile d'olive. Fais revenir l'oignon sans coloration, ajoute le gingembre et la citronnelle, fais cuire pendant 10 minutes. Ajoute le curry, laisse infuser quelques minutes en continuant à cuire doucement sans coloration, puis verse le lait de coco et la crème. Porte à ébullition 5 minutes, puis laisse cuire 20 minutes à petit frémissement (mets un peu d'eau si nécessaire). Au terme de la cuisson, passe la sauce dans une grande sauteuse à l'aide d'une passette fine."},{"titre":"Étape 2 — Pommes de terre","contenu":"Lave, épluche et coupe les pommes de terre en petits morceaux. Passe-les dans un saladier d'eau froide, égoutte-les et plonge-les dans la sauce, laisse cuire 10 minutes à feu doux."},{"titre":"Étape 3 — Volaille","contenu":"Coupe en morceaux les blancs de volaille et assaisonne-les. Fais chauffer une poêle avec un trait d'huile, puis colore-les sur toutes les faces sans les cuire. Égoutte les morceaux de viande, puis plonge-les dans la sauce curry. Laisse cuire 8 minutes à petit feu."},{"titre":"Pointes de brocoli (ajout)","contenu":"Détaillez le {brocoli} en petites pointes (fleurettes). Faites-les blanchir 3-4 minutes à l'eau bouillante salée, puis égouttez-les immédiatement et plongez-les dans de l'eau glacée pour stopper la cuisson et conserver leur couleur vive. Ajoutez-les dans la sauce curry avec la volaille pour les 3-4 dernières minutes de cuisson (étape 3), juste le temps de les réchauffer et de les enrober de sauce sans les ramollir davantage."},{"titre":"Étape 4 — Bâtonnets de pomme verte","contenu":"Taille des bâtonnets de pomme verte de longueur régulière en gardant de la peau."},{"titre":"Étape 5 — Service","contenu":"Dépose les morceaux de volaille au centre du plat avec les pommes de terre et la sauce. Répartissez également les pointes de brocoli dans le plat, aux côtés de la volaille et des pommes de terre. Décore de bâtonnets de pomme verte, parsème d'un peu de piment d'Espelette."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R015","nom":"Dahl de lentilles corail","sous_titre":null,"source":"Recette de collectivité (fiche \"100 repas\")","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":null,"cuisson_min":10,"total_min":null},"us contenu":"Faire cuire le {riz_basmati}."},{"titre":"Service","contenu":"Servir les pois cassés (avec les carottes), le riz et la sauce yaourt ({yaourt_sauce} mélangé à {eau_sauce_yaourt})."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R017","nom":"Falafels, crème verte au tahini","sous_titre":null,"source":"Recette (fiche livre de cuisine, p.19)","typage_generique":["E","F"],"vegetarien":true,"saisonnalite":["toute_saison"],"temps":{"preparation_min":12,"cuisson_min":20,"total_min":null},"ustensiles":["Robot ou bol mixeur (falafels)","Petit mixeur (sauce tahini)","Bain de friture","Papier absorbant","Saladier (salade de crudités)"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment sésame via le tahini). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":false,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Falafels à repasser quelques minutes au four pour retrouver un peu de croustillant ; salade de crudités méditerranéenne à préparer fraîche ou à ressortir juste avant de servir.","qualite_conservation_2_a_4_jours":"moyenne : les falafels perdent en croustillant au réchauffage, la sauce tahini et la salade se gardent bien séparément 2-3 jours","justification":"Recette nécessitant une anticipation importante (12h de trempage) pour la préparation initiale. Falafels moins satisfaisants réchauffés que fraîchement frits, mais restent consommables."},"ingredients":[{"nom":"Tomate","quantite_par_portion":100,"unite":"g","placeholder":"tomate"},{"nom":"Concombre","quantite_par_portion":50,"unite":"g","placeholder":"concombre"},{"nom":"Oignon rouge","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon_rouge"},{"nom":"Citron jaune (salade)","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"citron_jaune_salade"},{"nom":"Pois chiches secs","quantite_par_portion":87.5,"unite":"g"},{"nom":"Fèves sèches","quantite_par_portion":37.5,"unite":"g"},{"nom":"Oignon (falafels)","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Gousses d'ail (falafels)","quantite_par_portion":0.75,"unite":"pièce(s)"},{"nom":"Cumin en poudre","quantite_par_portion":0.25,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Cardamome en poudre","quantite_par_portion":0.25,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Persil","quantite_par_portion":0.25,"unite":"botte(s)"},{"nom":"Coriandre (falafels)","quantite_par_portion":0.125,"unite":"botte(s)"},{"nom":"Bicarbonate de soude","quantite_par_portion":0.25,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Huile de friture","quantite_par_portion":null,"unite":"non quantifié","categorie":"à ajouter soi-même"},{"nom":"Sel fin","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"},{"nom":"Tahini (pâte de sésame)","quantite_par_portion":25,"unite":"g"},{"nom":"Jus de citron jaune (sauce)","quantite_par_portion":1.25,"unite":"cl"},{"nom":"Gousse d'ail (sauce)","quantite_par_portion":0.25,"unite":"pièce(s)"},{"nom":"Coriandre (sauce)","quantite_par_portion":0.0625,"unite":"botte(s)"},{"nom":"Huile d'olive (sauce)","quantite_par_portion":2.25,"unite":"cl","categorie":"à ajouter soi-même"},{"nom":"Eau (sauce, facultatif)","quantite_par_portion":2.25,"unite":"cl","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Trempage (la veille)","contenu":"La veille, fais tremper les pois chiches et les fèves décortiquées dans un bain d'eau et mets-les au frais."},{"titre":"Étape 2 — Préparation des aromates","contenu":"Épluche et coupe en morceaux l'oignon et l'ail dégermé, lave et effeuille le persil et la coriandre pour les falafels et la sauce."},{"titre":"Étape 3 — Pâte à falafels","contenu":"Dans le bol du robot, dépose les pois chiches et les fèves bien égouttés. Ajoute l'oignon, l'ail, les épices, les herbes et le bicarbonate de soude. Mixe pour former une pâte sans trop lisser. Vérifie l'assaisonnement."},{"titre":"Étape 4 — Sauce tahini verte","contenu":"Dans le bol du petit mixeur, verse le tahini, le jus de citron, l'ail, les feuilles de coriandre, l'huile d'olive et ajoute un peu d'eau si nécessaire. Commence à mixer. Forme une sauce verte, verse-la dans un bol."},{"titre":"Salade de crudités méditerranéenne (ajout)","contenu":"Lavez et coupez en petits dés réguliers (5mm environ) la {tomate} et le {concombre}. Émincez très finement l'{oignon_rouge}. Dans un saladier, mélangez les dés de tomate et de concombre avec l'oignon rouge émincé. Ciselez quelques feuilles de persil restant (prélevées sur la botte utilisée pour les falafels) et ajoutez-les à la salade. Assaisonnez avec un filet d'huile d'olive, le jus du {citron_jaune_salade}, du sel fin et du poivre. Mélangez délicatement et réservez au frais jusqu'au service."},{"titre":"Étape 5 — Friture des falafels","contenu":"Confectionne tes falafels à la main ou à l'aide d'une grosse cuillère trempée dans de l'eau pour éviter que ça colle, puis plonge-les dans un bain de friture à 170°C jusqu'à ce qu'ils soient bien dorés, environ 4 à 5 minutes. Égoutte-les sur un papier absorbant."},{"titre":"Étape 6 — Service","contenu":"Sers les falafels avec la sauce verte au tahini et la salade de crudités méditerranéenne."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R018","nom":"Filet mignon de Pâques à la parmesane","sous_titre":"avec un gratin, du brocoli & une sauce crème","source":"HelloFresh","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver","printemps"],"temps":{"preparation_min":30,"cuisson_min":null,"total_min":65},"ustensiles":["Papier d'aluminium","Plaque de cuisson recouverte de papier sulfurisé","Passoire","Râpe","Plat à four","Casserole","Casserole avec couvercle","Éplucheur"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment lait via la crème, le lait et le parmesan, gluten via la chapelure panko, moutarde). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":false,"complement_rapide_description":null,"qualite_conservation_2_a_4_jours":"bonne jusqu'à 3 jours (viande à réchauffer doucement pour éviter qu'elle ne sèche)","justification":"Gratin de pommes de terre et filet mignon tranché se réchauffent bien ensemble, sans élément fragile identifié. Brocoli se réchauffe également sans souci."},"ingredients":[{"nom":"Filet mignon de porc","quantite_par_portion":125,"unite":"g (cru)","placeholder":"filet_mignon_de_porc"},{"nom":"Pommes de terre","quantite_par_portion":150,"unite":"g"},{"nom":"Crème liquide (gratin)","quantite_par_portion":22.5,"unite":"ml","placeholder":"creme_liquide_gratin"},{"nom":"Lait","quantite_par_portion":24,"unite":"ml","placeholder":"lait"},{"nom":"Brocoli","quantite_par_portion":150,"unite":"g","placeholder":"brocoli"},{"nom":"Gousse d'ail","quantite_par_portion":1,"unite":"pièce(s)"},{"nom":"Crème liquide (sauce viande)","quantite_par_portion":null,"unite":"reste du paquet, non quantifié précisément"},{"nom":"Thym séché","quantite_par_portion":0.25,"unite":"sachet(s)","placeholder":"thym_seche","categorie":"à ajouter soi-même"},{"nom":"Parmigiano Reggiano AOP","quantite_par_portion":null,"unite":"non quantifié"},{"nom":"Chapelure panko","quantite_par_portion":0.25,"unite":"sachet(s)"},{"nom":"Beurre","quantite_par_portion":0.75,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive","quantite_par_portion":1,"unite":"cs","categorie":"à ajouter soi-même"},{"nom":"Vinaigre de vin rouge ou de cidre","quantite_par_portion":0.5,"unite":"cs","placeholder":"vinaigre_de_vin_rouge_ou_de_cidre","categorie":"à ajouter soi-même"},{"nom":"Moutarde","quantite_par_portion":1.5,"unite":"cc","categorie":"à ajouter soi-même"},{"nom":"Poivre et sel","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Sortez vos planches !","contenu":"Veillez à bien respecter les quantités indiquées à gauche pour préparer votre recette ! Sortez la viande du réfrigérateur. Épluchez et coupez les pommes de terre en rondelles de 2 mm. Ciselez l'ail.","astuce_chef":"Ne lavez pas les pommes de terre après les avoir coupées car l'amidon qu'elles contiennent permettra d'obtenir une consistance onctueuse."},{"titre":"Marmite en action","contenu":"Dans une marmite ou une grande casserole, versez la {creme_liquide_gratin} et le {lait}. Ajoutez le {thym_seche}, la moitié de l'ail et les pommes de terre, puis portez à ébullition. Salez et poivrez. Couvrez et faites cuire 12-15 min à feu moyen-doux. En attendant, préchauffez le four à 210°C (190°C chaleur tournante). Beurrez un plat à four et répartissez le reste de l'ail au fond du plat."},{"titre":"Au tour du brocoli","contenu":"Portez une casserole d'eau salée à ébullition. Pendant ce temps, coupez le {brocoli} en fleurettes et les tiges en dés. Faites cuire le brocoli 6-8 min dans l'eau bouillante. Égouttez-le et rincez-le à l'eau froide. Réservez-le. Râpez le parmesan."},{"titre":"On enfourne","contenu":"Contrôlez la cuisson des pommes de terre avec la pointe d'un couteau. Lorsqu'elles sont presque cuites, versez-les dans le plat à four avec la crème et le lait (rincez et réservez la marmite pour l'étape suivante). Parsemez de la moitié du parmesan, puis couvrez le plat d'une feuille d'aluminium et enfournez-le environ 25 min.","astuce_chef":"L'aluminium permet de cuire les pommes de terre sans brûler le dessus. Pensez à le retirer à l'étape 6 pour avoir un beau gratin doré."},{"titre":"Quelle cuisson pour la viande ?","contenu":"Faites fondre une noix de beurre à feu moyen-vif dans la marmite des pommes de terre. Lorsqu'il mousse, faites-y dorer le {filet_mignon_de_porc} 2-3 min sur tous les côtés. Couvrez et faites cuire 3-5 min à feu moyen (la viande ne doit pas être totalement cuite à ce stade). Ôtez la viande de la casserole, versez le {vinaigre_de_vin_rouge_ou_de_cidre}, puis le reste de crème et une pointe de moutarde. Laissez réduire 1-2 min à feu moyen pour que la sauce épaississe et réservez à couvert. Mélangez la quantité indiquée de chapelure dans une assiette avec le reste de parmesan, du sel et du poivre."},{"titre":"Tout le monde à table !","contenu":"Badigeonnez la viande de moutarde, puis roulez-la dans la chapelure pour qu'elle en soit recouverte. Placez la viande et le brocoli sur une plaque recouverte de papier sulfurisé avec un filet d'huile d'olive. Salez et poivrez. Lorsqu'il reste 10-15 min de cuisson au gratin, enfournez la plaque dans la partie haute du four. La chapelure doit être dorée. Retirez l'aluminium du plat à gratin. Coupez la viande en tranches, puis servez-la avec la sauce, le brocoli et le gratin."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":936},{"id":"R019","nom":"Galette de pom
