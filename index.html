"},{"nom":"Sel et poivre (vinaigrette carottes)","quantite_par_portion":null,"unite":"selon goût","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Préchauffage","contenu":"Préchauffez le four à 120°C (th. 4)."},{"titre":"Oignons et basilic","contenu":"Hachez les oignons et faites-les revenir à l'huile d'olive jusqu'à ce qu'ils soient légèrement colorés. Émincez au couteau les feuilles de basilic."},{"titre":"Pesto (reconstruction)","contenu":"Faites légèrement torréfier les pignons de pin à sec dans une poêle 2-3 minutes, en remuant constamment, jusqu'à ce qu'ils soient dorés. Laissez refroidir. Dans un mixeur, déposez le basilic effeuillé, l'ail, les pignons torréfiés et le parmesan râpé. Mixez par à-coups en versant l'huile d'olive progressivement, jusqu'à obtenir une texture homogène mais encore légèrement grainée. Salez."},{"titre":"Farce et façonnage des galettes","contenu":"Séparez en deux la quantité de blancs de poulet. Taillez-en la moitié en dés d'environ 1cm et mixez le reste avec la crème, le sel, l'œuf, les feuilles de basilic, le pesto, les oignons et le piment d'Espelette. Ajoutez les dés de poulet et façonnez cette farce en galettes d'environ 10cm de diamètre."},{"titre":"Cuisson des galettes","contenu":"Déposez les galettes sur une plaque huilée et faites-les cuire 12 min au four. Sortez-les du four et faites-les colorer sur les deux faces dans une poêle antiadhésive avec un peu de beurre."},{"titre":"Carottes râpées à la vinaigrette (ajout)","contenu":"Épluchez et râpez les {carottes_rapees}. Dans un bol, fouettez le jus du {citron_vinaigrette_carottes} avec un filet d'huile d'olive, du sel et du poivre. Versez la vinaigrette sur les carottes râpées et mélangez bien. Réservez au frais jusqu'au service."},{"titre":"Montage du burger (ajout)","contenu":"Faites griller le {pain_complet_tranche}, au grille-pain ou à la poêle. Tartinez une tranche du {guacamole}. Déposez la galette de poulet grillée, puis une tranche de {mozzarella} par-dessus. Refermez avec la seconde tranche de pain grillé."},{"titre":"Service","contenu":"Servez le burger de poulet accompagné des carottes râpées à la vinaigrette."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R021","nom":"Gaspacho de tomates pimenté, toast au jambon ibérique","sous_titre":null,"source":"Recette (fiche livre de cuisine, p.64), anchois remplacés par du jambon ibérique","typage_generique":["B","C"],"vegetarien":false,"saisonnalite":["ete"],"temps":{"preparation_min":20,"cuisson_min":null,"total_min":null},"ustensiles":["Blender","Gril à croque-monsieur","Bol","Couteau"],"conservation_note":null,"allergenes_note":"Certains ingrédients peuvent contenir des allergènes (notamment gluten via le pain, lait via le beurre). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Le toast au jambon ibérique doit être regrillé frais à chaque service (quelques minutes au gril à croque-monsieur).","qualite_conservation_2_a_4_jours":"bonne pour le gaspacho (voire meilleur après repos), jusqu'à 3-4 jours ; toast à refaire frais à chaque service","justification":"Le gaspacho se consomme froid et se conserve très bien plusieurs jours ; seul le toast chaud nécessite d'être refait à chaque fois."},"ingredients":[{"nom":"Jambon ibérique (beurre du toast)","quantite_par_portion":20,"unite":"g","placeholder":"jambon_iberique_beurre"},{"no  tout au mixeur, ajoutez le vinaigre, le Tabasco pour relever, le sel et le poivre. Passez au chinois ou dans une passoire fine en pressant bien le mélange avec une cuillère. Réservez au moins 2h au réfrigérateur."},{"titre":"Pastèque grillée","contenu":"Épluchez la pastèque et taillez-la en dés d'environ 2cm. Faites chauffer une poêle avec un peu d'huile d'olive et faites griller les dés de pastèque pendant 1 min."},{"titre":"Crevettes grillées (ajout, portion adulte)","contenu":"Dans la même poêle que la pastèque, faites griller les {crevettes_decortiquees_crues} (portion adultes), juste après celle-ci, pendant 1-2 min, jusqu'à ce qu'elles soient roses et légèrement dorées."},{"titre":"Jambon de poulet en cubes (ajout, portion enfant)","contenu":"Coupez le {jambon_de_poulet} en cubes (portion enfants). Aucune cuisson n'est nécessaire, le jambon étant prêt à consommer."},{"titre":"Montage des brochettes (ajout)","contenu":"Pour les adultes : montez des brochettes en alternant crevettes grillées et dés de pastèque grillée. Pour les enfants : montez des brochettes en alternant cubes de jambon de poulet et dés de pastèque grillée."},{"titre":"Toast (ajout)","contenu":"Faites griller le {pain_complet_toast}, coupé en triangles."},{"titre":"Service","contenu":"Versez le gaspacho dans des verres. Déposez une brochette (crevettes-pastèque pour les adultes, jambon de poulet-pastèque pour les enfants) en travers de chaque verre ou à côté. Accompagnez du toast en triangles. Arrosez le gaspacho d'un peu d'huile d'olive."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R023","nom":"Gnocchi façon caponata & pecorino gratiné","sous_titre":"avec des aubergines, des câpres, du basilic & des pois chiches","source":"HelloFresh","typage_generique":["A","E","F"],"vegetarien":true,"saisonnalite":["ete"],"temps":{"preparation_min":15,"cuisson_min":null,"total_min":45},"ustensiles":["Plat à four"],"conservation_n diquées à gauche pour préparer votre recette ! Préchauffez le four à 180°C (160°C chaleur tournante). Préparez le {bouillon_de_legumes} avec de l'eau chaude. Coupez l'{oignon} en fines demi-lunes. Ciselez l'{gousse_d_ail}."},{"titre":"Faites chauffer les marmites","contenu":"Pendant ce temps, faites chauffer une marmite à feu moyen. Ajoutez-y un filet d'{huile_d_olive}, l'oignon et le {cumin_en_poudre} et le {paprika_fume}. Faites-les dorer 5-8 min. Ajoutez l'ail et poursuivez la cuisson 3-4 min, ou jusqu'à ce qu'ils soient bien dorés."},{"titre":"Ça mijote...","contenu":"En attendant, égouttez les {pois_chiches} et rincez-les, puis égouttez-les de nouveau. Ajoutez la {chair_de_tomates} à la marmite et versez le bouillon par-dessus. Ajoutez les pois chiches et le {sucre}. Portez à ébullition, puis baissez le feu et laissez mijoter 15-20 min à feu moyen-doux et à couvert."},{"titre":"Mixe, mixe, mixe","contenu":"Lorsqu'il reste 5-10 min de cuisson, prélevez l'équivalent de 2 louches de soupe par personne et versez-les dans un récipient à bords hauts (attention à ne pas vous brûler). Mixez avec un mixeur plongeant jusqu'à obtenir une consistance semi-épaisse (il peut rester des morceaux). Remettez la préparation dans la marmite et mélangez.","astuce_chef":"Cette technique permet de donner plus de consistance au leblebi en l'épaississant."},{"titre":"Mélange gourmand","contenu":"Mélangez le {fromage_frais_nature} avec un filet d'huile d'olive, du sel et du poivre dans un bol. Étalez ce mélange sur les {pain_pita}. Enfournez les pitas 4-6 min sur une plaque recouverte de papier sulfurisé, ou jusqu'à ce qu'elles soient un peu dorées. Mélangez le {yaourt_a_la_grecque} avec la {sauce_tahini}, un filet d'huile d'olive, du sel, du poivre et un petit filet d'eau dans un bol. Vous devez obtenir une consistance semi-épaisse."},{"titre":"Poivrons grillés (ajout)","contenu":"Coupez les {poivrons_grilles} en lanières. Faites-les griller au four à 210°C pendant 15-20 min, ou à la p
