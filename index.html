reconstruit)","contenu":"Méthode manuelle : verse la {farine_pate} et le {sel_pate} dans un saladier. Ajoute le {beurre_pate} froid coupé en dés, sable du bout des doigts jusqu'à obtenir une texture sableuse. Creuse un puits, ajoute le {jaune_d_oeuf} et l'{eau_pate} froide, incorpore sans pétrir. Forme une boule, filme et laisse reposer au frais au moins 20 minutes.\n\nMéthode Thermomix TM5 (alternative) : place la farine, le sel et le beurre froid coupé en dés dans le bol, mixe 10 secondes vitesse 6 jusqu'à obtenir une texture sableuse. Ajoute le jaune d'œuf et l'eau froide, mixe quelques secondes en mode pétrin (vitesse épi) jusqu'à ce que la pâte forme une boule. Filme et laisse reposer au frais au moins 20 minutes."},{"titre":"Étape 2 — Fonçage","contenu":"Fonce le moule à tarte avec la pâte brisée et mets au frais pendant 20 minutes."},{"titre":"Lardons (ajout)","contenu":"Fais revenir les {lardons} à sec dans une poêle, jusqu'à ce qu'ils soient bien dorés. Réserve."},{"titre":"Étape 3 — Garniture","contenu":"Lave les {tomate}, retire le pédoncule et coupe-les en tranches assez fines. Mélange la {moutarde_dijon} et la {moutarde_ancienne}. Sors le fond de tarte du frais et badigeonne-le du mélange, puis saupoudre de {farine_saupoudrage}. Parsème les {lardons} dorés sur le fond. Dispose les tomates en rosace, assaisonne à chaque rangée de {sel_poivre} et de {sucre}. Finis avec l'{huile_d_olive} et parsème de {thym}. Mets la tarte au frais pendant au moins 10 minutes. Préchauffe le four à 180°C."},{"titre":"Étape 4 — Cuisson","contenu":"Enfourne pendant 30 minutes, puis baisse la température à 160°C. Parsème de {comte_rape} et poursuis la cuisson encore 20 minutes, jusqu'à ce que le fromage soit gratiné.","astuce_chef":"Une pâte faite maison sera toujours mieux si on la laisse reposer un peu ! Mais si on n'a pas le temps, ça marche quand même !"}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R082","nom":"Tarte briochée au reblochon","sous_titre":"compotée d'oignons, salade de laitue au jambon cru frit et noisettes","source":"Recette (fiche livre de cuisine, p.83, section Tartes)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["hiver"],"temps":{"preparation_min":15,"cuisson_min":25,"total_min":100},"ustensiles":["Robot pâtissier (ou bol de Thermomix TM5)","Plaque de four","Papier sulfurisé","Sauteuse (compotée d'oignons)","Four","Poêle (jambon)","Saladier (salade)","Bol (vinaigrette)"],"conservation_note":"La salade (laitue, jambon frit, noisettes, oignon rouge, vinaigrette) est idéalement assemblée fraîche à chaque service plutôt que préparée d'avance en grande quantité.","allergenes_note":"Contient gluten (farine), œuf (pâte à brioche), lait (beurre, reblochon, crème épaisse), moutarde, fruits à coque (noisettes). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"La tarte se réchauffe bien au four pour retrouver du moelleux. La salade (laitue, jambon frit, noisettes, oignon rouge, vinaigrette) doit en revanche être assemblée fraîche à chaque service.","qualite_conservation_2_a_4_jours":"bonne pour la tarte, faible pour la salade une fois assaisonnée","justification":"Tarte briochée qui se prépare avec un temps confortable (pâte, pousse, cuisson) et se réchauffe très bien, adaptée à une grosse préparation reconsommée sur plusieurs repas de la semaine (typage A/E/F). Seule la salade gagne à être préparée au dernier moment."},"ingredients":[{"nom":"Farine T45 ou T55 (pâte à brioche)","quantite_par_portion":75,"unite":"g","placeholder":"farine_brioche"},{"nom":"Œuf (pâte à brioche)","quantite_par_portion":0.75,"unite":"pièce(s)","placeholder":"oeuf_brioche"},{"nom":"Beurre (pâte à brioche)","quantite_par_portion":41.25,"unite":"g","placeholder":"beurre_brioche"},{"nom":"Sucre (pâte à brioche)","quantite_par_portion":7.5,"unite":"g","placeholder":"sucre_brioche"},{"nom":"Levure boulangère fraîche","quantite_par_portion":2.5,"unite":"g","placeholder":"levure_fraiche"},{"nom":"Sel (pâte à brioche)","quantite_par_portion":1,"unite":"g","placeholder":"sel_brioche"},{"nom":"Reblochon","quantite_par_portion":100,"unite":"g","placeholder":"reblochon"},{"nom":"Crème épaisse","quantite_par_portion":50,"unite":"g","placeholder":"creme_epaisse"},{"nom":"Oignon (garniture)","quantite_par_portion":0.75,"unite":"pièce(s)","placeholder":"oignon_garniture"},{"nom":"Beurre (garniture)","quantite_par_portion":12.5,"unite":"g","placeholder":"beurre_garniture"},{"nom":"Sucre (garniture)","quantite_par_portion":2.5,"unite":"g","placeholder":"sucre_garniture"},{"nom":"Muscade râpée","quantite_par_portion":null,"unite":"1 pincée (pour l'ensemble de la préparation)","placeholder":"muscade"},{"nom":"Sel et poivre (garniture)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_garniture","categorie":"à ajouter soi-même"},{"nom":"Laitue","quantite_par_portion":0.5,"unite":"pièce(s)","placeholder":"laitue"},{"nom":"Jambon cru (tranches)","quantite_par_portion":1.5,"unite":"tranche(s)","placeholder":"jambon_cru"},{"nom":"Persil plat (salade)","quantite_par_portion":0.125,"unite":"botte(s)","placeholder":"persil_salade"},{"nom":"Cerfeuil (salade)","quantite_par_portion":0.125,"unite":"botte(s)","placeholder":"cerfeuil_salade"},{"nom":"Ciboulette (salade)","quantite_par_portion":0.125,"unite":"botte(s)","placeholder":"ciboulette_salade"},{"nom":"Oignon rouge","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"oignon_rouge"},{"nom":"Noisette","quantite_par_portion":15,"unite":"g","placeholder":"noisettes"},{"nom":"Huile neutre","quantite_par_portion":2,"unite":"cl","placeholder":"huile_neutre","categorie":"à ajouter soi-même"},{"nom":"Vinaigre (type xérès, de vin, de cidre)","quantite_par_portion":1.25,"unite":"cl","placeholder":"vinaigre","categorie":"à ajouter soi-même"},{"nom":"Huile d'olive (vinaigrette)","quantite_par_portion":3.75,"unite":"cl","placeholder":"huile_d_olive_vinaigrette","categorie":"à ajouter soi-même"},{"nom":"Moutarde de Dijon (vinaigrette)","quantite_par_portion":2.5,"unite":"g","placeholder":"moutarde_dijon_vinaigrette"},{"nom":"Sel et poivre (vinaigrette)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_vinaigrette","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Pâte à brioche (mode opératoire reconstruit)","contenu":"Méthode manuelle (au robot) : dans le bol, mélange la {farine_brioche}, le {sucre_brioche} et le {sel_brioche}. Ajoute la {levure_fraiche} émiettée (à l'écart du sel), puis les {oeuf_brioche}. Pétris à vitesse lente environ 10 minutes jusqu'à obtenir une pâte élastique. Incorpore le {beurre_brioche} en pommade, progressivement, puis pétris 10 à 15 minutes de plus jusqu'à ce que la pâte soit lisse et se décolle du bol. Forme une boule, couvre et laisse pousser 1 heure à température ambiante. Abaisse la pâte en rectangle et étale-la sur une plaque de four munie de papier sulfurisé. Laisse pousser 30 minutes supplémentaires. Préchauffe le four à 180°C.\n\nMéthode Thermomix TM5 (alternative) : place la farine, le sucre et le sel dans le bol, mixe quelques secondes vitesse 4 pour mélanger. Ajoute la levure fraîche émiettée et les œufs, pétris 3 minutes en mode épi (vitesse pétrin). Ajoute le beurre en morceaux, pétris à nouveau 4 à 5 minutes en mode épi jusqu'à obtenir une pâte lisse et élastique qui se détache des parois. Transfère la pâte dans un saladier, couvre et laisse pousser 1 heure à température ambiante. Poursuis ensuite comme pour la méthode manuelle (abaisse en rectangle, seconde pousse de 30 minutes, préchauffage du four)."},{"titre":"Étape 2 — Compotée d'oignons","contenu":"Épluche et émince l'{oignon_garniture}, mets-le dans une sauteuse avec le {beurre_garniture}, le {sucre_garniture}, le sel et une petite tasse à café d'eau (ne pas faire revenir les oignons, tout doit être mis froid dans la sauteuse). Couvre et cuis sur feu doux pendant 30 minutes, remue sans cesse en fin de cuisson pour faire caraméliser la compotée d'oignons, puis réserve au froid."},{"titre":"Étape 3 — Montage et cuisson","contenu":"Sur la pâte briochée, étale de façon régulière la {creme_epaisse}, parsème de compotée d'oignons et de {muscade}, puis dispose le {reblochon} tranché. Poivre généreusement. Enfourne pendant 25 minutes."},{"titre":"Étape 4 — Salade","contenu":"Lave la {laitue} et rince les herbes fraîches ({persil_salade}, {cerfeuil_salade}, {ciboulette_salade}), puis égoutte-les. Hache les tranches de {jambon_cru}. Fais chauffer l'{huile_neutre} dans une poêle et fais-y frire le jambon haché 5 minutes, puis débarrasse-le sur du papier absorbant. Torréfie les {noisettes} au four à 160°C pendant 10 minutes et concasse-les. Épluche l'{oignon_rouge} et coupe-le en fins quartiers."},{"titre":"Vinaigrette moutardée (mode opératoire reconstruit)","contenu":"Mélange le {vinaigre} et la {moutarde_dijon_vinaigrette}. Verse l'{huile_d_olive_vinaigrette} progressivement en fouettant, pour émulsionner. Assaisonne de {sel_poivre_vinaigrette}."},{"titre":"Étape 5 — Dressage","contenu":"Dans un saladier, dépose la laitue, assaisonne de sauce moutardée, puis parsème de jambon frit, de noisettes grillées et de quartiers d'oignon rouge. Sers avec la tarte tiède."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id": es pommes de terre)","quantite_par_portion":25,"unite":"cl","placeholder":"lait_cuisson"},{"nom":"Sel et poivre (garniture)","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre_garniture","categorie":"à ajouter soi-même"},{"nom":"Jaune d'œuf (dorure)","quantite_par_portion":0.75,"unite":"pièce(s)","placeholder":"jaune_d_oeuf_dorure"},{"nom":"Lait (dorure)","quantite_par_portion":1.25,"unite":"cl","placeholder":"lait_dorure"},{"nom":"Mesclun ou roquette (salade d'accompagnement)","quantite_par_portion":70,"unite":"g","placeholder":"mesclun"},{"nom":"Tomates cerise","quantite_par_portion":40,"unite":"g","placeholder":"tomates_cerise"},{"nom":"Huile d'olive (vinaigrette salade)","quantite_par_portion":1,"unite":"cl","placeholder":"huile_d_olive_salade","categorie":"à ajouter soi-même"},{"nom":"Vinaigre (vinaigrette salade)","quantite_par_portion":0.5,"unite":"cl","placeholder":"vinaigre_salade","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Pâte brisée au thym maison (mode opératoire repris de R081/R083/R084)","contenu":"Méthode manuelle : mélange la {farine_pate}, le {sel_pate} et le {thym_pate} dans un saladier. Ajoute le {beurre_pate} froid coupé en dés, sable du bout des doigts jusqu'à obtenir une texture sableuse. Creuse un puits, ajoute l'{eau_pate} froide, incorpore sans pétrir. Divise la pâte en deux pâtons, filme-les et place-les au frais pendant 30 minutes minimum.\n\nMéthode Thermomix TM5 (alternative) : place la farine, le sel, le thym et le beurre froid coupé en dés dans le bol, mixe 10 secondes vitesse 6 jusqu'à texture sableuse. Ajoute l'eau froide, mixe quelques secondes en mode pétrin (vitesse épi) jusqu'à ce que la pâte forme une boule. Divise en deux pâtons, filme et place au frais 30 minutes minimum."},{"titre":"Étape 2 — Garniture","contenu":"Lave et épluche les {pomme_de_terre}, puis coupe-les en rondelles pas trop épaisses. Dans une grande casserole, verse le {lait_cuisson}, 1 litre d'eau, la {laurier}, 1 gousse d'{ail} en chemise et les pommes de terre. Démarre la cuisson à froid et cuis pendant 20 minutes environ. Égoutte et laisse refroidir. Détaille le {lard_fume} en gros lardons et fais-les revenir dans une poêle. Ajoute l'{oignon} pelé et émincé et l'ail haché restant. Fais légèrement colorer. Laisse refroidir puis débarrasse au frais."},{"titre":"Étape 3 — Montage et cuisson","contenu":"Abaisse la pâte brisée puis fonce un plat à tarte de 26cm de diamètre ou un cercle en laissant bien ressortir la pâte. Remets au frais. Abaisse l'autre pâte brisée pour former un disque au diamètre du plat ou du cercle, puis remets au frais. Dans un bol, mélange les pommes de terre froides avec la {creme_fraiche_epaisse}, assaisonne de {sel_poivre_garniture} et de {muscade}. Ajoute le mélange lardons et oignons avec le gras de cuisson, ainsi que le {comte_rape}, et mélange de nouveau. Pour la dorure, mélange le {jaune_d_oeuf_dorure} et le {lait_dorure}. Remplis le fond de tarte à hauteur de la garniture, dore les bords de la tarte au pinceau et pose le second disque de pâte pour refermer la tourte en soudant les bords joliment. Crée une petite cheminée au centre de la tourte pour laisser s'échapper l'humidité pendant la cuisson. Dore la tourte au pinceau et remets-la au frais pendant 20 minutes. Préchauffe le four à 210°C. Avant cuisson, dore de nouveau puis enfourne pendant 25 minutes, baisse à 170°C et cuis pendant 35 à 40 minutes minimum."},{"titre":"Salade d'accompagnement (ajout)","contenu":"Mélange le {mesclun} et les {tomates_cerise} dans un saladier. Assaisonne de {huile_d_olive_salade} et de {vinaigre_salade}. Sers en accompagnement de la tourte."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R087","nom":"Velouté de carottes au curcuma, fromage frais et croûtons dorés","sous_titre":"pomme de terre et oignon, jambon blanc en accompagnement","source":"Recette (fiche livre de cuisine, p.16)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":30,"cuisson_min":28,"total_min":58},"ustensiles":["Casserole","Mixeur ou mixeur plongeant","Petit saladier","Poêle (croûtons)","Bols de service"],"conservation_note":"Les croûtons, la crème de fromage frais, les noisettes concassées et la menthe fraîche sont idéalement ajoutés frais à chaque service plutôt que préparés d'avance en grande quantité.","allergenes_note":"Contient lait (fromage frais, crème, beurre), gluten (croûtons), fruits à coque (noisettes). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Les croûtons doivent être ajoutés fraîchement grillés à chaque service pour rester croustillants. La crème de fromage frais, les noisettes et la menthe sont également à ajouter fraîches.","qualite_conservation_2_a_4_jours":"bonne (voire congélation possible pour le velouté seul)","justification":"Velouté qui se prête très bien à une grosse préparation reconsommée sur plusieurs repas de la semaine (typage A/E/F), avec un simple réchauffage. Seuls les croûtons, la crème de fromage frais, les noisettes et la menthe doivent être préparés frais à chaque service."},"ingredients":[{"nom":"Carottes","quantite_par_portion":62.5,"unite":"g","placeholder":"carottes"},{"nom":"Pomme de terre","quantite_par_portion":70,"unite":"g","placeholder":"pomme_de_terre"},{"nom":"Oignon","quantite_par_portion":20,"unite":"g","placeholder":"oignon"},{"nom":"Fromage frais (Kiri® ou Saint-Môret®) ou ricotta","quantite_par_portion":25,"unite":"g","placeholder":"fromage_frais"},{"nom":"Crème liquide","quantite_par_portion":8.75,"unite":"cl","placeholder":"creme_liquide"},{"nom":"Beurre doux","quantite_par_portion":10,"unite":"g","placeholder":"beurre_doux"},{"nom":"Curcuma en poudre","quantite_par_portion":0.5,"unite":"g","placeholder":"curcuma"},{"nom":"Noisettes","quantite_par_portion":5,"unite":"g","placeholder":"noisettes"},{"nom":"Croûtons dorés","quantite_par_portion":30,"unite":"g","placeholder":"croutons_dores"},{"nom":"Menthe fraîche (petites feuilles)","quantite_par_portion":1,"unite":"feuille(s)","placeholder":"menthe"},{"nom":"Sel fin et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"},{"nom":"Jambon blanc (tranches, accompagnement)","quantite_par_portion":1.5,"unite":"tranche(s)","placeholder":"jambon_blanc"}],"instructions":[{"titre":"Étape 1 — Cuisson des légumes","contenu":"Pèle et coupe les {carottes}, la {pomme_de_terre} et l'{oignon} en rondelles ou morceaux, mets-les à cuire ensemble dans une casserole d'eau bouillante salée, 28 minutes."},{"titre":"Étape 2 — Crème de fromage frais","contenu":"Dans un petit saladier, fouette le {fromage_frais} avec une partie de la {creme_liquide} pour qu'il soit bien lisse. Place au frais."},{"titre":"Croûtons dorés (mode opératoire ajouté)","contenu":"Coupe le {croutons_dores} en dés. Fais-les dorer à sec dans une poêle, ou au four quelques minutes, jusqu'à ce qu'ils soient croustillants."},{"titre":"Étape 3 — Velouté","contenu":"Égoutte les légumes et verse-les dans le mixeur, ajoute un peu d'eau de cuisson, le {beurre_doux}, le reste de {creme_liquide} et le {curcuma}, mixe. La consistance doit être veloutée. Sale et poivre."},{"titre":"Étape 4 — Service","contenu":"Dans chaque bol, verse le velouté chaud, dépose au centre 1 cuillerée de crème de fromage frais, des {noisettes} concassées et des {croutons_dores}. Décore avec la {menthe} fraîche. Sers accompagné du {jambon_blanc}."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R088","nom":"Velouté de courge au canard confit","sous_titre":"potimarron, cerfeuil, huile de sésame et croûtons dorés","source":"Recette (fiche livre de cuisine, p.85)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["automne","hiver"],"temps":{"preparation_min":15,"cuisson_min":25,"total_min":40},"ustensiles":["Casserole","Mixeur ou mixeur plongeant","Poêle (croûtons)","Bols de service"],"conservation_note":"Le cerfeuil ciselé et l'huile de sésame sont idéalement ajoutés frais à chaque service. Les croûtons sont également à préparer au dernier moment pour rester croustillants.","allergenes_note":"Contient gluten (croûtons). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":false,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"Les croûtons doivent être ajoutés fraîchement grillés à chaque service pour rester croustillants. Le cerfeuil et l'huile de sésame sont également à ajouter frais.","qualite_conservation_2_a_4_jours":"bonne (voire congélation possible pour le velouté seul)","justification":"Velouté très simple à préparer qui se prête très bien à une grosse préparation reconsommée sur plusieurs repas de la semaine (typage A/E/F), avec un simple réchauffage. Seuls les croûtons, le cerfeuil et l'huile de sésame doivent être ajoutés frais à chaque service."},"ingredients":[{"nom":"Cuisse de canard confite","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"cuisse_canard_confite"},{"nom":"Potimarron","quantite_par_portion":0.25,"unite":"pièce(s)","placeholder":"potimarron"},{"nom":"Croûtons dorés","quantite_par_portion":30,"unite":"g","placeholder":"croutons_dores"},{"nom":"Cerfeuil (feuilles)","quantite_par_portion":null,"unite":"quelques feuilles","placeholder":"cerfeuil","categorie":"à ajouter soi-même"},{"nom":"Huile de sésame","quantite_par_portion":null,"unite":"quelques gouttes","placeholder":"huile_de_sesame","categorie":"à ajouter soi-même"},{"nom":"Sel et poivre du moulin","quantite_par_portion":null,"unite":"selon goût","placeholder":"sel_poivre","categorie":"à ajouter soi-même"}],"instructions":[{"titre":"Étape 1 — Canard","contenu":"Fais griller la {cuisse_canard_confite} dans une casserole sans matière grasse, puis réserve-la dans un plat."},{"titre":"Étape 2 — Potimarron","contenu":"Lave le {potimarron} et coupe-le en gros cubes. Fais-les revenir dans les sucs de cuisson du canard, puis couvre-les d'eau à hauteur et laisse cuire 20 minutes à feu doux."},{"titre":"Croûtons dorés (ajout)","contenu":"Coupe le {croutons_dores} en dés. Fais-les dorer à sec dans une poêle, ou au four quelques minutes, jusqu'à ce qu'ils soient croustillants."},{"titre":"Étape 3 — Effilochage et herbes","contenu":"Pendant ce temps, effiloche la cuisse de canard. Lave, sèche et cisèle le {cerfeuil}."},{"titre":"Étape 4 — Velouté","contenu":"Mixe la courge afin d'obtenir une texture veloutée. Sale et poivre."},{"titre":"Étape 5 — Service","contenu":"Sers le velouté parsemé d'effiloché de canard, de quelques gouttes d'{huile_de_sesame}, de {cerfeuil} ciselé et des {croutons_dores}.","astuce_chef":"Ne rien gâcher : la graisse de canard récupérée en cuisson peut être conservée au réfrigérateur et réutilisée plus tard pour cuire des pommes de terre à la poêle, ou pour d'autres recettes de poisson."}],"thermomix":false,"contrainte_bol":false,"seuil_portions_bol":null,"instruction_bascule":null,"energie_kcal":null},{"id":"R089","nom":"Volaille à la tapenade à la plancha","sous_titre":"pommes de terre grelot, poivron et oignon grillés","source":"Recette (fiche livre de cuisine, p.235)","typage_generique":["A","E","F"],"vegetarien":false,"saisonnalite":["ete"],"temps":{"preparation_min":15,"cuisson_min":50,"total_min":65},"ustensiles":["Plancha","Bol (mélange herbes)","Pinceau de cuisine"],"conservation_note":null,"allergenes_note":"Contient gluten (chapelure). Se référer aux étiquettes des produits achetés.","classification_conservation_reconsommation":{"description_grille":"Grille complémentaire au typage_generique (A-F), décrivant l'aptitude de la recette selon trois niveaux de disponibilité en cuisine, en écho aux créneaux de la semaine générique : temps confortable pour cuisiner / réchauffage simple ou consommation froide / réchauffage avec complément rapide (accompagnement ou ajout d'ingrédient).","necessite_temps_confortable_preparation":true,"compatible_rechauffage_simple_ou_froid":true,"compatible_rechauffage_complement_rapide":true,"complement_rapide_description":"La volaille, les pommes de terre et les légumes grillés se réchauffent bien au four ou à la poêle.","qualite_conservation_2_a_4_jours":"bonne","justification":"Volaille entière grillée à la plancha avec ses accompagnements, plat familial d'été qui se prête bien à une grosse préparation reconsommée sur plusieurs repas de la semaine (typage A/E/F), avec un réchauffage simple."},"ingredients":[{"nom":"Poulet fermier ouvert en crapaudine","quantite_par_portion":290.91,"unite":"g (cru, avec os)","placeholder":"poulet"},{"nom":"Pommes de terre grelot","quantite_par_portion":65,"unite":"g (cru)","placeholder":"pommes_de_terre_grelot"},{"nom":"Poivron","quantite_par_portion":100,"unite":"g","placeholder":"poivron"},{"nom":"Oignon","quantit function fusionnerCorpus(recettesBrutesImportees){
  const parId = {};
  RAW_CORPUS.forEach(r=>{ parId[r.id] = r; });
  (recettesBrutesImportees||[]).forEach(r=>{ if(r && r.id) parId[r.id] = r; });
  CORPUS = Object.values(parId).map(adapterRecette);
}
function chargerCorpusPersonnalise(){
  const importes = lireStockage('corpus_utilisateur') || [];
  fusionnerCorpus(importes);
}
function importerCorpus(nouvellesRecettesBrutes){
  const importesExistants = lireStockage('corpus_utilisateur') || [];
  const parId = {};
  importesExistants.forEach(r=>{ if(r && r.id) parId[r.id] = r; });
  let ajoutes = 0, remplaces = 0, invalides = 0;
  nouvellesRecettesBrutes.forEach(r=>{
    if(!r || !r.id || !r.nom){ invalides++; return; }
    if(parId[r.id]) remplaces++; else ajoutes++;
    parId[r.id] = r;
  });
  const fusionne = Object.values(parId);
  ecrireStockage('corpus_utilisateur', fusionne);
  fusionnerCorpus(fusionne);
  return { ajoutes, remplaces, invalides, total: CORPUS.length };
}
function appliquerFiltreThermomix(liste){
  if(state.filtreThermomix === 'uniquement') return liste.filter(r=>r.estThermomix);
  if(state.filtreThermomix === 'aucune') return liste.filter(r=>!r.estThermomix);
  return liste;
}
function recettesPourLettre(l){ return appliquerFiltreThermomix(CORPUS.filter(r=>r.typageGenerique.includes(l))); }
function toutesSaisonsCorpus(){ const s=new Set(); CORPUS.forEach(r=>r.saisonnalite.forEach(x=>s.add(x))); return Array.from(s).sort(); }

/* Historique persistant (fenêtre glissante) */
function nouvelIdSemaine(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'sem-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}
const FENETRE_SEMAINES = 3;
let historique = [];
let snapshotActif = null; // quand défini, on consulte une semaine archivée plutôt que l'état en cours
function modeLabelActuel(){
  if(snapshotActif) return snapshotActif.modeLabel;
  return state.mode==='custom' ? 'Semaine sur-mesure' : (state.mode==='cas1' ? 'Cas 1' : 'Cas 2');
}
function chargerHistorique(){
  historique = lireStockage('historique_semaines') || [];
  render();
}
function idsChoisisActuels(){
  if(state.mode === 'custom') return Object.values(state.choixLots).filter(Boolean);
  return LETTRES.map(l=>state.choix[l]).filter(Boolean);
}
function enregistrerSemaineActuelle(){
  const aujourdhui = new Date().toISOString().slice(0,10);
  const selections = selectionsActuelles().map(s=>({ label:s.label, recipeId:s.recipeId, portions:s.portions }));
  const lignesPlanning = construireLignesPlanningActuel();
  historique = historique.filter(e => e.sessionId !== state.sessionId);
  historique.push({ date: aujourdhui, sessionId: state.sessionId, recettesChoisies: idsChoisisActuels(), modeLabel: modeLabelActuel(), selections, lignesPlanning });
  historique = historique.slice(-20);
  ecrireStockage('historique_semaines', historique);
}
function recettesRecentes(){
  const limite = Date.now() - FENETRE_SEMAINES*7*24*3600*1000;
  const ids = new Set();
  historique.forEach(entry=>{ if(new Date(entry.date).getTime() >= limite){ entry.recettesChoisies.forEach(id=>ids.add(id)); } });
  return ids;
}

const FAMILLE = { adulte:2, grand:1, petit:1 };
const SOLO    = { adulte:1, grand:0, petit:0 };
const MERCREDI_MAISON = { adulte:1, grand:1, petit:1 };
function defautAttendance(slotId, mode){
  if(slotId === 'mer_midi'){
    if(mode === 'cas1') return { adulte:0, grand:0, petit:0, retire:true };
    return { ...MERCREDI_MAISON, retire:false };
  }
  if(['jeu_midi','ven_midi','lun_midi','mar2_midi'].includes(slotId)) return { ...SOLO, retire:false };
  return { ...FAMILLE, retire:false };
}
function portionsSlot(att){
  if(!att || att.retire) return 0;
  return att.adulte*PROFILS.adulte.ratio + att.grand*PROFILS.grand.ratio + att.petit*PROFILS.petit.ratio;
}
const SLOT_CONSO_FIXES = {
  cas1: {mar_soir:3.5, mer_midi:0,   mer_soir:3.5, jeu_midi:1, jeu_soir:3.5, ven_midi:1, ven_soir:3.5, sam_midi:3.5, sam_soir:3.5, dim_midi:3.5, dim_soir:3.5, lun_midi:1, lun_soir:3.5, mar2_midi:1},

};
const LETTRES = ['A','B','C','D','E','F'];

/* Disponibilité par défaut en mode sur-mesure, calquée sur l'architecture d'origine */
const DISPO_DEFAUT = {
  mar_soir:'confortable', mer_midi:'reconso', mer_soir:'rapide', jeu_midi:'reconso', jeu_soir:'reconso',
  ven_midi:'reconso', ven_soir:'rapide', sam_midi:'rapide', sam_soir:'confortable', dim_midi:'reconso',
  dim_soir:'confortable', lun_midi:'reconso', lun_soir:'reconso', mar2_midi:'reconso',

/* État */
let state = {
  step: 1,
  mode: null,
  custom: {},
  retraitsFixes: new Set(),
  dispo: {},
  rapideReconso: {},
  choixLots: {},
  selectionMode: null,
  filtreThermomix: null,
  auto: { nbVege:2, saisons: toutesSaisonsCorpus(), eviterRepetition:true },
  choix: {},
  cochees: new Set(),
  sessionId: nouvelIdSemaine(),
  corpusPanelOuvert: false,
  corpusMessage: null,
  vue: 'planificateur',
  archiveEcran: 'carnet',
  consultation: { etape:'portions', portions:4, recetteId:null, filtres:{ vegetarien:null, viandes:[], saisons:[], rythme:null } },
};
function initCustomIfNeeded(){
  if(Object.keys(state.custom).length) return;
  SLOTS.forEach(s => {
    state.custom[s.id] = defautAttendance(s.id, 'cas2');
    state.dispo[s.id] = DISPO_DEFAUT[s.id];
    state.rapideReconso[s.id] = false;
  });
}
function attendanceFor(slotId){
  if(state.mode === 'custom'){ initCustomIfNeeded(); return state.custom[slotId]; }
  return defautAttendance(slotId, state.mode);
}
function slotConsumption(slotId){
  if(state.mode === 'custom') return portionsSlot(attendanceFor(slotId));
  if(state.retraitsFixes.has(slotId)) return 0;
  return SLOT_CONSO_FIXES[state.mode][slotId];
}
function computePortionsParLettre(){
  const totaux = {A:0,B:0,C:0,D:0,E:0,F:0};
  SLOTS.forEach(s => { totaux[s.letter] += slotConsumption(s.id); });
  LETTRES.forEach(l => { totaux[l] = Math.round(totaux[l]*100)/100; });
  return totaux;
}

/* Construction des lots (mode sur-mesure) */
function construirePlanSurMesure(){
  initCustomIfNeeded();
  const lots = [];
  let lotActif = null;
  SLOTS.forEach(s=>{
    const portionsRepas = portionsSlot(state.custom[s.id]);
    if(portionsRepas === 0) return;
    const dispo = state.dispo[s.id];
    if(dispo === 'confortable'){
      lotActif = { id:'lot'+(lots.length+1), slots:[{...s, portionsRepas, role:'prep'}] };
      lots.push(lotActif);
    } else if(dispo === 'rapide'){
      const reconso = state.rapideReconso[s.id];
      if(reconso && lotActif){
        lotActif.slots.push({...s, portionsRepas, role:'rapide_reconso'});
      } else {
        lotActif = { id:'lot'+(lots.length+1), slots:[{...s, portionsRepas, role:'prep_rapide'}] };
        lots.push(lotActif);
      }
    } else {
      if(lotActif){
        lotActif.slots.push({...s, portionsRepas, role:'reconso'});
      } else {
        lots.push({ id:'orph'+s.id, slots:[{...s, portionsRepas, role:'orpheline'}], orpheline:true });
      }
    }
  });
  return lots;
}
function portionsLot(lot){ return Math.round(lot.slots.reduce((a,s)=>a+s.portionsRepas,0)*100)/100; }
function candidatsPourLot(lot){
  const premier = lot.slots[0];
  const needReconsoSimple = lot.slots.some(s=>s.role==='reconso');
  const needComplementRapide = lot.slots.some(s=>s.role==='rapide_reconso');
  return appliquerFiltreThermomix(CORPUS.filter(r=>{
    if(premier.role==='prep_rapide' && r.necessiteConfortable) return false;
    if(needReconsoSimple && !r.compatibleReconsoSimple) return false;
    if(needComplementRapide && !r.compatibleComplementRapide) return false;
    return true;
  }));
}
function labelLot(lot){ const p = lot.slots[0]; return `${p.jour} ${p.moment.toLowerCase()}`; }

function choisirParmiMeilleurs(opts, scoreFn){
  let meilleurScore = Infinity;
  opts.forEach(o=>{ const s = scoreFn(o); if(s < meilleurScore) meilleurScore = s; });
  const meilleurs = opts.filter(o=>scoreFn(o) === meilleurScore);
  return meilleurs[Math.floor(Math.random()*meilleurs.length)];
}

/* Proposition automatique (Cas 1/Cas 2 et Sur-mesure) */
function ingredientsCaracteristiques(recette){
  return new Set(recette.ingredients.filter(i=>!i.base).map(i=>i.nom.toLowerCase().replace(/\(.*?\)/g,'').trim()));
}
const MOTS_VIDES_NOM = new Set(['de','du','des','la','le','les','au','aux','à','a','en','et','avec','sur','sous','pour','façon','facon','mon','ma','mes','un','une','ou','sans','the','au four','à la']);
function motsSignificatifsNom(nom){
  return new Set((nom||'').toLowerCase().replace(/['’]/g,' ').split(/[^a-zàâäéèêëîïôöùûüç]+/).filter(w=>w.length>2 && !MOTS_VIDES_NOM.has(w)));
}
function similariteNom(r1, r2){
  const a = motsSignificatifsNom(r1.nom), b = motsSignificatifsNom(r2.nom);
  const inter = [...a].filter(x=>b.has(x)).length;
  const union = new Set([...a,...b]).size;
  return union ? inter/union : 0;
}
function similarite(r1, r2){
  if(r1.id === r2.id) return 1;
  const a = ingredientsCaracteristiques(r1), b = ingredientsCaracteristiques(r2);
  const inter = [...a].filter(x=>b.has(x)).length;
  const union = new Set([...a,...b]).size;
  const jaccard = union ? inter/union : 0;
  const tagsA = classifierViandes(r1), tagsB = classifierViandes(r2);
  const memeProteine = tagsA.length && tagsB.length && tagsA.some(t=>tagsB.includes(t));
  const parIngredients = jaccard + (memeProteine ? 0.25 : 0);
  const parNom = similariteNom(r1, r2) * 0.85;
  return Math.min(1, Math.max(parIngredients, parNom));
}
const SEUIL_ALERTE_SIMILARITE = 0.35;
function recetteSimilairePlusProche(recette, autresIds){
  let meilleur = null, meilleurScore = 0;
  autresIds.forEach(id=>{
    if(!id || id === recette.id) return;
    const autre = CORPUS.find(r=>r.id===id);
    if(!autre) return;
    const s = similarite(recette, autre);
    if(s > meilleurScore){ meilleurScore = s; meilleur = autre; }
  });
  return meilleurScore > SEUIL_ALERTE_SIMILARITE ? meilleur : null;
}

      if(f.length) opts = f;
    }

      if(f.length) opts = f;
    }
    const richesDejaChoisies = recettesChoisiesObjets.filter(r=>r.estRiche).length;
    if(richesDejaChoisies >= 1){
      const f = opts.filter(o=>!o.estRiche);
      if(f.length) opts = f;
    }
    const vegeSoFar = recettesChoisiesObjets.filter(r=>r.vegetarien).length;
    const meilleur = choisirParmiMeilleurs(opts, o=>{
      const v = vegeSoFar + (o.vegetarien?1:0);
      const repet = recentes.has(o.id) ? 1 : 0;
      const maxSim = recettesChoisiesObjets.reduce((m,c)=>Math.max(m, similarite(o,c)), 0);

/* Unités, arrondis, rayons */
const UNITES_COMPTABLES = ['pièce','sachet','botte','branche','pot','gousse','brin','tranche'];
function baseUnit(unite){ if(!unite) return ''; return unite.split('(')[0].trim(); }
function estComptable(u){ return UNITES_COMPTABLES.includes(u); }
function arrondir(qte, u){
  if(estComptable(u)) return Math.round(qte*2)/2;
  if(u==='g' || u==='ml'){ if(qte<50) return Math.round(qte/5)*5; if(qte<200) return Math.round(qte/10)*10; return Math.round(qte/25)*25; }
  if(u==='cl') return Math.round(qte);
  if(u==='L') return Math.round(qte*10)/10;
  if(u==='cs' || u==='cc') return Math.round(qte*2)/2;
  return Math.round(qte*100)/100;
}
function fmtQte(q, u){
  const val = Number.isInteger(q) ? q : (Math.round(q*100)/100).toString();
  if(estComptable(u)) return `${val} ${u}${q>1?'s':''}`;
  return `${val} ${u}`;
}
function fmtTemps(min){
  if(min==null) return 'Non précisé';
  if(min>=60){ const h=Math.floor(min/60), m=min%60; return m ? `${h} h ${m} min` : `${h} h`; }
  return `${min} min`;
}
const MOTS_INVARIANTS = new Set(['pois','brebis','tapis','anis','cassis','maïs','riz','pâtes']);
function normaliserMot(mot){
  if(MOTS_INVARIANTS.has(mot)) return mot;
  if(/eaux$/.test(mot)) return mot.replace(/eaux$/,'eau');
  if(/s$/.test(mot)) return mot.slice(0,-1);
  if(/x$/.test(mot)) return mot.slice(0,-1);
  return mot;
}
function normaliserPourRecherche(nom){
  return nom.toLowerCase().replace(/[a-zàâäéèêëîïôöùûüç]+/gi, mot => normaliserMot(mot));
}
function contientMot(nomNormalise, motCle){
  const echappe = normaliserPourRecherche(motCle).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(^|[^a-zàâäéèêëîïôöùûüç])' + echappe + '([^a-zàâäéèêëîïôöùûüç]|$)', 'i');
  return re.test(nomNormalise);
}

function classifierRayonEtCle(nom){
  const n = nom.toLowerCase();
  const nNorm = normaliserPourRecherche(nom);
  for(const [rayon, groupes] of RAYON_MOTS_PRECIS){
    for(const [cle, variantes] of groupes){
      if(variantes.some(v=>n.includes(v))) return { rayon, cle };
    }
  }
  for(const [rayon, groupes] of RAYON_MOTS){
    for(const [cle, variantes] of groupes){
      if(variantes.some(v=>contientMot(nNorm, v))) return { rayon, cle };
    }
  }
  return { rayon: 'Épicerie', cle: n };
}
function classifierRayon(nom){ return classifierRayonEtCle(nom).rayon; }
const VIANDE_MOTS = [
  ['Bœuf', ['bœuf','boeuf']],
  ['Porc', ['porc','jambon','lard']],
  ['Poulet / volaille', ['poulet','volaille']],
  ['Poisson', ['poisson','thon','saumon']],
];
function classifierViandes(recette){
  if(recette.vegetarien) return [];
  const tags = new Set();
  recette.ingredients.forEach(ing=>{
    const n = ing.nom.toLowerCase();
    if(n.includes('sauce')) return;
    VIANDE_MOTS.forEach(([tag,mots])=>{ if(mots.some(m=>n.includes(m))) tags.add(tag); });
  });
  return Array.from(tags);
}
function toutesViandesCorpus(){
  const s = new Set();
  CORPUS.forEach(r=>classifierViandes(r).forEach(t=>s.add(t)));
  return Array.from(s).sort();
}
function recettesFiltrees(){
  const f = state.consultation.filtres;
  return CORPUS.filter(r=>{
    if(f.vegetarien === true && !r.vegetarien) return false;
    if(f.vegetarien === false && r.vegetarien) return false;
    if(f.viandes.length){
      const tags = classifierViandes(r);
      if(!f.viandes.some(v=>tags.includes(v))) return false;
    }
    if(f.saisons.length){
      if(!(r.saisonnalite.includes('toute_saison') || r.saisonnalite.some(s=>f.saisons.includes(s)))) return false;
    }
    if(f.rythme === 'rapide' && r.necessiteConfortable) return false;
    if(f.rythme === 'confortable' && !r.necessiteConfortable) return false;
    return true;
  }).sort((a,b)=>a.nom.localeCompare(b.nom));
}
function substituerPlaceholders(texte, recette, portions){
  return texte.replace(/\{([a-zA-Z0-9_]+)\}/g, (m, ph) => {
    const ing = recette.ingredients.find(i=>i.placeholder===ph);
    if(!ing || ing.qte==null) return m;
    const u = baseUnit(ing.unite);
    const q = arrondir(ing.qte*portions, u);
    return `${fmtQte(q,u)} de ${ing.nom.toLowerCase()}`;
  });
}
function fmtPortions(n){ return Number.isInteger(n) ? n : n.toFixed(2).replace(/0$/,'').replace(/\.$/,''); }

/* Liste de courses */
function genererListe(){
  const totaux = {}; const provenance = {}; const sansQuantite = new Set();
  selectionsActuelles().forEach(sel=>{
    if(!sel.recipeId) return;
    const recette = CORPUS.find(r=>r.id===sel.recipeId);
    if(!recette) return;
    recette.ingredients.forEach(ing=>{
      if(ing.qte==null){ sansQuantite.add(ing.nom); return; }
      const u = baseUnit(ing.unite);
      const key = ing.nom + '|' + u;
      if(!totaux[key]) {
        const { rayon, cle } = ing.base ? { rayon:'Condiments & basiques', cle: ing.nom.toLowerCase() } : classifierRayonEtCle(ing.nom);
        totaux[key] = { nom:ing.nom, unite:u, qte:0, rayon, cle };
        provenance[key] = new Set();
      }
      totaux[key].qte += ing.qte * sel.portions;
      provenance[key].add(`${sel.label} · ${recette.nom}`);
    });
  });
  const parRayon = {};
  Object.entries(totaux).forEach(([key,item])=>{
    item.qte = arrondir(item.qte, item.unite);
    if(item.qte === 0) return;
    item.provenance = Array.from(provenance[key]);
    if(!parRayon[item.rayon]) parRayon[item.rayon] = [];
    parRayon[item.rayon].push(item);
  });
  return { parRayon, sansQuantite: Array.from(sansQuantite).sort() };
}

function telechargerJSON(nomFichier, data){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderCalendrierLettre(l){
  const slots = SLOTS.filter(s=>s.letter===l);
  const rows = slots.map(s=>{
    const qte = slotConsumption(s.id);
    if(qte===0) return null;
    return `<div class="calendrier-row ${s.prep?'prep':''}">${s.prep?'🔪':'🍽'} <strong>${s.jour} ${s.moment.toLowerCase()}</strong> — ${fmtPortions(qte)} portion${qte>1?'s':''}${s.prep?' (préparation du lot)':''}</div>`;
  }).filter(Boolean);
  return `<div class="calendrier">${rows.join('')}</div>`;
}
function renderCalendrierLot(lot){
  const rows = lot.slots.map(s=>{
    let icone = '🍽', texte = 'consommées';
    if(s.role==='prep' || s.role==='prep_rapide'){ icone='🔪'; texte='préparées'; }
    if(s.role==='rapide_reconso'){ icone='🍽+'; texte='consommées avec complément rapide'; }
    return `<div class="calendrier-row ${s.role==='prep'||s.role==='prep_rapide'?'prep':''}">${icone} <strong>${s.jour} ${s.moment.toLowerCase()}</strong> — ${fmtPortions(s.portionsRepas)} portion${s.portionsRepas>1?'s':''} ${texte}</div>`;
  });
  return `<div class="calendrier">${rows.join('')}</div>`;
}

function renderStep3(){
  let html = `<section><h2>3. Une recette par ${state.mode==='custom'?'lot':'lettre'}</h2><p class="sub">${state.selectionMode==='auto' ? 'Proposition générée — modifie ce que tu veux avant de continuer.' : 'Les quantités viennent de ta semaine choisie à l\'étape 1.'}</p>`;

  if(state.mode === 'custom'){
    const lots = construirePlanSurMesure();
    lots.forEach(lot=>{
      if(lot.orpheline){
        html += `<div class="slot-card orpheline"><div class="slot-head"><span class="letter">Conflit</span></div>
          <div class="warn">⚠ ${lot.slots[0].jour} ${lot.slots[0].moment.toLowerCase()} est marqué "réchauffage/froid" sans lot disponible. Retourne à l'étape 1 pour ajuster la disponibilité de ce repas.</div></div>`;
        return;
      }
      const options = candidatsPourLot(lot);
      const choix = state.choixLots[lot.id];
      const recetteChoisie = choix ? CORPUS.find(r=>r.id===choix) : null;
      const utiliseeAvant = choix && recettesRecentes().has(choix);
      const autresLots = Object.entries(state.choixLots).filter(([k,v])=>k!==lot.id && v===choix);
      const similaire = recetteChoisie ? recetteSimilairePlusProche(recetteChoisie, Object.entries(state.choixLots).filter(([k])=>k!==lot.id).map(([,v])=>v)) : null;
      html += `<div class="slot-card">
        <div class="slot-head"><span class="letter">Lot du ${labelLot(lot)}</span><span class="portions">${fmtPortions(portionsLot(lot))} portions à préparer</span></div>
        <select data-lot="${lot.id}"><option value="">— Choisir —</option>
          ${options.map(o=>`<option value="${o.id}" ${choix===o.id?'selected':''}>${o.nom}${o.vegetarien?' 🌱':''}${o.estThermomix?' 🤖':''}${o.estRiche?' 🔥':''}</option>`).join('')}
        </select>
        ${options.length===0 ? `<div class="warn">⚠ Aucune recette du corpus ne remplit toutes les contraintes de ce lot (temps de préparation et compatibilité de reconsommation). Il faudra soit changer la disponibilité de certains repas, soit enrichir le corpus.</div>` : ''}
        ${recetteChoisie ? `<span class="season-badge">${recetteChoisie.saisonnalite.map(s=>s.replace(/_/g,' ')).join(', ')}</span>` : ''}
        ${utiliseeAvant ? `<div class="warn">⚠ Déjà préparée dans les ${FENETRE_SEMAINES} dernières semaines</div>` : ''}
        ${autresLots.length ? `<div class="info-douce">ℹ️ Déjà choisie pour un autre lot cette semaine</div>` : ''}
        ${similaire ? `<div class="info-douce">🔍 Assez proche de "${similaire.nom}" déjà retenue cette semaine (ingrédients ou protéine similaires)</div>` : ''}
        ${recetteChoisie && recetteChoisie.complementRapideDescription && lot.slots.some(s=>s.role==='rapide_reconso') ? `<div class="info-douce">💡 ${recetteChoisie.complementRapideDescription}</div>` : ''}
        ${choix ? renderCalendrierLot(lot) : ''}
      </div>`;
    });
    const lotsValides = lots.filter(l=>!l.orpheline);
    const tousChoisis = lotsValides.length>0 && lotsValides.every(l=>state.choixLots[l.id]);
    html += `<button class="cta" id="toStep4" ${tousChoisis?'':'disabled'}>Générer la liste de courses →</button>`;
    html += `<button class="cta secondary" id="backTo2">← Revenir en arrière</button></section>`;
    return html;
  }

  const portions = computePortionsParLettre();
  const lettresActives = LETTRES.filter(l=>portions[l] > 0);
  lettresActives.forEach(l=>{
    const options = recettesPourLettre(l);
    const choix = state.choix[l];
    const utiliseeAvant = choix && recettesRecentes().has(choix);
    const idsAutresLettres = LETTRES.filter(x=>x!==l).map(x=>state.choix[x]).filter(Boolean);
    const dejaCetteSemaine = choix && idsAutresLettres.includes(choix);
    const recetteChoisie = choix ? CORPUS.find(r=>r.id===choix) : null;
    const similaire = recetteChoisie ? recetteSimilairePlusProche(recetteChoisie, idsAutresLettres) : null;
    html += `<div class="slot-card">
      <div class="slot-head"><span class="letter">Recette ${l}</span><span class="portions">${fmtPortions(portions[l])} portions à préparer</span></div>
      <select data-letter="${l}"><option value="">— Choisir —</option>
        ${options.map(o=>`<option value="${o.id}" ${choix===o.id?'selected':''}>${o.nom}${o.vegetarien?' 🌱':''}${o.estThermomix?' 🤖':''}${o.estRiche?' 🔥':''}</option>`).join('')}
      </select>
      ${options.length===0 ? `<div class="warn">⚠ Aucune recette ne correspond au filtre Thermomix choisi pour cette lettre. Assouplis-le à l'étape précédente.</div>` : ''}
      ${choix ? `<span class="season-badge">${CORPUS.find(r=>r.id===choix).saisonnalite.map(s=>s.replace(/_/g,' ')).join(', ')}</span>` : ''}
      ${utiliseeAvant ? `<div class="warn">⚠ Déjà préparée dans les ${FENETRE_SEMAINES} dernières semaines</div>` : ''}
      ${dejaCetteSemaine ? `<div class="info-douce">ℹ️ Déjà choisie pour une autre lettre cette semaine</div>` : ''}
      ${similaire ? `<div class="info-douce">🔍 Assez proche de "${similaire.nom}" déjà retenue cette semaine (ingrédients ou protéine similaires)</div>` : ''}
      ${choix ? renderCalendrierLettre(l) : ''}
    </div>`;
  });
  const tousChoisis = lettresActives.every(l=>state.choix[l]);
  html += `<button class="cta" id="toStep4" ${tousChoisis?'':'disabled'}>Générer la liste de courses →</button>`;
  html += `<button class="cta secondary" id="backTo2">← Revenir en arrière</button></section>`;
  return html;
}

function construireLignesPlanningActuel(){
  const lignes = [];
  if(state.mode === 'custom'){
    const lots = construirePlanSurMesure();
    SLOTS.forEach(s=>{
      const lot = lots.find(l=>l.slots.some(x=>x.id===s.id));
      if(!lot){ lignes.push({ jour:s.jour, moment:s.moment, vide:true }); return; }
      if(lot.orpheline){ lignes.push({ jour:s.jour, moment:s.moment, conflit:true }); return; }
      const slotInfo = lot.slots.find(x=>x.id===s.id);
      const recette = CORPUS.find(r=>r.id===state.choixLots[lot.id]);
      lignes.push({
        jour:s.jour, moment:s.moment,
        nomRecette: recette ? recette.nom : '(recette à choisir)',
        portions: slotInfo.portionsRepas,
        prep: slotInfo.role==='prep' || slotInfo.role==='prep_rapide',
        complement: slotInfo.role==='rapide_reconso',
      });
    });
  } else {
    SLOTS.forEach(s=>{
      const qte = slotConsumption(s.id);
      if(qte===0){ lignes.push({ jour:s.jour, moment:s.moment, retire:true }); return; }
      const recette = CORPUS.find(r=>r.id===state.choix[s.letter]);
      lignes.push({
        jour:s.jour, moment:s.moment,
        nomRecette: recette ? `${s.letter} · ${recette.nom}` : '(recette à choisir)',
        portions: qte, prep: s.prep, complement: false,
      });
    });
  }
  return lignes;
}
function renderTablePlanning(lignes){
  const jours = [];
  lignes.forEach(l=>{
    let grp = jours.find(j=>j.jour===l.jour);
    if(!grp){ grp = { jour:l.jour, midi:null, soir:null }; jours.push(grp); }
    grp[l.moment.toLowerCase()] = l;
  });
  function cellule(l){
    if(!l) return `<span class="planning-empty">—</span>`;
    if(l.vide || l.retire) return `<span class="planning-empty">Repas retiré / —</span>`;
    if(l.conflit) return `<span class="planning-empty">⚠ Conflit de planification</span>`;
    return `<span class="planning-recipe">${l.nomRecette}${l.prep?' <span class="prep-tag">🔪</span>':''}</span>
      <span class="planning-qty">${fmtPortions(l.portions)} portion${l.portions>1?'s':''}${l.prep?' préparées':(l.complement?' + complément':' consommées')}</span>`;
  }
  return `<table class="planning-table"><thead><tr><th>Jour</th><th>Midi</th><th>Soir</th></tr></thead>
    <tbody>${jours.map(g=>`<tr><td class="jour-cell">${g.jour}</td><td>${cellule(g.midi)}</td><td>${cellule(g.soir)}</td></tr>`).join('')}</tbody></table>`;
}
function renderEmploiDuTemps(){
  if(snapshotActif) return renderTablePlanning(snapshotActif.lignesPlanning);
  return renderTablePlanning(construireLignesPlanningActuel());
}

    </div>` : ''}
    <div class="criteria-row col"><span class="lbl">Saison</span>
      <div class="saison-options">${saisonsDispo.map(s=>`<label><input type="checkbox" data-consult-saison="${s}" ${f.saisons.includes(s)?'checked':''}>${s.replace(/_/g,' ')}</label>`).join('')}</div>
    </div>
    <div class="criteria-row col"><span class="lbl">Rythme</span>
      <div class="saison-options">
        <label><input type="radio" name="consultRythme" data-consult-rythme="null" ${f.rythme===null?'checked':''}> Toutes</label>
        <label><input type="radio" name="consultRythme" data-consult-rythme="rapide" ${f.rythme==='rapide'?'checked':''}> Rapide</label>
        <label><input type="radio" name="consultRythme" data-consult-rythme="confortable" ${f.rythme==='confortable'?'checked':''}> Temps confortable</label>
      </div>
    </div>
  </div>
  <p class="sub" style="margin-top:12px;color:rgba(246,241,228,.65);">${resultats.length} recette(s) correspondent.</p>
  <div class="slot-card">
    <select id="consultSelectRecette"><option value="">— Choisir une recette —</option>
      ${resultats.map(r=>`<option value="${r.id}" ${state.consultation.recetteId===r.id?'selected':''}>${r.nom}${r.vegetarien?' 🌱':''}${r.estThermomix?' 🤖':''}${r.estRiche?' 🔥':''}</option>`).join('')}
    </select>
  </div>
  <button class="cta" id="consultVoirFiche" ${state.consultation.recetteId?'':'disabled'}>Voir la recette →</button>
  <button class="cta secondary" id="consultRetourPortions">← Revoir le nombre de portions</button>
  <button class="cta secondary" id="consultRetourAccueil2">← Retour au menu d'accueil</button>
  </section>`;
}

function renderConsultationFiche(){
  const recette = CORPUS.find(r=>r.id===state.consultation.recetteId);
  if(!recette) return renderConsultationSelection();
  const p = state.consultation.portions;
  return `<div class="carnet-wrap">
    <div class="no-print carnet-topbar">
      <button class="cta secondary" id="consultRetourSelection">← Choisir une autre recette</button>
      <button class="cta" id="consultImprimer">🖨️ PDF</button>
    </div>
    <div class="carnet-cover" style="margin-top:20px;"><div class="eyebrow">Consultation du corpus</div><h2>${recette.nom}</h2><p>${fmtPortions(p)} portions</p></div>
    ${renderFicheRecette(recette, p)}
    <div class="no-print" style="padding:0 20px;"><button class="cta secondary" id="consultRetourAccueil3">← Retour au menu d'accueil</button></div>
  </div>`;
}

function reinitialiserPourNouvelleSemaine(){
  state.vue = 'planificateur';
  snapshotActif = null;
  state.step = 1; state.mode = null; state.selectionMode = null;
  state.choix = {}; state.choixLots = {}; state.custom = {}; state.dispo = {}; state.rapideReconso = {};
  state.retraitsFixes = new Set(); state.cochees = new Set(); state.sessionId = nouvelIdSemaine();
  state.consultation.etape = 'portions'; state.consultation.recetteId = null;
}

function attachEvents(){
  const ouvrirConsultation = document.getElementById('ouvrirConsultation');
  if(ouvrirConsultation) ouvrirConsultation.addEventListener('click', ()=>{ state.vue='consultation'; state.consultation.etape='portions'; render(); });

  const consultPortions = document.getElementById('consultPortions');
  if(consultPortions) consultPortions.addEventListener('input', ()=>{ state.consultation.portions = Math.max(0.5, parseFloat(consultPortions.value)||0.5); });
  document.querySelectorAll('[data-portions-chip]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.consultation.portions = parseFloat(btn.dataset.portionsChip); render(); });
  });
  const consultToSelection = document.getElementById('consultToSelection');
  if(consultToSelection) consultToSelection.addEventListener('click', ()=>{ state.consultation.etape='selection'; render(); });

  document.querySelectorAll('[data-consult-vege]').forEach(radio=>{
    radio.addEventListener('change', ()=>{
      const v = radio.dataset.consultVege;
      state.consultation.filtres.vegetarien = v === 'null' ? null : (v === 'true');
      render();
    });
  });
  document.querySelectorAll('[data-consult-viande]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const v = cb.dataset.consultViande; const arr = state.consultation.filtres.viandes;
      const idx = arr.indexOf(v);
      if(cb.checked && idx===-1) arr.push(v);
      if(!cb.checked && idx>-1) arr.splice(idx,1);
      render();
    });
  });
  document.querySelectorAll('[data-consult-saison]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const v = cb.dataset.consultSaison; const arr = state.consultation.filtres.saisons;
      const idx = arr.indexOf(v);
      if(cb.checked && idx===-1) arr.push(v);
      if(!cb.checked && idx>-1) arr.splice(idx,1);
      render();
    });
  });
  document.querySelectorAll('[data-consult-rythme]').forEach(radio=>{
    radio.addEventListener('change', ()=>{
      const v = radio.dataset.consultRythme;
      state.consultation.filtres.rythme = v === 'null' ? null : v;
      render();
    });
  });
  const consultSelectRecette = document.getElementById('consultSelectRecette');
  if(consultSelectRecette) consultSelectRecette.addEventListener('change', ()=>{ state.consultation.recetteId = consultSelectRecette.value || null; render(); });
  const consultVoirFiche = document.getElementById('consultVoirFiche');
  if(consultVoirFiche) consultVoirFiche.addEventListener('click', ()=>{ state.consultation.etape='fiche'; render(); });
  const consultRetourPortions = document.getElementById('consultRetourPortions');
  if(consultRetourPortions) consultRetourPortions.addEventListener('click', ()=>{ state.consultation.etape='portions'; render(); });
  const consultRetourSelection = document.getElementById('consultRetourSelection');
  if(consultRetourSelection) consultRetourSelection.addEventListener('click', ()=>{ state.consultation.etape='selection'; render(); });
  const consultImprimer = document.getElementById('consultImprimer');
  if(consultImprimer) consultImprimer.addEventListener('click', ()=>{ window.print(); });
  ['consultRetourAccueil','consultRetourAccueil2','consultRetourAccueil3'].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener('click', ()=>{ state.vue='planificateur'; state.step=1; render(); });
  });

  const effacerToutHistorique = document.getElementById('effacerToutHistorique');
  if(effacerToutHistorique) effacerToutHistorique.addEventListener('click', ()=>{
    historique = [];
    ecrireStockage('historique_semaines', historique);
    render();
  });
  document.querySelectorAll('[data-effacer-semaine]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      historique = historique.filter(e=>e.sessionId !== btn.dataset.effacerSemaine);
      ecrireStockage('historique_semaines', historique);
      render();
    });
  });
  document.querySelectorAll('[data-voir-carnet]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entree = historique.find(e=>e.sessionId === btn.dataset.voirCarnet);
      if(!entree) return;
      snapshotActif = entree; state.vue = 'archive'; state.archiveEcran = 'carnet'; render();
    });
  });
  document.querySelectorAll('[data-voir-courses]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entree = historique.find(e=>e.sessionId === btn.dataset.voirCourses);
      if(!entree) return;
      snapshotActif = entree; state.vue = 'archive'; state.archiveEcran = 'courses'; render();
    });
  });
  ['archiveRetourHistorique','archiveRetourHistorique2','archiveRetourHistorique3'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', ()=>{
      snapshotActif = null; state.vue = 'planificateur'; state.step = 1; render();
    });
  });

  const ouvrirGuideCorpus = document.getElementById('ouvrirGuideCorpus');
  if(ouvrirGuideCorpus) ouvrirGuideCorpus.addEventListener('click', ()=>{ state.vue = 'guide'; render(); });
  const guideRetourAccueil = document.getElementById('guideRetourAccueil');
  if(guideRetourAccueil) guideRetourAccueil.addEventListener('click', ()=>{ state.vue = 'planificateur'; render(); });
  const guideImprimer = document.getElementById('guideImprimer');
  if(guideImprimer) guideImprimer.addEventListener('click', ()=>{ window.print(); });
  const telechargerCorpusComplet = document.getElementById('telechargerCorpusComplet');
  if(telechargerCorpusComplet) telechargerCorpusComplet.addEventListener('click', ()=>{ telechargerJSON('corpus_complet.json', corpusBrutComplet()); });
  const telechargerMesImports = document.getElementById('telechargerMesImports');
  if(telechargerMesImports) telechargerMesImports.addEventListener('click', ()=>{ telechargerJSON('mes_recettes_importees.json', lireStockage('corpus_utilisateur') || []); });
  const telechargerModeleVierge = document.getElementById('telechargerModeleVierge');
  if(telechargerModeleVierge) telechargerModeleVierge.addEventListener('click', ()=>{ telechargerJSON('modele_vierge.json', modeleJSONVierge()); });
  const telechargerExempleRempli = document.getElementById('telechargerExempleRempli');
  if(telechargerExempleRempli) telechargerExempleRempli.addEventListener('click', ()=>{ telechargerJSON('exemple_rempli.json', exempleJSONRempli()); });

  const toggleCorpusPanel = document.getElementById('toggleCorpusPanel');
  if(toggleCorpusPanel) toggleCorpusPanel.addEventListener('click', ()=>{ state.corpusPanelOuvert = !state.corpusPanelOuvert; state.corpusMessage = null; render(); });
  const importCorpusFile = document.getElementById('importCorpusFile');
  if(importCorpusFile) importCorpusFile.addEventListener('change', async ()=>{
    const fichiers = Array.from(importCorpusFile.files || []);
    if(!fichiers.length) return;
    let toutes = [];
    let erreurLecture = false;
    for(const f of fichiers){
      try{
        const texte = await f.text();
        const data = JSON.parse(texte);
        if(Array.isArray(data)) toutes = toutes.concat(data); else toutes.push(data);
      }catch(e){ erreurLecture = true; }
    }
    if(erreurLecture && !toutes.length){
      state.corpusMessage = { ok:false, texte:"Impossible de lire ce fichier — vérifie qu'il s'agit bien de JSON valide." };
      render(); return;
    }
    const resultat = await importerCorpus(toutes);
    let texte = `${resultat.ajoutes} recette(s) ajoutée(s), ${resultat.remplaces} remplacée(s)`;
    if(resultat.invalides) texte += `, ${resultat.invalides} ignorée(s) (id ou nom manquant)`;
    texte += `. Corpus total : ${resultat.total} recettes.`;
    state.corpusMessage = { ok:true, texte };
    render();
  });

  document.querySelectorAll('[data-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.mode = btn.dataset.mode; state.retraitsFixes = new Set(); if(state.mode==='custom') initCustomIfNeeded(); render(); });
  });
  const toStep2 = document.getElementById('toStep2');
  if(toStep2) toStep2.addEventListener('click', ()=>{ if(state.mode){ state.step=2; render(); }});

  document.querySelectorAll('input[data-slot][data-profil]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const v = Math.max(0, parseFloat(inp.value) || 0);
      state.custom[inp.dataset.slot][inp.dataset.profil] = v;
      render();
      const again = document.querySelector(`input[data-slot="${inp.dataset.slot}"][data-profil="${inp.dataset.profil}"]`);
      if(again) again.focus();
    });
  });
  document.querySelectorAll('[data-retire]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const id = btn.dataset.retire; state.custom[id].retire = !state.custom[id].retire; render(); });
  });
  document.querySelectorAll('[data-dispo-slot]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.dispo[btn.dataset.dispoSlot] = btn.dataset.dispoVal; render(); });
  });
  document.querySelectorAll('[data-rapide-reconso]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ state.rapideReconso[cb.dataset.rapideReconso] = cb.checked; render(); });
  });
  document.querySelectorAll('[data-retire-fixe]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const id = btn.dataset.retireFixe; if(state.retraitsFixes.has(id)) state.retraitsFixes.delete(id); else state.retraitsFixes.add(id); render(); });
  });

  document.querySelectorAll('[data-selmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.selectionMode = btn.dataset.selmode; render(); });
  });
  document.querySelectorAll('[data-filtre-thermo]').forEach(r=>{
    r.addEventListener('change', ()=>{ state.filtreThermomix = r.dataset.filtreThermo || null; render(); });
  });
  const toStep3manuel = document.getElementById('toStep3manuel');
  if(toStep3manuel) toStep3manuel.addEventListener('click', ()=>{ state.step=3; render(); });

  const critVege = document.getElementById('critVege');
  if(critVege) critVege.addEventListener('input', ()=>{ state.auto.nbVege = Math.max(0,parseInt(critVege.value)||0); });
  document.querySelectorAll('[data-saison]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const s = cb.dataset.saison; const idx = state.auto.saisons.indexOf(s);
      if(cb.checked && idx===-1) state.auto.saisons.push(s);
      if(!cb.checked && idx>-1) state.auto.saisons.splice(idx,1);
    });
  });
  const critRepetition = document.getElementById('critRepetition');
  if(critRepetition) critRepetition.addEventListener('change', ()=>{ state.auto.eviterRepetition = critRepetition.checked; });
  const genererAuto = document.getElementById('genererAuto');
  if(genererAuto) genererAuto.addEventListener('click', ()=>{
    const resultat = genererPropositionAuto(state.auto);
    if(state.mode==='custom') state.choixLots = resultat; else state.choix = resultat;
    state.step=3; render();
  });

  document.querySelectorAll('select[data-letter]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ state.choix[sel.dataset.letter] = sel.value || undefined; render(); });
  });
  document.querySelectorAll('select[data-lot]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ state.choixLots[sel.dataset.lot] = sel.value || undefined; render(); });
  });
  const toStep4 = document.getElementById('toStep4');
  if(toStep4) toStep4.addEventListener('click', ()=>{ state.step=4; render(); });
  const toStep5 = document.getElementById('toStep5');
  if(toStep5) toStep5.addEventListener('click', ()=>{ enregistrerSemaineActuelle(); state.step=5; render(); });
  const toStep6 = document.getElementById('toStep6');
  if(toStep6) toStep6.addEventListener('click', ()=>{ state.step=6; render(); });
  const backTo1 = document.getElementById('backTo1');
  if(backTo1) backTo1.addEventListener('click', ()=>{ state.step=1; render(); });
  const backTo2 = document.getElementById('backTo2');
  if(backTo2) backTo2.addEventListener('click', ()=>{ state.step=2; render(); });
  const backTo3 = document.getElementById('backTo3');
  if(backTo3) backTo3.addEventListener('click', ()=>{ state.step=3; render(); });
  const backTo4 = document.getElementById('backTo4');
  if(backTo4) backTo4.addEventListener('click', ()=>{ state.step=4; render(); });
  const backTo4depuis6 = document.getElementById('backTo4depuis6');
  if(backTo4depuis6) backTo4depuis6.addEventListener('click', ()=>{ state.step=4; render(); });
  const imprimerCarnet = document.getElementById('imprimerCarnet');
  if(imprimerCarnet) imprimerCarnet.addEventListener('click', ()=>{ window.print(); });
  const imprimerCourses = document.getElementById('imprimerCourses');
  if(imprimerCourses) imprimerCourses.addEventListener('click', ()=>{ window.print(); });
  const semaineSuivante = document.getElementById('semaineSuivante');
  if(semaineSuivante) semaineSuivante.addEventListener('click', ()=>{
    reinitialiserPourNouvelleSemaine();
    render();
  });

  document.querySelectorAll('input[data-item]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.item;
      if(cb.checked) state.cochees.add(key); else state.cochees.delete(key);
      render();
    });
  });
}

app.innerHTML = '<p style="color:#2B2620;padding:32px 20px;font-family:system-ui, -apple-system, sans-serif;">Chargement…</p>';
document.getElementById('boutonAccueilFixe').addEventListener('click', ()=>{
  if(!confirm("Revenir à l'accueil ? La tâche en cours sera abandonnée, sans être enregistrée.")) return;
  reinitialiserPourNouvelleSemaine();
  render();
});
(async () => {
  await chargerCorpusPersonnalise();
  await chargerHistorique();
})();
</script>
</body>
</html>
